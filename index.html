<script type="text/plain" id="exportJS">
var S = JSON.parse(document.getElementById('stateJSON').textContent);
var SD = S.symdefs, ZOOM = 1, SEL = null, TAB = 'notes', TOOL = null;
var LAY = { notes:true, syms:true, dims:true };
var CLR = { f:'#E1504B', w:'#E38B00', i:'#0000FF', o:'#16A34A' };
var Q = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ var t=Q('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(function(){t.classList.remove('on');},2000); }

var IMG = Q('#planImg');
function fit(){
  var h=Q('#host'), aw=Math.max(60,h.clientWidth-24), ah=Math.max(60,h.clientHeight-24);
  var ar=S.imgW/S.imgH, w=aw, hh=w/ar;
  if(hh>ah){ hh=ah; w=hh*ar; }
  return { w:w*ZOOM, h:hh*ZOOM };
}
function layout(){
  var f=fit(), box=Q('#box'), ov=Q('#ov');
  box.style.width=f.w+'px'; box.style.height=f.h+'px';
  var dpr=Math.min(2, window.devicePixelRatio||1);
  ov.width=Math.round(f.w*dpr); ov.height=Math.round(f.h*dpr);
  ov.style.width=f.w+'px'; ov.style.height=f.h+'px';
  Q('#zl').textContent=Math.round(ZOOM*100)+'%';
  draw(); syms();
}
function draw(){
  var f=fit(), ov=Q('#ov'), c=ov.getContext('2d');
  var dpr=Math.min(2, window.devicePixelRatio||1);
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,f.w,f.h);
  MK=[];
  if(LAY.dims) (S.dims||[]).forEach(function(d){
    var x1=d.x1*f.w, y1=d.y1*f.h, x2=d.x2*f.w, y2=d.y2*f.h;
    var col=d.calib?'#0000FF':'#D6009A';
    c.strokeStyle=col; c.lineWidth=1.6;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    var a=Math.atan2(y2-y1,x2-x1);
    [[x1,y1],[x2,y2]].forEach(function(p){
      c.beginPath();
      c.moveTo(p[0]-Math.sin(a)*7, p[1]+Math.cos(a)*7);
      c.lineTo(p[0]+Math.sin(a)*7, p[1]-Math.cos(a)*7); c.stroke();
    });
    var lb=d.label||'—', mx=(x1+x2)/2, my=(y1+y2)/2;
    c.font='600 11px Helvetica,Arial'; c.textAlign='center'; c.textBaseline='middle';
    var tw=c.measureText(lb).width+9;
    c.fillStyle='#fff'; c.fillRect(mx-tw/2,my-8,tw,16);
    c.strokeStyle=col; c.lineWidth=1.2; c.strokeRect(mx-tw/2,my-8,tw,16);
    c.fillStyle=col; c.fillText(lb,mx,my+0.5);
  });
  if(LAY.notes) S.notes.forEach(function(n){
    if(n.nx==null) return;
    var x=n.nx*f.w, y=n.ny*f.h, Sz=Math.max(18,Math.min(26,f.w/48));
    var col=CLR[n.lv]||'#8A8A8A', bx=x+Sz*0.85, by=y-Sz*0.85-Sz;
    c.strokeStyle=col; c.lineWidth=1.6;
    c.beginPath(); c.moveTo(x,y); c.lineTo(bx,by+Sz); c.stroke();
    c.fillStyle='#fff'; c.fillRect(bx-1.5,by-1.5,Sz+3,Sz+3);
    c.fillStyle=col; c.fillRect(bx,by,Sz,Sz);
    c.fillStyle='#fff'; c.font='700 '+Math.round(Sz*0.52)+'px Helvetica,Arial';
    c.textAlign='center'; c.textBaseline='middle';
    c.fillText(n.num, bx+Sz/2, by+Sz/2+0.5);
    c.fillStyle=col; c.beginPath(); c.arc(x,y,3.2,0,6.284); c.fill();
    c.strokeStyle='#fff'; c.lineWidth=1; c.stroke();
    if(SEL===n.id){ c.strokeStyle='#CFFF04'; c.lineWidth=2.5; c.strokeRect(bx-3,by-3,Sz+6,Sz+6); }
    MK.push({id:n.id,bx:bx,by:by,S:Sz});
  });
}
var MK=[];
function syms(){
  var L=Q('#sl'); L.style.display=LAY.syms?'block':'none'; L.innerHTML='';
  (S.symbols||[]).forEach(function(s){
    var d=SD[s.k]; if(!d) return;
    var el=document.createElement('div');
    el.className='sym'; el.style.left=(s.nx*100)+'%'; el.style.top=(s.ny*100)+'%';
    el.innerHTML='<div class="sbx" style="background:'+d.c+'">'+esc(d.t)+'</div><div class="del">×</div>';
    el.querySelector('.del').onclick=function(e){
      e.stopPropagation();
      S.symbols=S.symbols.filter(function(x){return x.id!==s.id;}); render();
    };
    el.onpointerdown=function(e){
      if(e.target.className==='del') return;
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      var b=Q('#box').getBoundingClientRect();
      function mv(ev){
        s.nx=Math.min(1,Math.max(0,(ev.clientX-b.left)/b.width));
        s.ny=Math.min(1,Math.max(0,(ev.clientY-b.top)/b.height));
        el.style.left=(s.nx*100)+'%'; el.style.top=(s.ny*100)+'%';
      }
      function up(){ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); }
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
    };
    L.appendChild(el);
  });
}
Q('#box').addEventListener('click', function(e){
  if(e.target.closest('.sym')) return;
  var b=Q('#box').getBoundingClientRect();
  var nx=(e.clientX-b.left)/b.width, ny=(e.clientY-b.top)/b.height;
  if(TOOL && TOOL.indexOf('sym:')===0){
    S.symbols.push({id:'s'+Date.now(), k:TOOL.slice(4), nx:nx, ny:ny});
    TOOL=null; Q('#box').style.cursor='default'; render(); return;
  }
  var f=fit(), mx=nx*f.w, my=ny*f.h;
  var hit=MK.filter(function(m){
    return mx>=m.bx-5&&mx<=m.bx+m.S+5&&my>=m.by-5&&my<=m.by+m.S+5; })[0];
  SEL=hit?hit.id:null;
  if(hit){ TAB='notes'; render();
    var el=document.getElementById('c-'+hit.id);
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  } else draw();
});
function zoom(z){ ZOOM=Math.min(6,Math.max(0.3,z)); layout(); }
function lay(k,btn){ LAY[k]=!LAY[k]; document.getElementById(btn).classList.toggle('on',LAY[k]); layout(); }

/* ---------- panel ---------- */
var TABS=[['iron','ברזל'],['notes','הערות'],['prog','פרוגרמה'],['open','לא נראה'],['sym','סימבולים']];
function render(){
  var f=S.notes.filter(function(n){return n.lv==='f';}).length;
  var w=S.notes.filter(function(n){return n.lv==='w';}).length;
  var io=(S.iron||[]).filter(function(r){return r.level==='o';}).length;
  Q('#tiles').innerHTML=
    tile(f,'שגוי',f?'#E1504B':'')+tile(w,'תיקון קל',w?'#E38B00':'')+
    tile(io+'/4','כללי ברזל',io===4?'#16A34A':'#E1504B')+tile(S.stats.tags,'תגיות','')+
    tile(S.stats.ws||'—','עמדות','')+tile(S.stats.seats||'—','מקומות','')+
    tile(S.stats.area||'—','מ״ר','')+tile((S.symbols||[]).length,'סימבולים','');
  Q('#tabs').innerHTML=TABS.map(function(t){
    return '<button class="tab '+(TAB===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
  var B=Q('#body');
  if(TAB==='notes'){ B.innerHTML=vNotes(); bind(); }
  else if(TAB==='iron') B.innerHTML=vIron();
  else if(TAB==='prog') B.innerHTML=vProg();
  else if(TAB==='open') B.innerHTML=vOpen();
  else B.innerHTML=vSym();
  buildPrint(); draw(); syms();
}
function tile(n,l,c){
  return '<div class="tile"><div class="n"'+(c?' style="color:'+c+'"':'')+'>'+n+'</div><div class="l">'+l+'</div></div>';
}
function setTab(k){ TAB=k; render(); }
function vNotes(){
  if(!S.notes.length) return '<div class="empty">אין הערות.</div>';
  var g=[['f','שגוי — לתיקון'],['w','תיקון קל'],['i','מידע / ידני'],['o','תקין']], h='';
  g.forEach(function(x){
    var L=S.notes.filter(function(n){return n.lv===x[0];});
    if(!L.length) return;
    h+='<div class="gt">'+x[1]+' · '+L.length+'</div>';
    h+=L.map(function(n){
      return '<div class="card '+n.lv+(SEL===n.id?' sel':'')+'" id="c-'+n.id+'" data-id="'+n.id+'">'+
        '<div class="ch"><span class="num '+n.lv+'">'+n.num+'</span>'+
        '<span class="ct">'+esc(n.title)+'</span><span class="cs">'+esc(n.sub)+'</span></div>'+
        '<div class="cb" contenteditable="true" data-id="'+n.id+'">'+esc(n.body)+'</div>'+
        '<div class="cact"><button class="xb" data-a="lv" data-id="'+n.id+'">שנה דרגה</button>'+
        (n.nx!=null?'<button class="xb" data-a="go" data-id="'+n.id+'">הצג</button>':'')+
        '<button class="xb" data-a="del" data-id="'+n.id+'">מחק</button></div></div>';
    }).join('');
  });
  return h;
}
function bind(){
  Q('#body').querySelectorAll('.cb').forEach(function(el){
    el.onblur=function(){
      var n=S.notes.filter(function(x){return x.id===el.dataset.id;})[0];
      if(n) n.body=el.textContent.trim();
    };
  });
  Q('#body').querySelectorAll('.xb[data-a]').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var n=S.notes.filter(function(x){return x.id===b.dataset.id;})[0]; if(!n) return;
      if(b.dataset.a==='lv'){ var o=['f','w','i','o']; n.lv=o[(o.indexOf(n.lv)+1)%4]; renum(); }
      if(b.dataset.a==='go'){ SEL=n.id; }
      if(b.dataset.a==='del'){ S.notes=S.notes.filter(function(x){return x.id!==n.id;}); renum(); }
      render();
    };
  });
}
function renum(){
  var o={f:0,w:1,i:2,o:3};
  S.notes.sort(function(a,b){return o[a.lv]-o[b.lv];});
  S.notes.forEach(function(n,i){ n.num=i+1; });
}
function vIron(){
  return '<div class="gt">כללי ברזל</div>'+(S.iron||[]).map(function(r){
    return '<div class="iron '+r.level+'"><div class="ih"><span class="chip '+
      (r.level==='o'?'o':'f')+'">'+(r.level==='o'?'✓':'חסר')+'</span><span class="it">'+
      esc(r.n)+'</span><span class="cs">'+esc(r.src)+'</span></div><div class="ib">'+esc(r.msg)+'</div></div>';
  }).join('');
}
function vProg(){
  var h='<div class="gt">'+(S.progTitle||'פרוגרמה')+'</div>';
  h+='<table class="pg"><thead><tr><th>פונקציה</th><th>יעד</th><th>בתכנית</th><th>Δ</th></tr></thead><tbody>';
  (S.prog||[]).forEach(function(r){
    h+='<tr class="'+r.cls+'"><td class="fn">'+esc(r.fn)+'</td><td>'+esc(r.goal)+
       '</td><td>'+esc(r.found)+'</td><td>'+esc(r.delta)+'</td></tr>';
  });
  return h+'</tbody></table>';
}
function vOpen(){
  return '<div class="gt">מה שהתכנית לא מגלה</div>'+(S.openList||[]).map(function(c){
    var cur=S.manual[c.id]||'na';
    return '<div class="iron '+(cur==='ok'?'o':cur==='fail'?'f':'w')+'"><div class="ih">'+
      '<span class="it">'+esc(c.n)+'</span><span class="tri">'+
      '<button class="'+(cur==='ok'?'a-ok':'')+'" onclick="mset(\''+c.id+'\',\'ok\')">תקין</button>'+
      '<button class="'+(cur==='fail'?'a-fail':'')+'" onclick="mset(\''+c.id+'\',\'fail\')">לא תקין</button>'+
      '<button class="'+(cur==='na'?'a-na':'')+'" onclick="mset(\''+c.id+'\',\'na\')">פתוח</button>'+
      '</span></div><div class="ib">'+esc(c.note||'')+'</div></div>';
  }).join('');
}
function mset(id,v){ S.manual[id]=v; render(); }
function vSym(){
  var h='<div class="gt">הוסף סימבול — לחץ ואז לחץ על התכנית</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:5px">';
  Object.keys(SD).forEach(function(k){
    var d=SD[k];
    h+='<div class="card" style="border-inline-start-color:'+d.c+'" onclick="arm(\''+k+'\')">'+
       '<div class="ch"><span class="num" style="background:'+d.c+'">'+esc(d.t)+
       '</span><span class="ct" style="font-size:10px">'+esc(d.n)+'</span></div></div>';
  });
  h+='</div><div class="gt">על התכנית · '+(S.symbols||[]).length+'</div>';
  h+=(S.symbols||[]).length ? S.symbols.map(function(s){
    var d=SD[s.k];
    return '<div class="card"><div class="ch"><span class="num" style="background:'+d.c+'">'+
      esc(d.t)+'</span><span class="ct">'+esc(d.n)+'</span></div></div>';
  }).join('') : '<div class="empty">אין סימבולים.</div>';
  return h;
}
function arm(k){ TOOL='sym:'+k; Q('#box').style.cursor='crosshair'; toast('לחץ על התכנית'); }

/* ---------- print sheet ---------- */
function buildPrint(){
  var g=[['f','שגוי — לתיקון'],['w','תיקון קל'],['i','מידע / ידני']], h='';
  h+='<h3>'+esc(S.title)+' · '+esc(S.date)+'</h3>';
  g.forEach(function(x){
    var L=S.notes.filter(function(n){return n.lv===x[0];});
    if(!L.length) return;
    h+='<h3>'+x[1]+'</h3>';
    h+=L.map(function(n){
      return '<div class="pi"><div class="pn" style="background:'+CLR[n.lv]+'">'+n.num+
        '</div><div class="pr">'+esc(n.title)+'<small>'+esc(n.sub)+'</small></div>'+
        '<div class="pw">'+esc(n.body)+'</div></div>';
    }).join('');
  });
  var open=(S.openList||[]).filter(function(c){ return (S.manual[c.id]||'na')!=='ok'; });
  if(open.length){
    h+='<h3>פריטים פתוחים לאימות</h3>';
    h+=open.map(function(c){
      return '<div class="pi"><div class="pn" style="background:#8A8A8A">○</div>'+
        '<div class="pr">'+esc(c.n)+'</div><div class="pw">'+esc(c.note||'')+'</div></div>';
    }).join('');
  }
  h+='<div style="margin-top:26px;padding-top:12px;border-top:1px solid #1B1B1B;font-size:10px;opacity:.6;line-height:1.7">'+
     'הופק ע״י RDA Test Fit Checker מתוך תגיות התוכנית ובדיקה ידנית. אינו מחליף בדיקת נגישות, בטיחות, מילוט או אישור יועצים. Roy David Architects · roydavid.co</div>';
  Q('#print').innerHTML=h;
}

/* ---------- save updated copy ---------- */
function saveCopy(){
  document.getElementById('stateJSON').textContent=JSON.stringify(S);
  Q('#tiles').innerHTML=''; Q('#tabs').innerHTML=''; Q('#body').innerHTML='';
  Q('#sl').innerHTML=''; Q('#print').innerHTML='';
  var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  var b=new Blob([html],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=(S.title||'testfit')+'-review.html';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
  render();
  toast('עותק מעודכן נשמר');
}
function saveData(){
  var out={ meta:{title:S.title,date:S.date}, notes:S.notes, symbols:S.symbols,
    dims:S.dims, manual:S.manual, program:S.prog };
  var b=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=(S.title||'testfit')+'-data.json'; a.click();
}
window.addEventListener('resize', function(){ clearTimeout(window._rt); window._rt=setTimeout(layout,120); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ TOOL=null; Q('#box').style.cursor='default'; } });
if(IMG.complete) { layout(); render(); }
else IMG.onload=function(){ layout(); render(); };
</script>
