/* A freehand drag ends with pointerup and is normally followed by a click we
   must swallow. Time-boxing it instead of a sticky flag means a drag that ends
   off-canvas (or a pointercancel) cannot eat the user's next real click. */
let SKIPUNTIL=0;
function skipNextClick(){ SKIPUNTIL=Date.now()+300; }
$('#planBox').addEventListener('click', e=>{
  if(e.target.closest('.sym')) return;
  if(Date.now()<SKIPUNTIL){ SKIPUNTIL=0; return; }
  const p=planPoint(e);
  if(!TOOL){
    const {w,h}=boxSize(); const mx=p.nx*w, my=p.ny*h;
    const hit=MARKERS.find(m=>mx>=m.bx-5&&mx<=m.bx+m.S+5&&my>=m.by-5&&my<=m.by+m.S+5);
    if(hit){ selectNote(hit.id); return; }
    const ah=STATE.areas.find(a=>pointInPoly(p,a.pts));
    if(ah){ SEL=ah.id; setTab('sym'); drawOverlay(); return; }
    SEL=null; drawOverlay(); placeSymbols();
    return;
  }
  if(TOOL.startsWith('sym:')){
    const k=TOOL.slice(4);
    STATE.symbols.push({id:'s'+(STATE.seq++), k, nx:p.nx, ny:p.ny, label:''});
    armTool(null); refresh(); toast(T('tSymAdded'));
    return;
  }
  if(TOOL==='pin'){
    STATE.notes.push({ id:'c'+(STATE.seq++), lv:'i', src:'custom', title:T('noteTitle'), sub:T('noteManual'),
      body:T('noteEditMe'), edited:true, nx:p.nx, ny:p.ny });
    armTool(null); refresh(); toast(T('tNoteAdded'));
    return;
  }
  if(TOOL==='area'){
    if(!PENDING) PENDING={kind:'area', pts:[], mx:p.nx, my:p.ny};
    const first=PENDING.pts[0];
    /* clicking back on the first vertex closes the loop */
    if(first && PENDING.pts.length>=3){
      const {w,h}=boxSize();
      if(Math.hypot((p.nx-first.x)*w,(p.ny-first.y)*h)<10){ finishArea(); return; }
    }
    PENDING.pts.push({x:p.nx,y:p.ny}); drawOverlay();
    return;
  }
  if(TOOL==='dim'||TOOL==='calib'){
    if(!PENDING){ PENDING={kind:'dim', x1:p.nx,y1:p.ny,mx:p.nx,my:p.ny}; drawOverlay(); return; }
    const d={ id:'d'+(STATE.seq++), x1:PENDING.x1, y1:PENDING.y1, x2:p.nx, y2:p.ny, calib:TOOL==='calib' };
    const px=dimPx(d);
    if(TOOL==='calib'){
      const v=prompt(T('askCalib'),'');
      const cm=parseFloat(String(v).replace(',','.'));
      if(!cm||cm<=0){ PENDING=null; armTool(null); drawOverlay(); return; }
      const m=cm/100;
      STATE.calib={ mPerPx:m/px };
      d.manualM=m;
      STATE.dims.push(d); PENDING=null; armTool(null);
      relabelMeasures(); refresh();
      toast(T('tCalibDone'));
      return;
    }
    if(!STATE.calib){
      const v=prompt(T('askDim'),'');
      const cm=parseFloat(String(v).replace(',','.'));
      if(cm>0) d.manualM=cm/100;
    }
    STATE.dims.push(d); PENDING=null; armTool(null);
    relabelMeasures(); refresh();
  }
});
$('#planBox').addEventListener('dblclick', e=>{
  if(TOOL==='area'&&PENDING&&PENDING.pts.length>=3){ e.preventDefault(); skipNextClick(); finishArea(); }
});
$('#planBox').addEventListener('mousemove', e=>{
  if(PENDING&&PENDING.kind!=='cloud'){ const p=planPoint(e); PENDING.mx=p.nx; PENDING.my=p.ny; drawOverlay(); }
});

function finishArea(){
  if(!PENDING||PENDING.pts.length<3){ PENDING=null; armTool(null); drawOverlay(); return; }
  const pts=PENDING.pts.slice();
  const name=(prompt(T('askRoom'),'')||'').trim();
  const a={ id:'a'+(STATE.seq++), pts, name };
  STATE.areas.push(a);
  PENDING=null; armTool(null);
  relabelMeasures(); refresh();
  toast(a.m2 ? T('tAreaDone',a.m2) : T('tAreaSaved'));
}
function pointInPoly(p, pts){
  if(!pts||pts.length<3) return false;
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const a=pts[i], b=pts[j];
    if((a.y>p.ny)!==(b.y>p.ny) && p.nx < (b.x-a.x)*(p.ny-a.y)/(b.y-a.y)+a.x) inside=!inside;
  }
  return inside;
}

/* ---- revision cloud: freehand drag, sampled so the arc walk stays even ---- */
$('#planBox').addEventListener('pointerdown', e=>{
  if(TOOL!=='cloud'||e.button!==0) return;
  e.preventDefault();
  const box=$('#planBox');
  box.setPointerCapture(e.pointerId);
  const p=planPoint(e);
  PENDING={kind:'cloud', pts:[{x:p.nx,y:p.ny}]};
  const mv=ev=>{
    const q=planPoint(ev), last=PENDING.pts[PENDING.pts.length-1];
    const {w,h}=boxSize();
    if(Math.hypot((q.nx-last.x)*w,(q.ny-last.y)*h)<8) return;
    PENDING.pts.push({x:q.nx,y:q.ny}); drawOverlay();
  };
  const up=()=>{
    box.removeEventListener('pointermove',mv); box.removeEventListener('pointerup',up);
    box.removeEventListener('pointercancel',up);
    skipNextClick();
    finishCloud();
  };
  box.addEventListener('pointermove',mv);
  box.addEventListener('pointerup',up);
  box.addEventListener('pointercancel',up);
});

function finishCloud(){
  const pts=(PENDING&&PENDING.pts)||[];
  PENDING=null;
  if(pts.length<3){ armTool(null); drawOverlay(); toast(T('tCloudShort')); return; }

    title:body.length>34?body.slice(0,34)+'…':body, sub:T('cloudSub'),
    body, edited:true, pts, nx:null, ny:null

}

$('#planBox').addEventListener('drop', e=>{

function dimPx(d){
  const dx=(d.x2-d.x1)*BASE.width, dy=(d.y2-d.y1)*BASE.height;
  return Math.hypot(dx,dy);
}
document.addEventListener('keydown', e=>{

});

/* every code is offered; the ones another room already holds are marked,

function assignSelect(rk){
  const S=STATE.sched, cur=STATE.assign[rk]||'';
  const holder={}; S.ctx.forEach(c=>{ if(c.entry) holder[c.entry.e.code]=holder[c.entry.e.code]||roomKey(c.r.tag,c.r.i); });
  const opts=S.entries.map(x=>{
    const e=x.e, taken=holder[e.code]&&holder[e.code]!==rk;
    const lbl=e.code+' · '+(L(e.fn)||e.key)+(e.dept?' · '+e.dept:'')+(taken?' ●':'');
    return `<option value="${esc(e.code)}" ${cur===e.code?'selected':''}>${esc(lbl)}</option>`;
  }).join('');
  return `<div class="asg"><label>${T('assignLbl')}</label>
    <select onchange="setAssign('${rk}', this.value)" onclick="event.stopPropagation()">
      <option value="" ${!cur?'selected':''}>${T('assignAuto')}</option>
      <option value="__extra" ${cur==='__extra'?'selected':''}>${T('assignExtra')}</option>
      ${opts}
    </select></div>`;

function viewProgramSource(src){

/* prebuiltBase lets a non-PDF source (e.g. a Revit room export) supply its
   own canvas and skip renderBase() entirely — every check downstream reads
   from parse.tags, not from the PDF page, so the rest of the pipeline is
   identical either way. */
/* Every room/floor result is derived from the parse + the programme + the
   hand assignments. One place rebuilds it all, so loading a programme
   after the plan, switching language or assigning a room can never leave
   a stale table behind. */
function recheck(){
  if(!STATE.parse) return;
  STATE.rooms=STATE.parse.tags.map((tag,i)=>({tag, i:i+1}));
  STATE.sched = hasSchedule() ? matchSchedule(STATE.rooms) : null;
  STATE.rooms.forEach(r=>{ r.check=checkRoom(r.tag, STATE.sched?r.sched:null); });
  STATE.adj = adjacency(STATE.rooms);
  const fc=floorChecks(STATE.parse, STATE.rooms);
  STATE.floor=fc;
  buildNotes(STATE.rooms, fc);
  STATE.openItems=openItems(STATE.rooms);
}
function setAssign(rk, v){

/* =====================================================================
   13c. REVIT ROOM IMPORT — the macro's JSON export becomes a real, exact
   vector plan. Because we draw it ourselves from true room geometry, the
   world scale is known outright: no manual calibration step, and every
   dimension/area tool is correct from the first click.
   ===================================================================== */
/* a hand-edited export can put a number where a string belongs or vice versa
   — never let that throw mid-import, just fall back cleanly */
const numOr=(v,fallback)=>{ const n=Number(v); return Number.isFinite(n)?n:fallback; };
/* Number(null) and Number('') are 0 — an empty Revit field must stay empty */
const numN=v=> (v==null||v==='') ? null : numOr(v,null);
const strOr=v=> typeof v==='string' ? v : '';
/* Revit's Room.Name getter returns "Name Number" — drop the trailing number
   so it is not shown (or matched) twice */
function roomName(r){
  const n=strOr(r.name).trim(), num=r.number!=null?String(r.number).trim():'';
  return (num && n.length>num.length && n.endsWith(' '+num)) ? n.slice(0,-num.length).trim() : n;
}

function pickPrimaryLevel(exp, hint){
  const byLevel={};
  /* a hand-edited or partially-written export could carry a null entry, a
     bare string, anything — only real room objects get grouped */
  (Array.isArray(exp.rooms)?exp.rooms:[]).filter(r=>r&&typeof r==='object').forEach(r=>{
    const lv=typeof r.level==='string'?r.level:'';
    (byLevel[lv]=byLevel[lv]||[]).push(r);
  });
  const names=Object.keys(byLevel);
  let matched=null;
  if(hint){
    const h=hint.toLowerCase();
    matched = names.find(k=>k.toLowerCase()===h) || names.find(k=>k.toLowerCase().includes(h));
  }
  if(matched) return { level:matched, rooms:byLevel[matched], hintMatched:true };

  let best=null, bestN=-1;
  names.forEach(k=>{ if(byLevel[k].length>bestN){ bestN=byLevel[k].length; best=k; } });
  return { level:best, rooms:best!=null?byLevel[best]:[], hintMatched:false };
}
/* the outer loop is whichever ring encloses the most area — inner loops
   (columns, shafts) are smaller and drawn as unfilled holes */
/* A hand-edited or partially-written export can carry a point that isn't a
   [x,y] pair, or a coordinate that isn't a finite number — never let one bad
   point silently become a NaN that draws nothing and derails the room's
   whole bounding box. Bad points are dropped; a loop left with under 3
   points (not a real polygon) is dropped entirely. */
function outerLoop(room){
  const rawLoops=Array.isArray(room.boundary)?room.boundary:[];
  const loops=rawLoops.map(loop=>{
    if(!Array.isArray(loop)) return [];
    return loop
      .filter(p=>Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]))
      .map(p=>({x:p[0],y:p[1]}));
  }).filter(l=>l.length>=3);
  if(!loops.length) return {outer:null, holes:[]};
  let oi=0, best=-1;
  loops.forEach((l,i)=>{ const a=Math.abs(shoelace(l)); if(a>best){ best=a; oi=i; } });
  return { outer:loops[oi], holes:loops.filter((_,i)=>i!==oi) };
}
function renderRoomsBase(rooms){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const parsed=rooms.map(r=>{ const lp=outerLoop(r);
    (lp.outer||[]).forEach(p=>{ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; });
    return { r, outer:lp.outer, holes:lp.holes };
  }).filter(p=>p.outer && p.outer.length>=3);
  if(!parsed.length) throw new Error(isHe()?'לא נמצאו קונטורים גיאומטריים בקובץ':'No room geometry found in the file');

  const worldW=Math.max(0.01,maxX-minX), worldH=Math.max(0.01,maxY-minY);
  const margin=1.5; /* metres of blank border, so labels near the edge fit */
  const longSide=2000, scale=longSide/Math.max(worldW+margin*2, worldH+margin*2);
  const w=Math.round((worldW+margin*2)*scale), h=Math.round((worldH+margin*2)*scale);

  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const c=cv.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,w,h);
  const toPx=p=>({ x:(p.x-minX+margin)*scale, y:h-(p.y-minY+margin)*scale }); /* flip Y: plan reads north-up */

  parsed.forEach(({r,outer,holes})=>{
    const pts=outer.map(toPx);
    c.beginPath();
    pts.forEach((p,i)=> i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));
    c.closePath();
    c.fillStyle='#F4F4F4'; c.fill();
    c.strokeStyle='#1B1B1B'; c.lineWidth=1.4; c.stroke();
    holes.forEach(hl=>{
      const hp=hl.map(toPx);
      c.beginPath();
      hp.forEach((p,i)=> i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));
      c.closePath();
      c.fillStyle='#fff'; c.fill();
      c.strokeStyle='#8A8A8A'; c.lineWidth=1; c.stroke();
    });
    const ct=polyCentroid(outer.map(p=>({x:p.x,y:p.y})));
    const cpx=toPx(ct);
    const areaM2=numOr(r.areaM2,null);
    const label=(roomName(r))+(r.number!=null&&r.number!==''?' '+r.number:'');
    c.fillStyle='#1B1B1B'; c.textAlign='center'; c.textBaseline='middle';
    c.font='600 12px Helvetica,Arial';
    if(label) c.fillText(label, cpx.x, cpx.y-7);
    c.font='400 11px Helvetica,Arial';
    c.fillText(areaM2?areaM2.toFixed(1)+' '+T('uM2'):'', cpx.x, cpx.y+8);
    r._centroidPx={x:cpx.x/w, y:cpx.y/h};
  });
  return { canvas:cv, w, h, scale, minX, minY, maxX, maxY };
}

async function applyRoomExport(exp, levelHint){
  const picked=pickPrimaryLevel(exp, levelHint);
  if(!picked.rooms.length) throw new Error(isHe()?'לא נמצאו חדרים בקובץ':'No rooms found in the file');
  const built=renderRoomsBase(picked.rooms);

  const tags=picked.rooms.map(r=>{
    const area=numOr(r.areaM2,null);
    /* Revit Number may hold a programme code (FL01-MR-02) — it is kept on
       its own, and also tells classify() the room type outright */
    const number=r.number!=null?String(r.number).trim():'';
    const pc=parseCode(number);
    const lp=outerLoop(r);
    return {
      area:area!=null?+area.toFixed(2):null,
      ppl:numN(r.capacity)!=null?Math.round(numN(r.capacity)):null,
      stations:null, code:null, isDept:false, names:[],
      name:(roomName(r)+(number?' '+number:'')).trim(),
      rname:roomName(r), number, department:strOr(r.department).trim(),
      codeType:pc?CODE_PREFIX[pc.pre]:null,
      rid:(r.id!=null&&r.id!=='')?r.id:null,
      poly:lp.outer,
      nx:r._centroidPx?r._centroidPx.x:0.5, ny:r._centroidPx?r._centroidPx.y:0.5,
      pdfX:0, pdfY:0
    };
  });
  const allText=picked.rooms.flatMap(r=>[r.name,r.department,r.comments].filter(v=>typeof v==='string'&&v).map(s=>s.toLowerCase()));
  const parse={ tags, allText, fileName:(exp.meta&&exp.meta.fileName)||'revit-export', page:null, vp1:null };

  if(exp.meta){
    STATE.meta = Object.assign({}, STATE.meta, {
      project: STATE.meta.project || exp.meta.project || '',
      client:  STATE.meta.client  || exp.meta.client  || '',
      floor:   STATE.meta.floor   || picked.level || '',
      author:  STATE.meta.author  || ''
    });
    if(exp.meta.issueDate && exp.meta.issueDate!=='Issue Date' && !STATE.meta.date) STATE.meta.date=exp.meta.issueDate;
  }

  STATE.calib={ mPerPx: 1/built.scale };
  await run(parse, built.canvas);
  relabelMeasures(); refresh();

  const base = isHe()
    ? `יובאו ${picked.rooms.length} חדרים מרוויט (${picked.level||'—'}) — קנה המידה מדויק, אין צורך בכיול.`
    : `Imported ${picked.rooms.length} rooms from Revit (${picked.level||'—'}) — the scale is exact, no calibration needed.`;
  const hintNote = levelHint ? ' '+(picked.hintMatched ? T('rvtLevelMatched',picked.level) : T('rvtLevelNoMatch',levelHint)) : '';
  toast(base+hintNote);
}

/* =====================================================================
   13b. LANGUAGE SWITCH
   Static labels carry data-t (textContent) or data-th (innerHTML).
   Everything else is generated through T(), so a re-render is enough.
   ===================================================================== */
function applyStatic(){
  document.documentElement.lang = LANG;
  document.documentElement.dir  = isHe() ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = T(el.dataset.t); });
  document.querySelectorAll('[data-th]').forEach(el=>{ el.innerHTML  = T(el.dataset.th); });
  document.querySelectorAll('[data-tp]').forEach(el=>{ el.placeholder = T(el.dataset.tp); });
  const lb=$('#btnLang');
  if(lb){
    lb.textContent=T('langBtn'); lb.title=T('langTitle');
    /* Keep the switch in the visual left corner in both directions. `order`
       proved unreliable here, so move the node: in an RTL row the last child
       is the leftmost, in an LTR row it is the first. */
    const hd=lb.parentNode;
    if(isHe()) hd.appendChild(lb);
    else hd.insertBefore(lb, hd.firstChild);
  }
  document.title = 'RDA — Test Fit Checker';
}
function setLang(l){
  if(l!=='he'&&l!=='en') return;
  LANG=l;
  try{ localStorage.setItem('rda-lang', l); }catch(e){}
  applyStatic();
  if(!PDFJS_OK) showError(T('errPdfjs'));
  if(BASE){
    /* rule text, type names and open items are all language-derived —
       rebuild them so nothing is left in the previous language */
    if(STATE.mode==='auto'&&STATE.parse){
      recheck();
      STATE.ironR=ironChecks(STATE.parse, STATE.rooms);
    }
    retitleManualNotes();
    stampHeader();
    refresh();
    layout();
  }
}

/* =====================================================================
   14a. XLSX WRITER — store-only ZIP + SpreadsheetML, no dependencies.
   An HTML table renamed .xls trips Excel's format warning, so this
   builds the real thing: one part per sheet, RTL, styled.
   ===================================================================== */
const CRC_T=(()=>{
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(u8){
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[];
  let offset=0;
  files.forEach(f=>{
    const nb=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array(30+nb.length), v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0x0800,true);
    v.setUint16(8,0,true); v.setUint16(10,0,true); v.setUint16(12,0x2921,true);
    v.setUint32(14,crc,true); v.setUint32(18,data.length,true); v.setUint32(22,data.length,true);
    v.setUint16(26,nb.length,true); v.setUint16(28,0,true);
    lh.set(nb,30);
    parts.push(lh, data);

    const ch=new Uint8Array(46+nb.length), w=new DataView(ch.buffer);
    w.setUint32(0,0x02014b50,true); w.setUint16(4,20,true); w.setUint16(6,20,true);
    w.setUint16(8,0x0800,true); w.setUint16(10,0,true); w.setUint16(12,0,true);
    w.setUint16(14,0x2921,true); w.setUint32(16,crc,true);
    w.setUint32(20,data.length,true); w.setUint32(24,data.length,true);
    w.setUint16(28,nb.length,true); w.setUint16(30,0,true); w.setUint16(32,0,true);
    w.setUint16(34,0,true); w.setUint16(36,0,true); w.setUint32(38,0,true);
    w.setUint32(42,offset,true);
    ch.set(nb,46);
    central.push(ch);
    offset+=lh.length+data.length;
  });
  const cdSize=central.reduce((s,c)=>s+c.length,0);
  const eocd=new Uint8Array(22), e=new DataView(eocd.buffer);
  e.setUint32(0,0x06054b50,true); e.setUint16(4,0,true); e.setUint16(6,0,true);
  e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true); e.setUint32(16,offset,true); e.setUint16(20,0,true);
  return new Blob(parts.concat(central,[eocd]), {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const XS={ BODY:0, HEAD:1, TITLE:2, BOLD:3, FAIL:4, WARN:5, OK:6, NUM:7 };

function xlEsc(s){
  return String(s==null?'':s)
    .replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
function colName(i){
  let s=''; i++;
  while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); }
  return s;
}
function sheetXml(sh){
  const cols=(sh.cols&&sh.cols.length)
    ? '<cols>'+sh.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>'
    : '';
  const rows=sh.rows.map((r,ri)=>{
    const cells=r.map((c,ci)=>{
      if(c==null||c==='') return '';
      const o=(typeof c==='object')?c:{v:c};
      if(o.v==null||o.v==='') return '';
      const ref=colName(ci)+(ri+1);
      if(typeof o.v==='number' && isFinite(o.v)){
        const s=(o.s!=null)?o.s:(Number.isInteger(o.v)?XS.BODY:XS.NUM);
        return `<c r="${ref}" s="${s}"><v>${o.v}</v></c>`;
      }
      return `<c r="${ref}" s="${o.s!=null?o.s:XS.BODY}" t="inlineStr"><is><t xml:space="preserve">${xlEsc(o.v)}</t></is></c>`;
    }).join('');
    return cells?`<row r="${ri+1}">${cells}</row>`:'';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetViews><sheetView rightToLeft="'+(isHe()?'1':'0')+'" workbookViewId="0"/></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/>'+cols+
    '<sheetData>'+rows+'</sheetData></worksheet>';

    {name:'[Content_Types].xml', data:U(ct)},
    {name:'_rels/.rels',         data:U(rootRels)},
    {name:'xl/workbook.xml',     data:U(wb)},
    {name:'xl/_rels/workbook.xml.rels', data:U(wbRels)},
    {name:'xl/styles.xml',       data:U(stylesXml())}
  ];
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:U(sheetXml(s))}));
  return zipStore(files);
}

const dz=$('#dropzone'), uploadView=$('#uploadView');
uploadView.addEventListener('dragover',e=>{ e.preventDefault(); dz.classList.add('drag'); });
uploadView.addEventListener('dragleave',e=>{ if(e.target===uploadView||!uploadView.contains(e.relatedTarget)) dz.classList.remove('drag'); });

function routeFile(f){
  const n=f.name.toLowerCase();
  if(!/\.(rvt|rfa)$/.test(n)) hideRvtPanel();
  if(/\.pdf$/.test(n))            return handlePdf(f);
  if(/\.(png|jpe?g|webp)$/.test(n)) return handleImage(f);
  if(/\.json$/.test(n))           return readJson(f);
  if(/\.(dwg|dxf)$/.test(n))      return needsExport(f,'DWG','AutoCAD','Plot → DWG To PDF');
  if(/\.(rvt|rfa)$/.test(n))      return handleRvt(f);
  showError(T('errUnsupported', esc(f.name)));
}

/* =====================================================================
   14c. RVT READER — a .rvt is an OLE2 Compound File. The model elements
   live in one huge proprietary stream we cannot decode, but the metadata
   streams beside it are plain XML/UTF-16 and tell us a lot: which Revit
   wrote it, the Project Information parameters, and every external link
   with its load state. We read only those few KB — never the whole file.
   ===================================================================== */
const OLE_SIG=[0xD0,0xCF,0x11,0xE0,0xA1,0xB1,0x1A,0xE1];
const ENDOFCHAIN=0xFFFFFFFE, FREESECT=0xFFFFFFFF;

async function openCfbf(file){
  const rd=async(off,len)=>new Uint8Array(await file.slice(off,off+len).arrayBuffer());
  const hdr=await rd(0,512);
  for(let i=0;i<8;i++) if(hdr[i]!==OLE_SIG[i]) throw new Error('not-ole');
  const H=new DataView(hdr.buffer);
  const ver=H.getUint16(0x1A,true);
  const sec=1<<H.getUint16(0x1E,true);
  const mini=1<<H.getUint16(0x20,true);
  const nFat=H.getUint32(0x2C,true);
  const dir0=H.getUint32(0x30,true);
  const cutoff=H.getUint32(0x38,true);
  const miniFat0=H.getUint32(0x3C,true);
  const difat0=H.getUint32(0x44,true);
  const off=s=>(s+1)*sec;
  const sector=async s=>rd(off(s),sec);

  /* DIFAT: 109 entries inline, the rest chained through their own sectors */
  const difat=[];
  for(let i=0;i<109;i++) difat.push(H.getUint32(0x4C+i*4,true));
  let nx=difat0, guard=0, per=sec/4-1;
  while(nx!==ENDOFCHAIN && nx!==FREESECT && guard++<4096){
    const d=new DataView((await sector(nx)).buffer);
    for(let i=0;i<per;i++) difat.push(d.getUint32(i*4,true));
    nx=d.getUint32(per*4,true);
  }
  /* the FAT of a 500MB file is ~500KB — small enough to hold, and the only
     way to follow any chain */
  const fat=[];
  for(const s of difat.slice(0,nFat)){
    if(s===FREESECT||s===ENDOFCHAIN) continue;
    const d=new DataView((await sector(s)).buffer);
    for(let i=0;i<sec/4;i++) fat.push(d.getUint32(i*4,true));
  }
  const chain=start=>{
    const out=[]; let c=start,g=0;
    while(c!==ENDOFCHAIN && c!==FREESECT && c<fat.length && g++<2_000_000){ out.push(c); c=fat[c]; }
    return out;
  };
  const cat=async sects=>{
    const parts=[]; for(const s of sects) parts.push(await sector(s));
    const total=parts.reduce((n,p)=>n+p.length,0), out=new Uint8Array(total);
    let o=0; for(const p of parts){ out.set(p,o); o+=p.length; }
    return out;
  };

  const dirBytes=await cat(chain(dir0));
  const entries=[];
  for(let i=0;i+128<=dirBytes.length;i+=128){
    const d=new DataView(dirBytes.buffer,dirBytes.byteOffset+i,128);
    const type=d.getUint8(0x42);
    if(!type) continue;
    const nlen=d.getUint16(0x40,true);
    let name='';
    for(let k=0;k+1<Math.max(0,nlen-2);k+=2) name+=String.fromCharCode(d.getUint16(k,true));
    entries.push({ name, type,
      start:d.getUint32(0x74,true),
      size: ver>=4 ? Number(d.getBigUint64(0x78,true)) : d.getUint32(0x78,true) });
  }
  const root=entries.find(e=>e.type===5);

  let miniFat=null, miniSectors=null;
  const readStream=async e=>{
    if(!e) return new Uint8Array(0);
    if(e.size<cutoff && e.type===2){
      if(!miniFat){
        miniFat=[];
        for(const s of chain(miniFat0)){
          const d=new DataView((await sector(s)).buffer);
          for(let i=0;i<sec/4;i++) miniFat.push(d.getUint32(i*4,true));
        }
        miniSectors=chain(root.start);
      }
      const out=new Uint8Array(e.size);
      let c=e.start, o=0, g=0;
      while(c!==ENDOFCHAIN && c!==FREESECT && o<e.size && g++<200000){
        const byteOff=c*mini, si=Math.floor(byteOff/sec);
        if(si>=miniSectors.length) break;
        const chunk=await rd(off(miniSectors[si])+byteOff%sec, mini);
        out.set(chunk.subarray(0,Math.min(mini,e.size-o)),o);
        o+=mini;
        c=c<miniFat.length?miniFat[c]:ENDOFCHAIN;
      }
      return out;
    }
    const buf=await cat(chain(e.start));
    return buf.subarray(0,e.size);
  };
  return { entries, readStream, find:n=>entries.find(e=>e.name===n) };
}

const utf16=b=>{ let s=''; const d=new DataView(b.buffer,b.byteOffset,b.byteLength);
  for(let i=0;i+1<b.byteLength;i+=2) s+=String.fromCharCode(d.getUint16(i,true)); return s; };
/* Count only true ASCII-printable/whitespace. A wrong UTF-16 decode of an
   ASCII-based binary stream still lands on SOME codepoint for every byte
   pair — often a CJK one — which is real Unicode but not real text; scoring
   the full printable-Unicode range would let that garbage win by default. */
const printableRatio=s=>{
  if(!s.length) return 0;
  let n=0; for(const ch of s){ const c=ch.charCodeAt(0); if((c>=0x20&&c<=0x7E)||c===0x0A||c===0x0D||c===0x09) n++; }
  return n/s.length;
};
/* Revit mixes encodings between streams — decode both ways and keep whichever
   reads as more real text. */
function bestText(bytes){
  const u8=new TextDecoder('utf-8',{fatal:false}).decode(bytes);
  const u16=utf16(bytes);
  return printableRatio(u16)>printableRatio(u8) ? u16 : u8;
}

/* BasicFileInfo is UTF-16LE label:value pairs, but ONE odd-length field earlier
   in the stream shifts every 2-byte pairing after it — so decoding the whole
   buffer as one string garbles everything past that point (verified: byte
   offset of a known label landed on an odd index). The fix is to never decode
   the whole buffer: find each label's raw UTF-16 bytes directly and decode
   only from that exact offset, which is always correctly aligned locally. */
function extractField(bytes, label){
  const needle=[]; for(const ch of label) needle.push(ch.charCodeAt(0),0);
  let idx=-1;
  outer: for(let i=0;i<=bytes.length-needle.length;i++){
    for(let j=0;j<needle.length;j++) if(bytes[i+j]!==needle[j]) continue outer;
    idx=i; break;
  }
  if(idx<0) return null;
  let p=idx+needle.length;
  while(p+1<bytes.length && bytes[p+1]===0 && (bytes[p]===0x3A||bytes[p]===0x20)) p+=2;
  let out='', guard=0;
  while(p+1<bytes.length && guard++<500){
    const lo=bytes[p], hi=bytes[p+1];
    if(hi===0 && (lo===0x0D||lo===0x0A)) break;
    if(hi!==0 && lo===0x0D) break;               /* one stray raw CR seen between sections */
    if(hi===0){ out+=String.fromCharCode(lo); p+=2; } else break;
  }
  return out;
}
const BFI_LABELS=['Worksharing','Username','Central Model Path','Format','Build',
  'Last Save Path','Open Workset Default','Locale when saved',
  'Central Model Identity','Author','ClientAppName'];

/* the ProjectInformation stream is a tiny zip holding one XML */
async function unzipFirst(bytes){
  let i=-1;
  for(let k=0;k+3<bytes.length;k++)
    if(bytes[k]===0x50&&bytes[k+1]===0x4B&&bytes[k+2]===0x03&&bytes[k+3]===0x04){ i=k; break; }
  if(i<0) return null;
  const d=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  const method=d.getUint16(i+8,true);
  const comp=d.getUint32(i+18,true);
  const nlen=d.getUint16(i+26,true), elen=d.getUint16(i+28,true);
  const start=i+30+nlen+elen;
  const body=bytes.subarray(start, comp?start+comp:undefined);
  if(method===0) return new TextDecoder('utf-8').decode(body);
  try{
    const ds=new DecompressionStream('deflate-raw');
    const out=await new Response(new Blob([body]).stream().pipeThrough(ds)).arrayBuffer();
    return new TextDecoder('utf-8').decode(out);
  }catch(e){ return null; }
}

async function readRvt(file){
  const ole=await openCfbf(file);
  const info={ file:file.name, params:{}, links:[], raw:{} };

  const bfi=ole.find('BasicFileInfo');
  if(bfi){
    const bytes=await ole.readStream(bfi);
    BFI_LABELS.forEach(l=>{ const v=extractField(bytes,l); if(v) info.params[l]=v; });
    info.version = info.params['Format'] || '';
    info.build   = info.params['Build'] || '';
    info.worksharing = info.params['Worksharing'] || '';
    info.central = info.params['Central Model Path'] || '';
    info.lastSave = info.params['Last Save Path'] || '';
    info.locale  = info.params['Locale when saved'] || '';
  }

  const pi=ole.find('ProjectInformation');
  if(pi){
    const xml=await unzipFirst(await ole.readStream(pi));
    if(xml){
      info.raw.projectXml=xml;
      const doc=new DOMParser().parseFromString(xml,'application/xml');
      const title=doc.querySelector('title');
      if(title) info.title=title.textContent.trim();
      const pv=doc.getElementsByTagName('A:product-version')[0];
      if(pv) info.productVersion=pv.textContent.trim();
      /* Project Information parameters are one element each, named after the
         parameter, with a displayName attribute */
      doc.querySelectorAll('[displayName]').forEach(el=>{
        const k=el.getAttribute('displayName'), v=(el.textContent||'').trim();
        if(k) info.params[k]=v;
      });
    }
  }

  const td=ole.find('TransmissionData');
  if(td){
    const txt=bestText(await ole.readStream(td));
    const i=txt.indexOf('<?xml');
    if(i>=0){
      const doc=new DOMParser().parseFromString(txt.slice(i),'application/xml');
      doc.querySelectorAll('ExternalFileReference').forEach(r=>{
        const g=t=>{ const n=r.getElementsByTagName(t)[0]; return n?n.textContent.trim():''; };
        info.links.push({ type:g('ExternalFileReferenceType'), path:g('LastSavedPath'),
          state:g('LastSavedLoadState'), desired:g('DesiredLoadState'), id:g('ElementId') });
      });
    }
  }
  return info;
}

/* =====================================================================
   14d. RVT UPLOAD FLOW — read what the browser safely can (project identity,
   external-link health) the instant the file drops, then hand off to the

   ===================================================================== */
/* the level name typed into #rvtLevelHint — read by applyRoomExport() once
   the matching JSON export is uploaded, so the same field that tells the
   user what to look for in Revit also tells us which level to load */
let RVT_LEVEL_HINT='';

function hideRvtPanel(){ const p=$('#rvtPanel'); if(p) p.classList.remove('on'); }

async function handleRvt(file){
  showLoading(true);
  let info=null;
  try{ info=await readRvt(file); }catch(e){ /* handled below via null info */ }
  showLoading(false);
  if(!info){ showError(T('errRvtBad', esc(file.name))); return; }

  const row=(label,val)=> val?`<div><div class="k">${esc(label)}</div><div class="v">${esc(val)}</div></div>`:'';
  const links=info.links||[];
  const linkRows=links.map(l=>{
    const ok=l.state==='Loaded';
    return `<div class="lnk"><span class="rchip" style="background:${ok?'#16A34A':'#E1504B'}">${ok?T('rvtLinkOk'):T('rvtLinkBad')}</span>`+
      `<span class="p" title="${esc(l.path)}">${esc(l.path)}</span></div>`;
  }).join('');

  $('#rvtGrid').innerHTML =
    row(T('rvtProject'), info.title) +

function readJson(f){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const j=JSON.parse(r.result);
      /* two independent schemas can share one file: `rooms` is an as-built
         survey (from the Revit macro) that becomes the plan itself, `program`
         is a target/QA list checked against whatever plan is already loaded */
      if(Array.isArray(j.rooms) && j.rooms.length){
        showLoading(true);
        try{ await applyRoomExport(j, RVT_LEVEL_HINT); }
        catch(err){ showError(T('errParse', esc(err.message))); }
        showLoading(false);
      }
      if(j.program || j.qa || j.meta){
        if(!(Array.isArray(j.rooms)&&j.rooms.length)) applyProgram(j);
        else if(j.program) applyProgram(j);
      }
      if(j.review && BASE) restoreReview(j.review);
    }catch(err){ showError(T('errBadJson', esc(err.message))); }
  };
  r.readAsText(f);
}
function restoreReview(rv){
  if(rv.symbols) STATE.symbols=rv.symbols;
  if(rv.dims)    STATE.dims=rv.dims;
  if(rv.areas)   STATE.areas=rv.areas;
  if(rv.manual)  STATE.manual=rv.manual;
  if(rv.iron)    STATE.iron=rv.iron;
  if(rv.calib)   STATE.calib=rv.calib;
  if(rv.assign && typeof rv.assign==='object'){ STATE.assign=Object.assign({}, rv.assign); recheck(); }
  /* hand-made markup only — the rule-derived notes are rebuilt from the plan */
  (rv.notes||[]).filter(n=>n.src==='custom'||n.src==='cloud').forEach(n=>{
    if(!STATE.notes.some(x=>x.id===n.id)) STATE.notes.push(Object.assign({edited:true}, n));
  });
  STATE.seq=Math.max(STATE.seq, STATE.symbols.length+STATE.dims.length+STATE.areas.length+STATE.notes.length+1);
  refresh(); toast(T('tRestored'));
}

async function handlePdf(file){
  if(!PDFJS_OK){ showError(T('errPdfjs')); return; }
  showLoading(true);
  try{
    const parse=await parsePdf(new Uint8Array(await file.arrayBuffer()), file.name);
    if(!parse.tags.length){
      /* flat / scanned PDF — still usable as a manual markup workspace */
      await renderBase(parse.page);
      await runManual(BASE, file.name);
      toast(T('tManualMode'));
    } else await run(parse);
  }catch(err){ showError(T('errParse', esc(err.message))); }
  showLoading(false);
}

async function handleImage(file){
  showLoading(true);
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{
      const i=new Image();
      i.onload=()=>res(i); i.onerror=()=>rej(new Error(isHe()?'לא ניתן לקרוא את התמונה':'Could not read the image'));
      i.src=url;
    });
    const sc=Math.min(1, 2400/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    const x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    x.imageSmoothingQuality='high'; x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    await runManual(c, file.name);
    toast(T('tImgLoaded'));
  }catch(e){ showError(T('errGeneric', esc(e.message))); }
  showLoading(false);
}

const VARHEX={'--s-el':'#7C3AED','--s-it':'#0EA5E9','--s-mep':'#0891B2','--s-move':'#16A34A',
  '--s-fire':'#E1504B','--s-prog':'#D6009A','--black':'#1B1B1B'};
function hex(c){ const m=/var\((--[a-z-]+)\)/.exec(c); return m?(VARHEX[m[1]]||'#8A8A8A'):c; }

/* one requirement line for a schedule entry, shared by the table and the Revit sheet */
function schedReq(e){
  return [numN(e.minArea)!=null?T('reqMin',e.minArea):null,
    numN(e.desks)!=null?T('reqDesks',e.desks):null,
    numN(e.area)!=null&&e.key==='openspace'?T('reqArea',e.area):null,
    numN(e.seats)!=null?T('reqSeats',e.seats):null,
    e.dept||null].filter(Boolean).join(' · ')||'—';
}
/* With a schedule: one row per programme code. The row shape is the same
   as the per-type rows, so every table, sheet and export takes it as is. */
function schedRows(){
  const S=STATE.sched;
  return S.entries.map(x=>{
    const e=x.e;
    let cls, found, delta;
    if(!x.rooms.length){ cls='f'; found=T('stMissing'); delta='✗'; }
    else {
      const lv=x.rooms.map(c=>c.r.check.level);
      cls=lv.includes('fail')?'f':lv.includes('warn')?'w':'o';
      const t=x.rooms.map(c=>c.r.tag);
      const os=e.key==='openspace';
      const a=os?x.area:t[0].area, cap=os?x.cap:t[0].ppl;
      found=[t.map(v=>v.name||'—').join(' + '),
        a!=null?a+' '+T('uM2'):null,
        cap!=null?(os?T('reqDesks',cap):T('reqSeats',cap)):null,
        x.rooms.some(c=>c.how==='type')?T('byType'):x.rooms.some(c=>c.how==='manual')?T('byManual'):null
      ].filter(Boolean).join(' · ');
      delta=cls==='o'?'✓':cls==='w'?'!':'✗';
    }
    return { code:e.code, fn:e.code+' · '+(L(e.fn)||e.name||e.key), goal:schedReq(e), found, delta, cls };
  });
}
function missingList(){
  return STATE.sched ? STATE.sched.missing.map(x=>({ code:x.e.code, name:L(x.e.fn)||x.e.name||x.e.key, req:schedReq(x.e) })) : [];
}
function extraList(){
  return STATE.sched ? STATE.sched.extra.concat(STATE.sched.unassigned).map(c=>({
    name:c.r.tag.name||('#'+c.r.i), type:typeName(c.r.check.type),
    area:c.r.tag.area, why:c.how==='extra'?c.extraWhy:c.how==='extra-manual'?T('sMarkedExtra'):c.how==='os-nodept'?T('sOsNoDept'):T('sUnassigned')
  })) : [];
}

function progRows(){
  if(STATE.sched) return schedRows();
  const P=STATE.program;
  const rows=(P&&P.program&&P.program.length)?P.program:PROGRAM_REF;
  return rows.map(p=>{
    const types=p.types||[p.key];
    const m=STATE.rooms.filter(r=>types.includes(r.check.type));
    let cls,found,delta;
    if(!m.length){
      cls=(p.required||p.count)?'f':'n'; found=T('notFound'); delta=p.count?('−'+p.count):'—';
    } else {
      cls=m.some(r=>r.check.level==='fail')?'f':m.some(r=>r.check.level==='warn')?'w':'o';
      const a=m.map(r=>r.tag.area).filter(x=>x!=null);
      const bits=[T('unitsShort',m.length)];
      if(a.length) bits.push(Math.min(...a)===Math.max(...a)
        ? a[0]+' '+T('uM2') : Math.min(...a)+'–'+Math.max(...a)+' '+T('uM2'));
      found=bits.join(' · ');
      if(p.count){
        const d=m.length-p.count;
        delta=(d>=0?'+':'−')+Math.abs(d);
        /* a shortfall against the project target outranks per-room status */
        if(d<0){
          const short=-d/p.count;
          const lack=(p.required||short>=0.34)?'f':'w';
          if(lack==='f'||cls==='o') cls=lack;
        }
      } else delta='✓';
    }
    const goal=L(p.norm)||[p.count?T('unitsShort',p.count):null,
      p.minArea?'≥'+p.minArea+' '+T('uM2'):null].filter(Boolean).join(' · ')||'—';
    return { fn:L(p.fn)||L(p.label)||p.key, goal, found, delta, cls };
  });
}

/* =====================================================================
   15a. FLATTENED PLAN — base render + every markup layer on one canvas.
   Shared by the PDF report and anything else that needs a still image.
   ===================================================================== */
function paintSymbolsOn(c,w,h){
  const k=Math.max(0.7, w/900), S=24*k;
  STATE.symbols.forEach(s=>{
    const d=SYMMAP[s.k]; if(!d) return;
    const col=hex(d.c), x=s.nx*w, y=s.ny*h;
    c.fillStyle='#fff'; c.fillRect(x-S/2-1.5*k, y-S/2-1.5*k, S+3*k, S+3*k);
    c.fillStyle=col;    c.fillRect(x-S/2, y-S/2, S, S);
    c.fillStyle='#fff'; c.font='700 '+(S*0.36).toFixed(1)+'px Helvetica,Arial';
    c.textAlign='center'; c.textBaseline='middle'; c.direction='ltr';
    c.fillText(d.t, x, y+0.5*k);
    if(s.label){
      c.font='500 '+(9*k).toFixed(1)+'px Helvetica,Arial';
      c.direction=isHe()?'rtl':'ltr'; c.textAlign='right';
      const tw=c.measureText(s.label).width+6*k;
      c.fillStyle='#fff'; c.fillRect(x-S/2-tw-2*k, y-7*k, tw, 14*k);
      c.strokeStyle=col; c.lineWidth=1*k; c.strokeRect(x-S/2-tw-2*k, y-7*k, tw, 14*k);
      c.fillStyle=col; c.fillText(s.label, x-S/2-5*k, y);
    }
  });
}
function renderComposite(maxW){
  const W=Math.min(maxW||2000, BASE.width);
  const H=Math.round(BASE.height*W/BASE.width);
  const c=document.createElement('canvas');
  c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
  x.drawImage(BASE,0,0,W,H);
  paintMarkup(x,W,H,{layers:{notes:true,syms:true,dims:true,areas:true}, sel:null});
  paintSymbolsOn(x,W,H);
  return c;
}

        <div class="sh-brand">RD&amp;A<span>Test Fit Checker</span></div>
        <div class="sh-proj">${projLine}<br>${esc(m.date)}</div>
      </div>
      ${s.cover ? s.html : `
        <div class="sh-title">${esc(s.title)}${s.kicker?`<small>${esc(s.kicker)}</small>`:''}</div>
        <div class="sh-body ${s.cls||''}">${s.html}</div>`}
      <div class="sh-foot"><span>${esc(disc)}</span><span><b>${esc(T('rptPage',i+1,total))}</b></span></div>
    </section>`).join('');
  return total;
}

async function exportPdf(){
  closeExportMenu();
  if(!BASE){ toast(T('tNoPlan')); return; }
  toast(T('tBuilding'));
  /* let the toast paint before the composite render blocks the thread */
  await new Promise(r=>setTimeout(r,40));
  const n=buildReport();
  document.body.classList.add('printing');

  /* the plan sheet holds a ~1MB data-URI PNG; printing before it decodes
     yields a blank or mis-scaled page, so wait for it explicitly */
  const img=$('#report .planwrap img');
  if(img && !img.complete){
    await new Promise(res=>{ img.onload=res; img.onerror=res; setTimeout(res,6000); });
  }
  if(img && img.decode){
    try{ await Promise.race([img.decode(), new Promise(r=>setTimeout(r,4000))]); }catch(e){}
  }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

  const done=()=>{
    document.body.classList.remove('printing');
    $('#report').innerHTML='';
    window.removeEventListener('afterprint',done);
    layout();
  };
  window.addEventListener('afterprint',done);
  toast(T('tPages',n));
  window.print();
}

<script type="text/plain" id="exportJS">
var S = JSON.parse(document.getElementById('stateJSON').textContent);
var SD = S.symdefs, ZOOM = 1, SEL = null, TAB = 'notes', TOOL = null;
var LAY = { notes:true, syms:true, dims:true, areas:true };
var CLR = { f:'#E1504B', w:'#E38B00', i:'#0000FF', o:'#16A34A' };
var AREA_CLR = '#0000FF';
var TT = S.t || {};                     /* strings shipped with the state */
var RTL = (S.lang||'he') === 'he';
function isHe(){ return RTL; }
function lvc(lv){ return CLR[lv]||'#8A8A8A'; }
function shoe(p){ var s=0,i; for(i=0;i<p.length;i++){ var a=p[i],b=p[(i+1)%p.length]; s+=a.x*b.y-b.x*a.y; } return s/2; }
function bnds(p){ var r={x0:1,y0:1,x1:0,y1:0}; p.forEach(function(q){
  if(q.x<r.x0)r.x0=q.x; if(q.y<r.y0)r.y0=q.y; if(q.x>r.x1)r.x1=q.x; if(q.y>r.y1)r.y1=q.y; }); return r; }
function cent(p){
  var A=shoe(p); if(Math.abs(A)<1e-9){ var b=bnds(p); return {x:(b.x0+b.x1)/2,y:(b.y0+b.y1)/2}; }
  var cx=0,cy=0,i;
  for(i=0;i<p.length;i++){ var a=p[i],b2=p[(i+1)%p.length],f=a.x*b2.y-b2.x*a.y; cx+=(a.x+b2.x)*f; cy+=(a.y+b2.y)*f; }
  return {x:cx/(6*A), y:cy/(6*A)};
}
function wrapL(c,t,mw,ml){
  var out=[], line='';
  String(t||'').split(/\s+/).filter(Boolean).forEach(function(w){
    var s=line?line+' '+w:w;
    if(c.measureText(s).width>mw&&line){ out.push(line); line=w; } else line=s;
  });
  if(line) out.push(line);
  if(out.length>ml){ var cut=out.slice(0,ml); cut[ml-1]+='…'; return cut; }
  return out;
}
var Q = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ var t=Q('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(function(){t.classList.remove('on');},2000); }

var IMG = Q('#planImg');
/* target size — only layout() may ask, because #host.clientWidth changes the
   moment a scrollbar appears and a second call would answer differently */
function fitTarget(){
  var h=Q('#host'), aw=Math.max(60,h.clientWidth-24), ah=Math.max(60,h.clientHeight-24);
  var ar=S.imgW/S.imgH, w=aw, hh=w/ar;
  if(hh>ah){ hh=ah; w=hh*ar; }
  return { w:w*ZOOM, h:hh*ZOOM };
}
/* actual on-screen size — the single source of truth for marks and clicks */
var BOX = { w:0, h:0 };
function fit(){ return BOX; }
function layout(){
  var box=Q('#box'), ov=Q('#ov'), t=fitTarget();
  box.style.width=t.w+'px'; box.style.height=t.h+'px';
  var r=box.getBoundingClientRect();
  var f={ w:r.width||t.w, h:r.height||t.h };
  BOX=f;
  var dpr=Math.min(2, window.devicePixelRatio||1);
  ov.width=Math.round(f.w*dpr); ov.height=Math.round(f.h*dpr);
  ov.style.width=f.w+'px'; ov.style.height=f.h+'px';
  Q('#zl').textContent=Math.round(ZOOM*100)+'%';
  draw(); syms();
}
function badge(c,k,n,bx,by,Sz,col){
  c.fillStyle='#fff'; c.fillRect(bx-1.5*k,by-1.5*k,Sz+3*k,Sz+3*k);
  c.fillStyle=col; c.fillRect(bx,by,Sz,Sz);
  c.fillStyle='#fff'; c.font='700 '+(Sz*0.52).toFixed(1)+'px Helvetica,Arial';
  c.textAlign='center'; c.textBaseline='middle'; c.direction='ltr';
  c.fillText(n.num, bx+Sz/2, by+Sz/2+0.5*k);
  if(SEL===n.id){ c.strokeStyle='#CFFF04'; c.lineWidth=2.5*k; c.strokeRect(bx-3*k,by-3*k,Sz+6*k,Sz+6*k); }
}
function cloud(c,f,k,n){
  var pn=n.pts||[]; if(pn.length<2) return null;
  var col=lvc(n.lv), r=Math.max(4,7*k), out=shoe(pn)<0;
  var pts=pn.map(function(p){ return {x:p.x*f.w, y:p.y*f.h}; });
  var path=[], carry=0, i;
  for(i=0;i<pts.length;i++){
    var a=pts[i], b=pts[(i+1)%pts.length];
    var seg=Math.hypot(b.x-a.x,b.y-a.y);
    if(seg<0.01) continue;
    var d=carry;
    while(d<seg){ path.push({x:a.x+(b.x-a.x)*d/seg, y:a.y+(b.y-a.y)*d/seg}); d+=2*r; }
    carry=d-seg;
  }
  if(path.length<2) return null;
  c.save();
  c.strokeStyle=col; c.lineWidth=Math.max(1.3,1.9*k); c.lineJoin='round';
  c.beginPath();
  for(i=0;i<path.length;i++){
    var p1=path[i], p2=path[(i+1)%path.length];
    var rad=Math.hypot(p2.x-p1.x,p2.y-p1.y)/2;
    if(rad<0.4) continue;
    var ang=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    c.arc((p1.x+p2.x)/2,(p1.y+p2.y)/2,rad,ang+Math.PI,ang,out);
  }
  c.stroke(); c.restore();
  var bb=bnds(pn), Sz=20*k;
  var bx=Math.max(2*k, bb.x0*f.w-Sz*0.25), by=Math.max(2*k, bb.y0*f.h-Sz*1.2);
  badge(c,k,n,bx,by,Sz,col);
  if(n.body){
    c.save();
    c.font='500 '+(11*k).toFixed(1)+'px Helvetica,Arial';
    c.direction=isHe()?'rtl':'ltr'; c.textAlign='right'; c.textBaseline='top';
    var lines=wrapL(c,n.body,Math.max(150*k,(bb.x1-bb.x0)*f.w),3);
    var lh=14*k, pad=5*k;
    var tw=Math.max.apply(null,lines.map(function(l){return c.measureText(l).width;}))+pad*2;
    var th=lines.length*lh+pad*2;
    var tx=Math.min(f.w-2*k, bb.x1*f.w), ty=bb.y1*f.h+5*k;
    if(ty+th>f.h) ty=Math.max(2*k, bb.y0*f.h-th-5*k);
    if(tx-tw<0) tx=tw+2*k;
    c.fillStyle='rgba(255,255,255,.94)'; c.fillRect(tx-tw,ty,tw,th);
    c.strokeStyle=col; c.lineWidth=Math.max(1,1.2*k); c.strokeRect(tx-tw,ty,tw,th);
    c.fillStyle=col;
    lines.forEach(function(l,j){ c.fillText(l, tx-pad, ty+pad+j*lh); });
    c.restore();
  }
  return {id:n.id,bx:bx,by:by,S:Sz};
}
function draw(){
  var f=fit(), ov=Q('#ov'), c=ov.getContext('2d');
  var dpr=Math.min(2, window.devicePixelRatio||1);
  var k=Math.max(0.7, f.w/900);
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,f.w,f.h);
  MK=[];
  if(LAY.areas) (S.areas||[]).forEach(function(a){
    var pts=(a.pts||[]).map(function(p){ return {x:p.x*f.w, y:p.y*f.h}; });
    if(pts.length<3) return;
    c.save();
    c.beginPath();
    pts.forEach(function(p,i){ i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y); });
    c.closePath();
    c.fillStyle='rgba(0,0,255,.07)'; c.fill();
    c.strokeStyle=AREA_CLR; c.lineWidth=Math.max(1.2,1.6*k);
    c.setLineDash([6*k,3*k]); c.stroke(); c.setLineDash([]);
    c.fillStyle=AREA_CLR;
    pts.forEach(function(p){ c.beginPath(); c.arc(p.x,p.y,2.4*k,0,6.284); c.fill(); });
    var ct=cent(a.pts), lines=[a.label||'—'];
    if(a.name) lines.unshift(a.name);
    c.font='600 '+(11.5*k).toFixed(1)+'px Helvetica,Arial';
    c.textAlign='center'; c.textBaseline='middle'; c.direction=isHe()?'rtl':'ltr';
    var tw=Math.max.apply(null,lines.map(function(l){return c.measureText(l).width;}))+11*k;
    var lh=14*k, th=lines.length*lh+6*k, cx=ct.x*f.w, cy=ct.y*f.h;
    c.fillStyle='rgba(255,255,255,.94)'; c.fillRect(cx-tw/2,cy-th/2,tw,th);
    c.strokeStyle=AREA_CLR; c.lineWidth=Math.max(1,1.2*k); c.strokeRect(cx-tw/2,cy-th/2,tw,th);
    c.fillStyle=AREA_CLR;
    lines.forEach(function(l,i){ c.fillText(l, cx, cy-th/2+3*k+lh/2+i*lh); });
    c.restore();
  });
  if(LAY.dims) (S.dims||[]).forEach(function(d){
    var x1=d.x1*f.w, y1=d.y1*f.h, x2=d.x2*f.w, y2=d.y2*f.h;
    var col=d.calib?'#0000FF':'#D6009A';
    c.strokeStyle=col; c.lineWidth=1.6*k;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    var a=Math.atan2(y2-y1,x2-x1), t=7*k;
    [[x1,y1],[x2,y2]].forEach(function(p){
      c.beginPath();
      c.moveTo(p[0]-Math.sin(a)*t, p[1]+Math.cos(a)*t);
      c.lineTo(p[0]+Math.sin(a)*t, p[1]-Math.cos(a)*t); c.stroke();
    });
    var lb=d.label||'—', mx=(x1+x2)/2, my=(y1+y2)/2;
    c.font='600 '+(11*k).toFixed(1)+'px Helvetica,Arial';
    c.textAlign='center'; c.textBaseline='middle'; c.direction=isHe()?'rtl':'ltr';
    var tw=c.measureText(lb).width+9*k, th=16*k;
    c.fillStyle='#fff'; c.fillRect(mx-tw/2,my-th/2,tw,th);
    c.strokeStyle=col; c.lineWidth=1.2*k; c.strokeRect(mx-tw/2,my-th/2,tw,th);
    c.fillStyle=col; c.fillText(lb,mx,my+0.5*k);
  });
  if(LAY.notes){
    S.notes.forEach(function(n){
      if(n.shape!=='cloud') return;
      var m=cloud(c,f,k,n); if(m) MK.push(m);
    });
    S.notes.forEach(function(n){
      if(n.shape==='cloud'||n.nx==null) return;
      var x=n.nx*f.w, y=n.ny*f.h, Sz=20*k;
      var col=lvc(n.lv), bx=x+Sz*0.85, by=y-Sz*1.85;
      c.strokeStyle=col; c.lineWidth=1.6*k;
      c.beginPath(); c.moveTo(x,y); c.lineTo(bx,by+Sz); c.stroke();
      badge(c,k,n,bx,by,Sz,col);
      c.fillStyle=col; c.beginPath(); c.arc(x,y,3.2*k,0,6.284); c.fill();
      c.strokeStyle='#fff'; c.lineWidth=1*k; c.stroke();
      MK.push({id:n.id,bx:bx,by:by,S:Sz});
    });
  }
}
var MK=[];
function syms(){
  var L=Q('#sl'); L.style.display=LAY.syms?'block':'none'; L.innerHTML='';
  (S.symbols||[]).forEach(function(s){
    var d=SD[s.k]; if(!d) return;
    var el=document.createElement('div');
    el.className='sym'; el.style.left=(s.nx*100)+'%'; el.style.top=(s.ny*100)+'%';
    el.innerHTML='<div class="sbx" style="background:'+d.c+'">'+esc(d.t)+'</div><div class="del">×</div>';
    el.querySelector('.del').onclick=function(e){
      e.stopPropagation();
      S.symbols=S.symbols.filter(function(x){return x.id!==s.id;}); render();
    };
    el.onpointerdown=function(e){
      if(e.target.className==='del') return;
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      var b=Q('#box').getBoundingClientRect();
      function mv(ev){
        s.nx=Math.min(1,Math.max(0,(ev.clientX-b.left)/b.width));
        s.ny=Math.min(1,Math.max(0,(ev.clientY-b.top)/b.height));
        el.style.left=(s.nx*100)+'%'; el.style.top=(s.ny*100)+'%';
      }
      function up(){ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); }
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
    };
    L.appendChild(el);
  });
}
Q('#box').addEventListener('click', function(e){
  if(e.target.closest('.sym')) return;
  var b=Q('#box').getBoundingClientRect();
  var nx=(e.clientX-b.left)/b.width, ny=(e.clientY-b.top)/b.height;
  if(TOOL && TOOL.indexOf('sym:')===0){
    S.symbols.push({id:'s'+Date.now(), k:TOOL.slice(4), nx:nx, ny:ny});
    TOOL=null; Q('#box').style.cursor='default'; render(); return;
  }
  var f=fit(), mx=nx*f.w, my=ny*f.h;
  var hit=MK.filter(function(m){
    return mx>=m.bx-5&&mx<=m.bx+m.S+5&&my>=m.by-5&&my<=m.by+m.S+5; })[0];
  SEL=hit?hit.id:null;
  if(hit){ TAB='notes'; render();
    var el=document.getElementById('c-'+hit.id);
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  } else draw();
});
function zoom(z){ ZOOM=Math.min(6,Math.max(0.3,z)); layout(); }
function lay(k,btn){ LAY[k]=!LAY[k]; document.getElementById(btn).classList.toggle('on',LAY[k]); layout(); }

/* ---------- panel ---------- */
var TABS=[['iron',TT.tabIron],['notes',TT.tabNotes],['prog',TT.tabProg],['open',TT.tabOpen],['sym',TT.tabMarks]];
function render(){
  var f=S.notes.filter(function(n){return n.lv==='f';}).length;
  var w=S.notes.filter(function(n){return n.lv==='w';}).length;
  var io=(S.iron||[]).filter(function(r){return r.level==='o';}).length;
  Q('#tiles').innerHTML=
    tile(f,TT.tlFail,f?'#E1504B':'')+tile(w,TT.tlWarn,w?'#E38B00':'')+
    tile(io+'/4',TT.tlIron,io===4?'#16A34A':'#E1504B')+tile(S.stats.tags,TT.tlTags,'')+
    tile(S.stats.ws||'—',TT.tlStations,'')+tile(S.stats.seats||'—',TT.tlSeats,'')+
    tile(S.stats.area||'—',TT.tlArea,'')+tile((S.symbols||[]).length,TT.tlSyms,'');
  Q('#tabs').innerHTML=TABS.map(function(t){
    return '<button class="tab '+(TAB===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
  var B=Q('#body');
  if(TAB==='notes'){ B.innerHTML=vNotes(); bind(); }
  else if(TAB==='iron') B.innerHTML=vIron();
  else if(TAB==='prog') B.innerHTML=vProg();
  else if(TAB==='open') B.innerHTML=vOpen();
  else B.innerHTML=vSym();
  buildPrint(); draw(); syms();
}
function tile(n,l,c){
  return '<div class="tile"><div class="n"'+(c?' style="color:'+c+'"':'')+'>'+n+'</div><div class="l">'+l+'</div></div>';
}
function setTab(k){ TAB=k; render(); }
function vNotes(){
  if(!S.notes.length) return '<div class="empty">'+esc(TT.noNotes)+'</div>';
  var g=[['f',TT.grpFail],['w',TT.grpWarn],['i',TT.grpInfo],['o',TT.grpOk]], h='';
  g.forEach(function(x){
    var L=S.notes.filter(function(n){return n.lv===x[0];});
    if(!L.length) return;
    h+='<div class="gt">'+x[1]+' · '+L.length+'</div>';
    h+=L.map(function(n){
      return '<div class="card '+n.lv+(SEL===n.id?' sel':'')+'" id="c-'+n.id+'" data-id="'+n.id+'">'+
        '<div class="ch"><span class="num '+n.lv+'">'+n.num+'</span>'+
        '<span class="ct">'+esc(n.title)+'</span><span class="cs">'+esc(n.sub)+'</span></div>'+
        '<div class="cb" contenteditable="true" data-id="'+n.id+'">'+esc(n.body)+'</div>'+
        '<div class="cact"><button class="xb" data-a="lv" data-id="'+n.id+'">'+esc(TT.changeLevel)+'</button>'+
        ((n.nx!=null||n.shape==='cloud')?'<button class="xb" data-a="go" data-id="'+n.id+'">'+esc(TT.showOnPlan)+'</button>':'')+
        '<button class="xb" data-a="del" data-id="'+n.id+'">'+esc(TT.del)+'</button></div></div>';
    }).join('');
  });
  return h;
}
function bind(){
  Q('#body').querySelectorAll('.cb').forEach(function(el){
    el.onblur=function(){
      var n=S.notes.filter(function(x){return x.id===el.dataset.id;})[0];
      if(n) n.body=el.textContent.trim();
    };
  });
  Q('#body').querySelectorAll('.xb[data-a]').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var n=S.notes.filter(function(x){return x.id===b.dataset.id;})[0]; if(!n) return;
      if(b.dataset.a==='lv'){ var o=['f','w','i','o']; n.lv=o[(o.indexOf(n.lv)+1)%4]; renum(); }
      if(b.dataset.a==='go'){ SEL=n.id; }
      if(b.dataset.a==='del'){ S.notes=S.notes.filter(function(x){return x.id!==n.id;}); renum(); }
      render();
    };
  });
}
function renum(){
  var o={f:0,w:1,i:2,o:3};
  S.notes.sort(function(a,b){return o[a.lv]-o[b.lv];});
  S.notes.forEach(function(n,i){ n.num=i+1; });
}
function vIron(){
  return '<div class="gt">'+esc(TT.ironTitle)+'</div>'+(S.iron||[]).map(function(r){
    return '<div class="iron '+r.level+'"><div class="ih"><span class="chip '+
      (r.level==='o'?'o':'f')+'">'+(r.level==='o'?TT.ironOk:esc(TT.ironMissing))+'</span><span class="it">'+
      esc(r.n)+'</span><span class="cs">'+esc(r.src)+'</span></div><div class="ib">'+esc(r.msg)+'</div></div>';
  }).join('');
}
function vProg(){
  var h='<div class="gt">'+esc(S.progTitle||TT.tabProg)+'</div>';
  h+='<table class="pg"><thead><tr><th>'+esc(TT.thFn)+'</th><th>'+esc(TT.thGoal)+
     '</th><th>'+esc(TT.thFound)+'</th><th>Δ</th></tr></thead><tbody>';
  (S.prog||[]).forEach(function(r){
    h+='<tr class="'+r.cls+'"><td class="fn">'+esc(r.fn)+'</td><td>'+esc(r.goal)+
       '</td><td>'+esc(r.found)+'</td><td>'+esc(r.delta)+'</td></tr>';
  });
  return h+'</tbody></table>';
}
function vOpen(){
  return '<div class="gt">'+esc(TT.openTitle)+'</div>'+(S.openList||[]).map(function(c){
    var cur=S.manual[c.id]||'na';
    return '<div class="iron '+(cur==='ok'?'o':cur==='fail'?'f':'w')+'"><div class="ih">'+
      '<span class="it">'+esc(c.n)+'</span><span class="tri">'+
      '<button class="'+(cur==='ok'?'a-ok':'')+'" onclick="mset(\''+c.id+'\',\'ok\')">'+esc(TT.stOk)+'</button>'+
      '<button class="'+(cur==='fail'?'a-fail':'')+'" onclick="mset(\''+c.id+'\',\'fail\')">'+esc(TT.stFail)+'</button>'+
      '<button class="'+(cur==='na'?'a-na':'')+'" onclick="mset(\''+c.id+'\',\'na\')">'+esc(TT.stNa)+'</button>'+
      '</span></div><div class="ib">'+esc(c.note||'')+'</div></div>';
  }).join('');
}
function mset(id,v){ S.manual[id]=v; render(); }
function vSym(){
  var h='<div class="gt">'+esc(TT.addSymHint)+'</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:5px">';
  Object.keys(SD).forEach(function(k){
    var d=SD[k];
    h+='<div class="card" style="border-inline-start-color:'+d.c+'" onclick="arm(\''+k+'\')">'+
       '<div class="ch"><span class="num" style="background:'+d.c+'">'+esc(d.t)+
       '</span><span class="ct" style="font-size:10px">'+esc(d.n)+'</span></div></div>';
  });
  h+='</div><div class="gt">'+esc(TT.onPlanWord)+' · '+(S.symbols||[]).length+'</div>';
  h+=(S.symbols||[]).length ? S.symbols.map(function(s){
    var d=SD[s.k];
    return '<div class="card"><div class="ch"><span class="num" style="background:'+d.c+'">'+
      esc(d.t)+'</span><span class="ct">'+esc(d.n)+'</span></div></div>';
  }).join('') : '<div class="empty">'+esc(TT.noSyms)+'</div>';

  var tot=(S.areas||[]).reduce(function(s,a){ return s+(a.m2||0); },0);
  h+='<div class="gt">'+esc(TT.areasTitle)+' · '+(S.areas||[]).length+
     (tot?' · '+esc(TT.totalArea)+' '+tot.toFixed(2)+' '+esc(TT.uM2):'')+'</div>';
  h+=(S.areas||[]).length ? S.areas.map(function(a){
    return '<div class="card" style="border-inline-start-color:'+AREA_CLR+'"><div class="ch">'+
      '<span class="num" style="background:'+AREA_CLR+'">⬚</span>'+
      '<span class="ct">'+esc(a.name||TT.roomNoName)+'</span>'+
      '<span class="cs">'+esc(a.label||'—')+'</span></div></div>';
  }).join('') : '<div class="empty">'+esc(TT.noAreas)+'</div>';

  h+='<div class="gt">'+esc(TT.dimsTitle)+' · '+(S.dims||[]).length+'</div>';
  h+=(S.dims||[]).length ? S.dims.map(function(d,i){
    var col=d.calib?'#0000FF':'#D6009A';
    return '<div class="card" style="border-inline-start-color:'+col+'"><div class="ch">'+
      '<span class="num" style="background:'+col+'">↔</span>'+
      '<span class="ct">'+esc(TT.dimWord)+' '+(i+1)+'</span><span class="cs">'+esc(d.label||'—')+'</span></div></div>';
  }).join('') : '<div class="empty">'+esc(TT.noDims)+'</div>';
  return h;
}
function arm(k){ TOOL='sym:'+k; Q('#box').style.cursor='crosshair'; toast(TT.clickPlan); }

/* ---------- print sheet ---------- */
function buildPrint(){
  var g=[['f',TT.grpFail],['w',TT.grpWarn],['i',TT.grpInfo]], h='';
  var mm=S.meta||{};
  h+='<h3>'+esc(S.title)+(mm.client?' · '+esc(mm.client):'')+' · '+esc(S.date)+'</h3>';
  h+='<div style="font-size:11px;opacity:.6;margin:-4px 0 10px">'+esc(S.floorTitle||'')+'</div>';
  g.forEach(function(x){
    var L=S.notes.filter(function(n){return n.lv===x[0];});
    if(!L.length) return;
    h+='<h3>'+x[1]+'</h3>';
    h+=L.map(function(n){
      return '<div class="pi"><div class="pn" style="background:'+CLR[n.lv]+'">'+n.num+
        '</div><div class="pr">'+esc(n.title)+'<small>'+esc(n.sub)+'</small></div>'+
        '<div class="pw">'+esc(n.body)+'</div></div>';
    }).join('');
  });
  if((S.areas||[]).length){
    h+='<h3>'+esc(TT.areasTitle)+'</h3>';
    h+=S.areas.map(function(a){
      return '<div class="pi"><div class="pn" style="background:#0000FF">⬚</div>'+
        '<div class="pr">'+esc(a.name||TT.roomNoName)+'<small>'+
        (a.perim?esc(TT.perim)+' '+a.perim.toFixed(2)+' '+esc(TT.uM):'')+'</small></div>'+
        '<div class="pw">'+esc(a.label||'—')+'</div></div>';
    }).join('');
  }
  var open=(S.openList||[]).filter(function(c){ return (S.manual[c.id]||'na')!=='ok'; });
  if(open.length){
    h+='<h3>'+esc(TT.printOpenTitle)+'</h3>';
    h+=open.map(function(c){
      return '<div class="pi"><div class="pn" style="background:#8A8A8A">○</div>'+
        '<div class="pr">'+esc(c.n)+'</div><div class="pw">'+esc(c.note||'')+'</div></div>';
    }).join('');
  }
  h+='<div style="margin-top:26px;padding-top:12px;border-top:1px solid #1B1B1B;font-size:10px;opacity:.6;line-height:1.7">'+
     esc(TT.rptDisc)+' Roy David Architects · roydavid.co</div>';
  Q('#print').innerHTML=h;
}

/* ---------- save updated copy ---------- */
function saveCopy(){
  document.getElementById('stateJSON').textContent=JSON.stringify(S);
  Q('#tiles').innerHTML=''; Q('#tabs').innerHTML=''; Q('#body').innerHTML='';
  Q('#sl').innerHTML=''; Q('#print').innerHTML='';
  var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  var b=new Blob([html],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=(S.title||'testfit')+'-review.html';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
  render();
  toast(TT.copySaved);
}
function saveData(){
  var out={ meta:{title:S.title,date:S.date}, notes:S.notes, symbols:S.symbols,
    dims:S.dims, manual:S.manual, program:S.prog };
  var b=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=(S.title||'testfit')+'-data.json'; a.click();
}
window.addEventListener('resize', function(){ clearTimeout(window._rt); window._rt=setTimeout(layout,120); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ TOOL=null; Q('#box').style.cursor='default'; } });
if(IMG.complete) { layout(); render(); }
else IMG.onload=function(){ layout(); render(); };
</script>
