<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDA — Test Fit Checker</title>
<script src="lib/pdf.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --black:#1B1B1B; --white:#FFFFFF; --accent:#CFFF04; --blue:#0000FF;
    --fail:#E1504B; --warn:#E38B00; --info:#0000FF; --ok:#16A34A;
    --gray:#F4F4F4; --border:#D8D8D8; --soft:#8A8A8A;
    --s-el:#7C3AED; --s-it:#0EA5E9; --s-mep:#0891B2; --s-move:#16A34A;
    --s-fire:#E1504B; --s-prog:#D6009A; --s-dim:#D6009A; --s-note:#E38B00;
  }
  html,body{height:100%;}
  body{
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    background:var(--white); color:var(--black);
    font-size:13px; line-height:1.45; overflow:hidden;
  }
  button,input,select,textarea{font-family:inherit; border-radius:0;}

  /* ---------- header ---------- */
  header{
    background:var(--black); color:var(--white); height:46px;
    display:flex; align-items:center; gap:16px; padding:0 16px; flex:0 0 auto;
  }
  header .brand{font-size:15px; font-weight:300; letter-spacing:.02em;}
  header .tool{font-size:9px; letter-spacing:.22em; text-transform:uppercase; opacity:.45;}
  header .fname{
    font-size:11px; opacity:.6; margin-inline-start:auto; max-width:280px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  header .hbtns{display:flex; gap:6px;}
  .hb{
    background:none; border:1px solid rgba(255,255,255,.28); color:var(--white);
    font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    padding:6px 12px; cursor:pointer; transition:.15s;
  }
  .hb:hover{background:rgba(255,255,255,.12);}
  .hb.on{background:var(--accent); color:var(--black); border-color:var(--accent);}
  .accent-bar{height:3px; background:var(--accent); flex:0 0 auto;}

  /* export dropdown */
  .hmenu{position:relative;}
  .hdrop{
    display:none; position:absolute; top:calc(100% + 4px); inset-inline-start:0; z-index:150;
    background:var(--white); border:1px solid var(--black); min-width:230px;
    box-shadow:0 6px 22px rgba(0,0,0,.22);
  }
  .hmenu.open .hdrop{display:block;}
  .hdrop button{
    display:block; width:100%; text-align:start; background:none; border:none; cursor:pointer;
    padding:9px 13px; font-size:11.5px; color:var(--black); border-bottom:1px solid var(--border);
  }
  .hdrop button:last-child{border-bottom:none;}
  .hdrop button:hover{background:var(--accent);}
  .hdrop button small{display:block; font-size:9px; opacity:.5; margin-top:2px; letter-spacing:.04em;}

  /* ---------- landing ---------- */
  #uploadView{
    height:calc(100vh - 49px); overflow:auto; display:flex;
    align-items:center; justify-content:center; padding:32px 24px;
  }
  #uploadView .inner{max-width:740px; width:100%; text-align:center;}
  .kicker{font-size:10px; letter-spacing:.32em; text-transform:uppercase; opacity:.38; margin-bottom:20px;}
  .h1{font-size:clamp(34px,5.4vw,60px); font-weight:300; line-height:1.05; letter-spacing:-.015em; margin-bottom:18px;}
  .h1 em{font-style:normal; background:var(--accent); padding:0 10px;}
  .sub{font-size:15px; font-weight:300; opacity:.5; max-width:500px; margin:0 auto 38px; line-height:1.65;}
  .dropzone{
    border:1px dashed var(--black); padding:58px 28px; cursor:pointer;
    transition:.18s; background:var(--white);
  }
  .dropzone:hover,.dropzone.drag{background:var(--gray); border-color:var(--blue);}
  .dz-big{font-size:20px; font-weight:300; margin-bottom:6px;}
  .dz-small{font-size:11px; opacity:.42;}
  #fileInput,#jsonInput{display:none;}
  .fmt{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:20px;}
  .fmt span{font-size:10px; letter-spacing:.12em; border:1px solid var(--border); padding:5px 12px; opacity:.6;}
  .fmt span.pri{border-color:var(--black); opacity:1; font-weight:500;}
  .alt{margin-top:28px; font-size:11px; opacity:.5;}
  .alt button{
    background:none; border:none; font-family:inherit; font-size:11px;
    text-decoration:underline; cursor:pointer; opacity:.85; padding:0 4px; color:inherit;
  }
  .alt button:hover{opacity:1; color:var(--blue);}
  .loading{display:none; margin-top:18px; font-size:12px; letter-spacing:.06em;}
  .loading.on{display:block;}
  #loadError{
    display:none; margin-top:18px; border:1px solid var(--fail); border-inline-start-width:3px;
    color:var(--fail); padding:12px 16px; font-size:12px; text-align:right; line-height:1.65;
  }
  #loadError b{display:block; font-weight:500; margin-bottom:4px;}
  .prog-banner{
    display:none; margin-top:20px; border:1px solid var(--ok); border-inline-start-width:3px;
    padding:11px 14px; font-size:11.5px; background:rgba(22,163,74,.06); text-align:right;
  }
  .prog-banner.loaded{display:block;}
  .prog-banner b{font-weight:500;}

  /* ---------- workspace ---------- */
  #workView{display:none; height:calc(100vh - 49px);}
  #workView.on{display:flex;}
  #stage{flex:1; display:flex; flex-direction:column; min-width:0; background:var(--gray);}
  #stagebar{
    height:38px; flex:0 0 auto; background:var(--white); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:4px; padding:0 10px; overflow-x:auto; white-space:nowrap;
  }
  .tb{
    background:none; border:1px solid transparent; font-size:11px; padding:5px 9px;
    cursor:pointer; color:var(--black); transition:.12s; display:inline-flex; align-items:center; gap:5px;
  }
  .tb:hover{background:var(--gray);}
  .tb.on{background:var(--black); color:var(--white);}
  .tb.armed{background:var(--s-prog); color:#fff;}
  .tbsep{width:1px; height:18px; background:var(--border); margin:0 5px;}
  .zlabel{font-size:10px; opacity:.5; min-width:38px; text-align:center;}
  #planHost{flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:12px;}
  #planBox{position:relative; flex:0 0 auto; background:#fff; box-shadow:0 0 0 1px var(--border);}
  #planCanvas,#ovl{position:absolute; inset:0; display:block;}
  #symLayer{position:absolute; inset:0;}
  #legend{
    flex:0 0 auto; background:var(--white); border-top:1px solid var(--border);
    display:flex; gap:14px; align-items:center; padding:6px 12px; font-size:10px; overflow-x:auto; white-space:nowrap;
  }
  .lg{display:inline-flex; align-items:center; gap:5px; opacity:.75;}
  .lg i{width:9px; height:9px; display:inline-block;}

  /* ---------- panel ---------- */
  #panel{
    width:400px; flex:0 0 400px; border-inline-end:1px solid var(--border);
    display:flex; flex-direction:column; background:var(--white); min-height:0;
  }
  body.collapsed #panel{display:none;}
  /* the plan must stay readable — never let the fixed panel starve it */
  @media (max-width:1180px){ #panel{width:340px; flex-basis:340px;} }
  @media (max-width:980px){ #panel{width:300px; flex-basis:300px;} #tiles{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:820px){
    #workView.on{flex-direction:column;}
    #stage{flex:1 1 58%; min-height:0;}
    #panel{
      width:100%; flex:1 1 42%; min-height:0;
      border-inline-end:none; border-top:1px solid var(--black);
    }
    #tiles{grid-template-columns:repeat(4,1fr);}
  }
  #tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); flex:0 0 auto;}
  .tile{background:var(--white); padding:8px 9px;}
  .tile .n{font-size:19px; font-weight:300; line-height:1.05;}
  .tile .l{font-size:8px; letter-spacing:.1em; text-transform:uppercase; opacity:.45; margin-top:2px;}
  #tabs{display:flex; flex:0 0 auto; border-bottom:1px solid var(--black); overflow-x:auto;}
  .tab{
    flex:1 0 auto; background:none; border:none; padding:10px 8px; cursor:pointer;
    font-size:10px; letter-spacing:.06em; opacity:.5; border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab:hover{opacity:.85;}
  .tab.on{opacity:1; font-weight:500; border-bottom-color:var(--accent); background:var(--gray);}
  .tab .bdg{
    display:inline-block; min-width:15px; padding:0 4px; margin-inline-start:4px;
    font-size:9px; color:#fff; background:var(--soft); line-height:14px;
  }
  .tab .bdg.f{background:var(--fail);} .tab .bdg.w{background:var(--warn);}
  #tabBody{flex:1; overflow-y:auto; overflow-x:hidden; padding:12px;}
  .grp-title{font-size:9px; letter-spacing:.18em; text-transform:uppercase; opacity:.4; margin:16px 0 7px;}
  .grp-title:first-child{margin-top:0;}

  /* cards */
  .card{
    border:1px solid var(--border); border-inline-start:3px solid var(--soft);
    padding:9px 11px; margin-bottom:7px; cursor:pointer; transition:.12s; background:var(--white);
  }
  .card:hover{background:var(--gray);}
  .card.sel{background:rgba(207,255,4,.16); border-color:var(--black);}
  .card.f{border-inline-start-color:var(--fail);}
  .card.w{border-inline-start-color:var(--warn);}
  .card.i{border-inline-start-color:var(--info);}
  .card.o{border-inline-start-color:var(--ok);}
  .card .ch{display:flex; align-items:center; gap:7px; margin-bottom:3px;}
  .num{
    flex:0 0 auto; min-width:19px; height:19px; padding:0 4px; color:#fff; font-size:10px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; background:var(--soft);
  }
  .num.f{background:var(--fail);} .num.w{background:var(--warn);}
  .num.i{background:var(--info);} .num.o{background:var(--ok);}
  .card .ct{font-size:12px; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card .cs{font-size:9px; opacity:.5; flex:0 0 auto;}
  .card .cb{font-size:11px; font-weight:300; opacity:.85; line-height:1.5;}
  .card .cb[contenteditable="true"]:focus{outline:1px solid var(--accent); background:#fff;}
  .card .cact{display:flex; gap:5px; margin-top:6px;}
  .xb{
    font-size:9px; padding:3px 7px; border:1px solid var(--border); background:var(--white);
    cursor:pointer; letter-spacing:.05em; opacity:.7;
  }
  .xb:hover{opacity:1; border-color:var(--black);}
  .empty{font-size:12px; opacity:.4; padding:18px 0; font-weight:300;}

  /* iron rules */
  .iron{border:1px solid var(--border); padding:10px 11px; margin-bottom:8px;}
  .iron.f{border-inline-start:3px solid var(--fail);}
  .iron.w{border-inline-start:3px solid var(--warn);}
  .iron.o{border-inline-start:3px solid var(--ok);}
  .iron .ih{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .iron .it{font-size:12px; font-weight:500; flex:1;}
  .chip{font-size:9px; letter-spacing:.08em; padding:2px 7px; color:#fff; white-space:nowrap;}
  .chip.f{background:var(--fail);} .chip.w{background:var(--warn);}
  .chip.o{background:var(--ok);} .chip.n{background:var(--soft);}
  .chip.i{background:var(--info);}
  .iron .ib{font-size:11px; font-weight:300; opacity:.75; line-height:1.5;}

  /* symbol library */
  .symgrp{border:1px solid var(--border); margin-bottom:6px;}
  .symgrp>summary{
    list-style:none; cursor:pointer; padding:9px 11px; font-size:10px;
    letter-spacing:.14em; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center;
  }
  .symgrp>summary::-webkit-details-marker{display:none;}
  .symgrp>summary::after{content:'+'; font-size:14px; opacity:.4;}
  .symgrp[open]>summary::after{content:'–';}
  .symgrp[open]>summary{background:var(--black); color:var(--white);}
  .symwrap{display:grid; grid-template-columns:repeat(2,1fr); gap:5px; padding:8px;}
  .symcard{
    display:flex; align-items:center; gap:7px; border:1px solid var(--border);
    padding:6px 7px; cursor:grab; background:var(--white); transition:.12s; user-select:none;
  }
  .symcard:hover{border-color:var(--black); background:var(--gray);}
  .symcard:active{cursor:grabbing;}
  .symcard.armed{border-color:var(--s-prog); background:rgba(214,0,154,.09);}
  .sb{
    flex:0 0 auto; width:22px; height:22px; color:#fff; font-size:9px; font-weight:700;
    display:flex; align-items:center; justify-content:center; letter-spacing:-.02em;
  }
  .symcard .sl{font-size:10px; font-weight:300; line-height:1.25;}

  /* placed symbols */
  .sym{
    position:absolute; transform:translate(-50%,-50%); cursor:move; z-index:5;
    display:flex; align-items:center; gap:0; user-select:none; touch-action:none;
  }
  .sym .sbx{
    width:24px; height:24px; color:#fff; font-size:9px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1.5px #fff; letter-spacing:-.02em;
  }
  .sym .stx{
    font-size:9px; background:#fff; padding:2px 5px; margin-inline-start:2px;
    white-space:nowrap; box-shadow:0 0 0 1px currentColor; font-weight:500;
  }
  .sym.sel .sbx{box-shadow:0 0 0 2px var(--accent),0 0 0 3.5px var(--black);}
  .sym .del{
    position:absolute; top:-8px; inset-inline-end:-8px; width:15px; height:15px; background:var(--black);
    color:#fff; font-size:10px; line-height:15px; text-align:center; cursor:pointer; display:none;
  }
  .sym:hover .del{display:block;}

  /* program table */
  table.pg{width:100%; border-collapse:collapse; font-size:11px;}
  table.pg th{
    font-size:8px; letter-spacing:.1em; text-transform:uppercase; opacity:.45; font-weight:400;
    text-align:right; padding:6px 5px; border-bottom:1px solid var(--black);
  }
  table.pg td{padding:6px 5px; border-bottom:1px solid var(--border); font-weight:300; vertical-align:top;}
  table.pg td.fn{font-weight:400;}
  table.pg tr.f{background:rgba(225,80,75,.09);}
  table.pg tr.w{background:rgba(227,139,0,.10);}
  table.pg tr.o{background:rgba(22,163,74,.07);}
  table.pg tr.n td{opacity:.4;}

  /* tri toggle */
  .tri{display:inline-flex; border:1px solid var(--border); flex:0 0 auto;}
  .tri button{font-size:9px; padding:3px 8px; background:var(--white); border:none; cursor:pointer;}
  .tri button.a-ok{background:var(--ok); color:#fff;}
  .tri button.a-fail{background:var(--fail); color:#fff;}
  .tri button.a-na{background:var(--soft); color:#fff;}

  /* modal */
  .modal{
    position:fixed; inset:0; background:rgba(27,27,27,.72); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-box{
    background:var(--white); border:1px solid var(--black); max-width:800px; width:100%;
    max-height:88vh; display:flex; flex-direction:column;
  }
  .modal-head{
    background:var(--black); color:var(--white); padding:12px 16px; flex:0 0 auto;
    display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:13px;
  }
  .modal-head small{display:block; font-size:9px; letter-spacing:.16em; text-transform:uppercase; opacity:.5; margin-top:3px;}
  .keylist{padding:11px 16px; font-size:11px; border-bottom:1px solid var(--border); flex:0 0 auto; line-height:2;}
  .keylist b{font-weight:500;}
  .keylist code{
    background:var(--gray); border:1px solid var(--border); padding:1px 5px;
    font-size:10px; margin:0 2px; font-family:ui-monospace,Consolas,monospace;
  }
  .modal-body{overflow:auto; flex:1 1 auto; min-height:0;}
  pre.json{
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; line-height:1.55;
    padding:16px; white-space:pre; direction:ltr; text-align:left; background:var(--gray);
  }
  .modal-foot{
    padding:11px 16px; border-top:1px solid var(--border); flex:0 0 auto;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .mini{
    font-size:10px; letter-spacing:.08em; background:none; border:1px solid var(--border);
    padding:7px 13px; cursor:pointer; transition:.15s; font-family:inherit;
  }
  .mini:hover{border-color:var(--black); background:var(--gray);}
  .mini.pri{background:var(--black); color:var(--white); border-color:var(--black);}
  .mini.pri:hover{background:var(--accent); color:var(--black);}

  /* project-details form */
  .frm{padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
  .frm label{display:block; font-size:9px; letter-spacing:.16em; text-transform:uppercase; opacity:.45; margin-bottom:4px;}
  .frm input{
    width:100%; border:1px solid var(--border); padding:8px 10px; font-size:13px;
    background:var(--white); color:var(--black);
  }
  .frm input:focus{outline:none; border-color:var(--black); box-shadow:inset 0 -2px 0 var(--accent);}
  .frm .wide{grid-column:1 / -1;}

  #toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--black); color:var(--accent); font-size:11px; letter-spacing:.06em;
    padding:9px 18px; z-index:99; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  #toast.on{opacity:1;}

  /* ---------- printed report ---------- */
  #report{display:none;}
  body.printing{overflow:auto; background:var(--gray);}
  body.printing>header, body.printing>.accent-bar,
  body.printing #uploadView, body.printing #workView, body.printing #toast{display:none !important;}
  body.printing #report{display:block;}
  .sheet{
    width:297mm; height:210mm; padding:11mm 13mm 9mm; box-sizing:border-box;
    background:var(--white); color:var(--black); position:relative; overflow:hidden;
    display:flex; flex-direction:column; margin:0 auto 8mm; box-shadow:0 0 0 1px var(--border);
    page-break-after:always; break-after:page;
  }
  .sheet:last-child{page-break-after:auto; break-after:auto;}
  .sh-head{
    flex:0 0 auto; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
    border-bottom:1px solid var(--black); padding-bottom:4mm;
  }
  .sh-brand{font-size:12px; font-weight:300; letter-spacing:.02em;}
  .sh-brand span{font-size:8px; letter-spacing:.22em; text-transform:uppercase; opacity:.45; margin-inline-start:8px;}
  .sh-proj{font-size:10px; opacity:.6; text-align:end; line-height:1.5;}
  .sh-title{
    flex:0 0 auto; font-size:17px; font-weight:300; margin:5mm 0 3mm; letter-spacing:-.01em;
    display:flex; align-items:baseline; gap:10px;
  }
  .sh-title em{font-style:normal; background:var(--accent); padding:0 7px;}
  .sh-title small{font-size:9px; letter-spacing:.16em; text-transform:uppercase; opacity:.4;}
  .sh-body{flex:1 1 auto; min-height:0; overflow:hidden;}
  .sh-foot{
    flex:0 0 auto; border-top:1px solid var(--border); padding-top:2.5mm; margin-top:3mm;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-size:8.5px; opacity:.55; line-height:1.5;
  }
  .sh-foot b{font-weight:500; opacity:.9;}

  /* cover */
  .cov{flex:1; display:flex; flex-direction:column; justify-content:center;}
  .cov .ck{font-size:9px; letter-spacing:.32em; text-transform:uppercase; opacity:.4; margin-bottom:6mm;}
  .cov h1{font-size:44px; font-weight:300; line-height:1.06; letter-spacing:-.02em; margin-bottom:4mm;}
  .cov .csub{font-size:15px; font-weight:300; opacity:.55; margin-bottom:9mm;}
  .cov .csub em{font-style:normal; background:var(--accent); padding:0 8px; opacity:1;}
  .covgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:0 1px; background:var(--border); margin-bottom:7mm;}
  .covgrid div{background:var(--white); padding:3mm 4mm;}
  .covgrid .k{font-size:8px; letter-spacing:.14em; text-transform:uppercase; opacity:.4; margin-bottom:1.5mm;}
  .covgrid .v{font-size:13px; font-weight:300;}
  .covstat{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--border);}
  .covstat div{background:var(--white); padding:3mm 4mm;}
  .covstat .n{font-size:26px; font-weight:300; line-height:1;}
  .covstat .l{font-size:8px; letter-spacing:.12em; text-transform:uppercase; opacity:.45; margin-top:1.5mm;}

  /* plan sheet — the image flexes, the legend keeps its own strip */
  .sh-body.plan{display:flex; flex-direction:column;}
  .planwrap{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;}
  .planwrap img{max-width:100%; max-height:100%; object-fit:contain; display:block;}
  .rlg{flex:0 0 auto; display:flex; gap:14px; flex-wrap:wrap; font-size:8.5px; opacity:.7; margin-top:2mm;}
  .rlg span{display:inline-flex; align-items:center; gap:4px;}
  .rlg i{width:8px; height:8px; display:inline-block;}

  /* report tables */
  table.rt{width:100%; border-collapse:collapse; font-size:10px;}
  table.rt th{
    font-size:8px; letter-spacing:.12em; text-transform:uppercase; opacity:.45; font-weight:400;
    text-align:right; padding:2.5mm 2mm; border-bottom:1px solid var(--black); white-space:nowrap;
  }
  table.rt td{padding:2.2mm 2mm; border-bottom:1px solid var(--border); font-weight:300; vertical-align:top; line-height:1.5;}
  table.rt td.b{font-weight:400;}
  table.rt tr.f td{background:rgba(225,80,75,.07);}
  table.rt tr.w td{background:rgba(227,139,0,.08);}
  table.rt tr.o td{background:rgba(22,163,74,.06);}
  table.rt tr.n td{opacity:.45;}
  .rnum{

const STATE = {
  mode:'auto', fileName:'', meta:{}, rooms:[], notes:[], symbols:[], dims:[], areas:[],

};
let PDFPAGE=null, BASE=null, VP1=null, ZOOM=1, TOOL=null, SEL=null, PENDING=null;
const LAYERS = { notes:true, syms:true, dims:true, areas:true };
const $ = s => document.querySelector(s);

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =====================================================================
   3. PDF PARSING
   ===================================================================== */
const AREA_RE=/^(\d+(?:\.\d+)?)\s*m²$/;
const PPL_RE=/^(\d+)\s*ppl(?:\s*\+\s*(\d+)\s*ppl)?$/i;
const INLINE_PPL=/^(.*?)\s*\|\s*(\d+)(?:\s*[-–]\s*(\d+))?\s*ppl$/i;
const RANGE_RE=/^(\d{1,2})\s*([WNES])\s*(\d{2,3})\s*[-–]\s*(\d{2,3})$/i;
const CODE_RE=/^(?:\d{1,2}\s*[WNES]\s*\d{1,2}|R\d{3,4})$/i;
const KEYWORD_RE=/^(kitchenette.*|cafeteria|pb|it|shower room|nursing room|nursery|lounge|storage|print( & copy)?|meet ?up( & game room)?|game room|vr|secure space|wc|vp(\s*[-–].*)?|reception|waiting area|video|deep work station.*|future stations?)$/i;

async function parsePdf(data, fileName){
  const pdf = await pdfjsLib.getDocument({data}).promise;
  const page = await pdf.getPage(1);
  const content = await page.getTextContent();

  const buckets=[0,0,0,0], items0=[], everyText=[], seen=new Set();
  for(const it of content.items){
    const t=it.transform, str=it.str.trim();
    if(!str) continue;
    everyText.push(str.toLowerCase());
    const k=str+'|'+Math.round(t[4])+'|'+Math.round(t[5]);
    if(seen.has(k)) continue; seen.add(k);
    const b=((Math.round(Math.atan2(t[1],t[0])/(Math.PI/2))%4)+4)%4;
    buckets[b]++; items0.push({str,t,w:it.width||0,b});
  }
  const dom=buckets.indexOf(Math.max(...buckets));
  const th=dom*Math.PI/2, cos=Math.round(Math.cos(th)), sin=Math.round(Math.sin(th));
  const raw=[];
  for(const it of items0){
    if(it.b!==dom) continue;
    const t=it.t, u=t[4]*cos+t[5]*sin, wv=-t[4]*sin+t[5]*cos;
    raw.push({text:it.str, x:u+it.w/2, y:-wv, w:it.w, pdfX:t[4], pdfY:t[5]});
  }
  raw.sort((a,b)=>a.y-b.y||a.x-b.x);
  const lines=[];
  for(const r of raw){
    const L=lines[lines.length-1];
    const gap=L?(r.x-r.w/2)-(L.x+L.wSum/2):0;
    if(L && Math.abs(r.y-L.y)<3 && gap>-2 && gap<15){
      L.text+=' '+r.text;
      const x0=Math.min(L.x-L.wSum/2, r.x-r.w/2), x1=Math.max(L.x+L.wSum/2, r.x+r.w/2);
      L.x=(x0+x1)/2; L.wSum=x1-x0;
    } else lines.push({text:r.text,x:r.x,y:r.y,wSum:r.w,pdfX:r.pdfX,pdfY:r.pdfY});
  }

  const used=new Array(lines.length).fill(false), tags=[];
  lines.forEach((it,i)=>{
    if(used[i]) return;
    const m=AREA_RE.exec(it.text), p=PPL_RE.exec(it.text);
    const ip=INLINE_PPL.exec(it.text), rg=RANGE_RE.exec(it.text);
    if(!m&&!p&&!ip&&!rg) return;
    const tag={area:null,ppl:null,stations:null,code:null,isDept:false,names:[],x:it.x,y:it.y,pdfX:it.pdfX,pdfY:it.pdfY};
    if(m) tag.area=parseFloat(m[1]);
    if(p) tag.ppl=parseInt(p[1])+(p[2]?parseInt(p[2]):0);
    if(ip){ tag.ppl=Math.max(parseInt(ip[2]), ip[3]?parseInt(ip[3]):0); if(ip[1].trim()) tag.names.push([it.y,ip[1].trim()]); }
    if(rg){
      const lo=parseInt(rg[3]), hi=parseInt(rg[4]);
      if(hi>lo && hi-lo<80){ tag.stations=hi-lo+1; tag.isDept=true; tag.code=rg[0]; } else return;
    }
    used[i]=true;
    lines.forEach((jt,j)=>{
      if(used[j]||j===i) return;
      const dx=Math.abs(jt.x-it.x), dy=jt.y-it.y;
      if(dx>60||dy<-12||dy>30) return;
      const m2=AREA_RE.exec(jt.text), p2=PPL_RE.exec(jt.text);
      const ip2=INLINE_PPL.exec(jt.text), rg2=RANGE_RE.exec(jt.text), cd2=CODE_RE.exec(jt.text);
      if(ip2||rg2) return;
      if(m2&&tag.area===null){ tag.area=parseFloat(m2[1]); used[j]=true; }
      else if(p2&&tag.ppl===null){ tag.ppl=parseInt(p2[1])+(p2[2]?parseInt(p2[2]):0); used[j]=true; }
      else if(cd2){ tag.code=jt.text; used[j]=true; }
      else if(!m2&&!p2&&!/^\d+$/.test(jt.text)){
        if(tag.names.length && KEYWORD_RE.test(jt.text)) return;
        tag.names.push([jt.y,jt.text]); used[j]=true;
      }
    });
    tag.name=tag.names.sort((a,b)=>a[0]-b[0]).map(n=>n[1]).join(' ').trim();
    if(tag.stations && tag.ppl===null) tag.ppl=tag.stations;
    tags.push(tag);
  });
  lines.forEach((it,i)=>{
    if(used[i]||!KEYWORD_RE.test(it.text)) return;
    tags.push({area:null,ppl:null,stations:null,code:null,isDept:false,names:[],name:it.text,x:it.x,y:it.y,pdfX:it.pdfX,pdfY:it.pdfY});
    used[i]=true;
  });

  const vp1=page.getViewport({scale:1});
  tags.forEach(t=>{ const p=vp1.convertToViewportPoint(t.pdfX,t.pdfY); t.nx=p[0]/vp1.width; t.ny=p[1]/vp1.height; });

  return { tags, allText:everyText, page, vp1, fileName };
}

/* =====================================================================
   4. CLASSIFICATION + ROOM RULES
   ===================================================================== */
function classify(name, tag){
  const n=(name||'').toLowerCase();
  if(tag&&tag.isDept) return 'workstations';
  if(!n) return 'unknown';
  if(n.includes('board')) return 'boardroom';
  if(n.includes('alternative meeting')) return 'altmeeting';
  if(n.includes('meet up')||n.includes('game room')) return 'social';
  if(n.includes('meeting')) return 'meeting';
  if(n.includes('executive')||/\bceo\b/.test(n)||/\bchro\b/.test(n)||/\bcos\b/.test(n)) return 'executive';
  if(/\bvp\b/.test(n)) return 'vp';
  if(n.includes('director')) return 'director';
  if(n.includes('hrbp')) return 'hrbp';
  if(n.includes('product')||n.includes('architect')||n.includes('admin')||n.includes('legal')||n.includes('finance')||/\bklf\b/.test(n)||n.includes('private room')) return 'staffroom';
  if(n.includes('reception')||n.includes('waiting area')) return 'reception';
  if(n.includes('cafeteria')) return 'kitchenette';
  if(/^video$/.test(n)) return 'specialty';
  if(/^hr\b/.test(n)||/\bhr$/.test(n)) return 'hr';
  if(n.includes('facilities')) return 'facilities';
  if(/\bit\b/.test(n)||/\bnoc\b/.test(n)) return 'it';
  if(n.includes('nursery')||n.includes('nursing')) return 'nursery';
  if(n.includes('kitchen')) return 'kitchenette';
  if(/\bwc\b/.test(n)||n.includes('toilet')) return 'wc';
  if(n.includes('shower')) return 'shower';
  if(/\bpb\b/.test(n)||n.includes('phone')||n.includes('booth')||n.includes('nook')) return 'phonebooth';
  if(n.includes('lounge')) return 'lounge';
  if(n.includes('print')||n.includes('copy')) return 'printcopy';
  if(n.includes('storage')||n.includes('secure space')) return 'storage';
  if(n.includes('service')) return 'service';
  if(n.includes('future')) return 'future';
  if(/\bvr\b/.test(n)) return 'specialty';
  if(n.includes('neighbourhood')||n.includes('neighborhood')||n.includes('open')) return 'openspace';
  if(/^room\b/.test(n)) return 'future';
  return 'unknown';
}
const TYPE_HE={
  boardroom:'חדר דירקטוריון', meeting:'חדר ישיבות', altmeeting:'ישיבות אלטרנטיבי',
  executive:'הנהלה', vp:'VP', director:'מנהל קבוצה', hrbp:'HRBP', staffroom:'חדר צוות',
  hr:'HR', facilities:'תפעול', it:'IT / NOC', nursery:'הנקה', kitchenette:'מטבחון',
  wc:'שירותים', shower:'מקלחת', service:'שירות', future:'עתודה', openspace:'Open Space',
  workstations:'עמדות — מחלקה', phonebooth:'תא טלפון', lounge:'לאונג׳', social:'מפגש / משחק',
  printcopy:'הדפסה', storage:'אחסון', specialty:'ייעודי', reception:'קבלה / המתנה', unknown:'לא מזוהה'
};

function interpSeat(tbl,s){
  if(s<=tbl[0][0]) return tbl[0][1]*(s/tbl[0][0]);
  for(let i=0;i<tbl.length-1;i++){
    const [s1,a1]=tbl[i],[s2,a2]=tbl[i+1];
    if(s<=s2) return a1+(a2-a1)*(s-s1)/(s2-s1);
  }
  const [sL,aL]=tbl[tbl.length-1]; return aL*s/sL;
}

function checkRoom(tag){
  const type=classify(tag.name,tag), R=RULES[type]||{};
  const out={type,level:'ok',msgs:[]};
  const fail=m=>{out.level='fail'; out.msgs.push({l:'fail',m});};
  const warn=m=>{if(out.level!=='fail')out.level='warn'; out.msgs.push({l:'warn',m});};
  const info=m=>out.msgs.push({l:'info',m});
  const ok=m=>out.msgs.push({l:'ok',m});

  if(type==='unknown'){ warn(tag.name?`סוג לא מזוהה — ״${tag.name}״`:'תגית ללא שם חדר'); return out; }
  if(type==='workstations'){
    ok(`${tag.stations} עמדות${tag.name?' — '+tag.name:''}`);
    if(!tag.name) warn('טווח עמדות ללא שם מחלקה');
    return out;
  }
  if(['phonebooth','lounge','social','printcopy','storage','shower','specialty','reception'].includes(type)){
    if(tag.area!=null && R.minArea!=null && tag.area<R.minArea) warn(`${tag.area} מ״ר — מתחת ל-${R.minArea}`);
    else ok('קיים בפרוגרמה');
    return out;
  }
  if(type==='openspace'){
    if(tag.area&&tag.ppl){
      const d=tag.area/tag.ppl;
      if(d<R.densityMin) fail(`צפיפות ${d.toFixed(2)} מ״ר/עובד — צפוף מדי (מינ׳ ${R.densityMin})`);
      else if(d<R.densityWarnLow) warn(`צפיפות ${d.toFixed(2)} מ״ר/עובד — קצה תחתון`);
      else if(d>R.densityWarnHigh) warn(`צפיפות ${d.toFixed(2)} מ״ר/עובד — מעל הטווח היעיל`);
      else ok(`צפיפות ${d.toFixed(2)} מ״ר/עובד`);
    } else if(tag.ppl) info(`${tag.ppl} עמדות — אין תגית שטח`);
    return out;
  }
  if(type==='boardroom'){
    if(tag.area&&tag.area<R.minArea) fail(`${tag.area} מ״ר — מתחת ל-${R.minArea}`);
    if(tag.area&&tag.ppl){
      const d=tag.area/tag.ppl;
      if(d<R.perSeatMin) fail(`${d.toFixed(2)} מ״ר למקום — צפוף (מינ׳ ${R.perSeatMin})`);
      else if(d>R.perSeatMax) warn(`${d.toFixed(2)} מ״ר למקום — מעל הטווח`);
      else ok(`${d.toFixed(2)} מ״ר למקום`);
    }
    return out;
  }
  if(type==='meeting'||type==='altmeeting'){
    if(type==='altmeeting'){
      if(tag.area==null) info(`אין שטח בתגית — מינימום ${R.minArea} מ״ר`);
      else if(tag.area<R.minArea) fail(`${tag.area} מ״ר — מתחת ל-${R.minArea}`);
      else ok('בטווח');
      return out;
    }
    if(tag.ppl&&tag.area){
      const minA=interpSeat(RULES.meeting.seatTable,tag.ppl), d=tag.area/tag.ppl;
      if(tag.area<minA*0.93) fail(`${tag.area} מ״ר ל-${tag.ppl} מקומות — נדרש ~${minA.toFixed(1)}`);
      else if(tag.area<minA) warn(`${tag.area} מ״ר — גבולי מול ~${minA.toFixed(1)}`);
      else ok(`${tag.area} מ״ר / ${tag.ppl} מק׳ (${d.toFixed(2)} למקום)`);
      if(d>RULES.meeting.perSeatMax) warn(`${d.toFixed(2)} מ״ר למקום — גדול ביחס לקיבולת`);
    } else if(tag.area){
      if(tag.area<R.minNoSeats) fail(`${tag.area} מ״ר — קטן ממינימום חדר ישיבות`);
      else info('אין תגית קיבולת');
    } else if(tag.ppl){
      info(`${tag.ppl} מקומות — ודא ≥${interpSeat(RULES.meeting.seatTable,tag.ppl).toFixed(1)} מ״ר`);
    }
    return out;
  }
  if(type==='wc'){
    if(tag.area&&tag.area<R.stallMin) fail(`תא ${tag.area} מ״ר — מתחת ל-${R.stallMin}`);
    else ok('מידות תא בטווח');
    return out;
  }
  if(type==='nursery'){
    if(tag.area==null) info(`קיים בקומה — אין שטח בתגית (מינ׳ ${R.minArea})`);
    else if(tag.area<R.minArea) fail(`${tag.area} מ״ר — מתחת ל-${R.minArea}`);
    else if(tag.area<R.recommended) warn(`${tag.area} מ״ר — מתחת למומלץ ${R.recommended}`);
    else ok('שטח תקין');
    return out;
  }
  if(R.minArea!=null && tag.area!=null){
    if(tag.area<R.minArea) fail(`${tag.area} מ״ר — מתחת ל-${R.minArea} (${R.label})`);
    else if(R.typMin&&tag.area<R.typMin) warn(`${tag.area} מ״ר — מתחת לטווח הטיפוסי ${R.typMin}–${R.typMax}`);
    else ok('בטווח');
  }
  if(!out.msgs.length) info('תגית ללא נתוני שטח');
  return out;
}

/* =====================================================================
   5. IRON RULES — gate 0
   ===================================================================== */
function ironChecks(parse, rooms){
  const T=parse.allText, has=re=>T.some(t=>re.test(t));
  const dimTok=T.filter(t=>/^\d{1,2}[.,]\d{2}$/.test(t)).length;
  const cmTok=T.filter(t=>/^\d{3,5}$/.test(t)).length;
  const symIds=STATE.symbols.map(s=>s.k);
  const hasSym=(...k)=>k.some(x=>symIds.includes(x));
  const hasDim=STATE.dims.length>0;
  const R=[];

  R.push({ id:'roomdims', n:'מידות כל חדר במטרים',
    auto: dimTok >= Math.max(4, Math.round(rooms.length*0.5)),
    manual: STATE.dims.length>=Math.max(2,Math.round(rooms.length*0.25)),
    okMsg:`זוהו ${dimTok} מידות במטרים בתוכנית.`,
    badMsg:`זוהו ${dimTok} מידות בלבד מול ${rooms.length} תגיות. סמן מידות חסרות בכלי "קו מידה".`,
    tool:'dim' });

  R.push({ id:'overall', n:'קווי מידה — אורך ורוחב',
    auto: cmTok>=4,
    manual: hasDim,
    okMsg:'זוהו קווי מידה כלליים בתוכנית.',
    badMsg:'לא זוהו קווי מידה כלליים. שרטט אורך ורוחב בכלי "קו מידה".',
    tool:'dim' });

  R.push({ id:'entry', n:'סימון כניסה ויציאה לקומה',
    auto: has(/entrance|main entry|\bentry\b|lobby|כניסה/) && has(/exit|יציאה|egress/),
    manual: hasSym('entry')&&hasSym('exit'),
    okMsg:'כניסה ויציאה מסומנות.',
    badMsg:'לא זוהה סימון כניסה/יציאה. גרור IN ו-EX מהמחסן.',
    sym:'entry' });

  R.push({ id:'panels', n:'ארונות חשמל ותקשורת',
    auto: has(/electric|חשמל|\bel\b/) && has(/\bit\b|telecom|comm|תקשורת|mdf|idf/),
    manual: hasSym('el','elm') && hasSym('it','srv'),
    okMsg:'ארונות חשמל ותקשורת מסומנים.',
    badMsg:'לא זוהה סימון ארונות. גרור EL ו-IT מהמחסן.',
    sym:'el' });

  R.forEach(r=>{
    r.level = r.auto ? 'o' : (r.manual||STATE.iron[r.id]) ? 'o' : 'f';
    r.src   = r.auto ? 'זוהה אוטומטית' : (r.manual||STATE.iron[r.id]) ? 'הושלם ידנית' : 'חסר';
    r.msg   = r.level==='o' ? r.okMsg : r.badMsg;
  });
  return R;
}

/* =====================================================================
   6. FLOOR CHECKS
   ===================================================================== */
function floorChecks(parse, rooms){
  const out=[], present=t=>rooms.some(r=>r.check.type===t);
  for(const [t,he] of [['kitchenette','מטבחון'],['it','חדר IT / תקשורת'],['nursery','חדר הנקה']]){
    out.push(present(t)
      ? {level:'ok', n:`${he} בקומה`, m:'קיים בתוכנית.'}
      : {level:'fail', n:`${he} בקומה`, m:'לא נמצא בתגיות — חובה בכל קומה.'});
  }
  const meetings=rooms.filter(r=>['meeting','boardroom','altmeeting'].includes(r.check.type));
  out.push(meetings.length
    ? {level:'ok', n:'חדרי ישיבות', m:`${meetings.length} חדרים בקומה.`}
    : {level:'fail', n:'חדרי ישיבות', m:'לא נמצא אף חדר ישיבות.'});
  out.push(present('wc')
    ? {level:'ok', n:'שירותים', m:'תאי שירותים מתויגים.'}
    : {level:'warn', n:'שירותים', m:'לא נמצאו תגיות WC — ודא קיום בגרעין.'});

  const ws=rooms.filter(r=>['openspace','workstations'].includes(r.check.type)&&r.tag.ppl).reduce((s,r)=>s+r.tag.ppl,0);
  const seats=meetings.reduce((s,r)=>s+(r.tag.ppl||0),0);
  if(ws>0&&seats>0){
    const ratio=100*seats/ws, min=RULES.floor.meetingRatioMin;
    out.push(ratio<min
      ? {level:'warn', n:'יחס ישיבות / עמדות', m:`${ratio.toFixed(0)}% — מתחת ל-${min}%. שקול חדר נוסף.`}
      : {level:'ok', n:'יחס ישיבות / עמדות', m:`${seats} מקומות מול ${ws} עמדות — ${ratio.toFixed(0)}%.`});
  }
  const pbs=rooms.filter(r=>r.check.type==='phonebooth').length;
  if(ws>=30){
    if(!pbs) out.push({level:'warn', n:'תאי טלפון', m:`אין תאי טלפון ל-${ws} עמדות (סטנדרט ~1:${RULES.phonebooth.perStationsRatio}).`});
    else if(ws/pbs>RULES.phonebooth.perStationsRatio*1.5) out.push({level:'warn', n:'תאי טלפון', m:`${pbs} תאים ל-${ws} עמדות (1:${Math.round(ws/pbs)}) — מעט.`});
    else out.push({level:'ok', n:'תאי טלפון', m:`${pbs} תאים ל-${ws} עמדות.`});
  }
  const unnamed=rooms.filter(r=>!r.tag.name).length;
  if(unnamed) out.push({level:'warn', n:'תגיות חסרות', m:`${unnamed} תגיות ללא שם חדר.`});

  /* data coverage — what the tool could NOT check */
  const areaRelevant=rooms.filter(r=>RULES[r.check.type]&&(RULES[r.check.type].minArea!=null||r.check.type==='meeting'||r.check.type==='openspace'));
  const noArea=areaRelevant.filter(r=>r.tag.area==null).length;
  if(noArea){
    const pct=Math.round(100*noArea/Math.max(1,areaRelevant.length));
    out.push({ level: pct>=60?'fail':'warn', n:'כיסוי בדיקת שטחים',
      m:`${noArea} מתוך ${areaRelevant.length} חדרים ללא תגית שטח (${pct}%) — בדיקת שטח מול הסטנדרט לא בוצעה עבורם.` });
  }
  const capRelevant=rooms.filter(r=>['meeting','boardroom','openspace'].includes(r.check.type));
  const noCap=capRelevant.filter(r=>r.tag.ppl==null).length;
  if(noCap) out.push({ level:'warn', n:'כיסוי בדיקת קיבולת',
    m:`${noCap} מתוך ${capRelevant.length} חדרי ישיבות / Open Space ללא תגית קיבולת.` });
  const dq=rooms.length?Math.round(100*rooms.filter(r=>r.tag.name).length/rooms.length):0;
  out.push({level:dq>=95?'ok':dq>=80?'warn':'fail', n:'שלמות דאטה', m:`${dq}% מהתגיות עם שם חדר.`});
  return out;
}

/* =====================================================================
   7. OPEN ITEMS — silent analysis, short notes only
   ===================================================================== */
function openItems(rooms){
  const seen={}, out=[];
  rooms.forEach(r=>{
    const items=TYPE_OPEN_ITEMS[r.check.type];
    if(!items) return;
    items.forEach(txt=>{
      const k=r.check.type+'|'+txt;
      if(seen[k]) return; seen[k]=1;
      out.push({ id:k, type:r.check.type, scope:TYPE_HE[r.check.type], n:txt });
    });
  });
  (STATE.program&&STATE.program.qa||[]).forEach((q,i)=>{
    out.push({ id:'qa'+i, type:'qa', scope:'QA פרויקט', n:q.name||q });
  });
  return out;
}

/* =====================================================================
   8. NOTES MODEL — everything on the plan is a note
   ===================================================================== */
const LV={fail:'f',warn:'w',info:'i',ok:'o'};
function buildNotes(rooms, fc){
  const keep=STATE.notes.filter(n=>n.src==='custom'||n.src==='cloud');
  const edits={}; STATE.notes.forEach(n=>{ if(n.edited) edits[n.id]=n.body; });
  const out=[];
  rooms.forEach(r=>{
    if(r.check.level==='ok') return;
    const body=r.check.msgs.filter(m=>m.l===r.check.level).map(m=>m.m).join(' · ');
    out.push({ id:'r'+r.i, lv:LV[r.check.level], src:'room',
      title:r.tag.name||'תגית ללא שם', sub:TYPE_HE[r.check.type],
      body: edits['r'+r.i]||body, edited:!!edits['r'+r.i],
      nx:r.tag.nx, ny:r.tag.ny, area:r.tag.area, ppl:r.tag.ppl });
  });
  fc.forEach((c,i)=>{
    if(c.level==='ok') return;
    out.push({ id:'f'+i, lv:LV[c.level], src:'floor', title:c.n, sub:'בדיקה קומתית',
      body: edits['f'+i]||c.m, edited:!!edits['f'+i], nx:null, ny:null });
  });
  keep.forEach(n=>out.push(n));
  const ord={f:0,w:1,i:2,o:3}, man=n=>(n.src==='custom'||n.src==='cloud')?1:0;
  out.sort((a,b)=>(ord[a.lv]-ord[b.lv]) || man(a)-man(b));
  out.forEach((n,i)=>n.num=i+1);
  STATE.notes=out;
}

/* =====================================================================
   9. RENDER — fit to page, always
   ===================================================================== */
async function renderBase(page){
  const vp1=page.getViewport({scale:1});
  const s=Math.min(3, 2400/Math.max(vp1.width, vp1.height));
  const vp=page.getViewport({scale:s});
  const c=document.createElement('canvas');
  c.width=Math.round(vp.width); c.height=Math.round(vp.height);
  await page.render({canvasContext:c.getContext('2d'), viewport:vp, intent:'print'}).promise;
  BASE=c;
}

function fitBox(){
  const host=$('#planHost');
  const aw=Math.max(60,host.clientWidth-24), ah=Math.max(60,host.clientHeight-24);
  const ar=BASE.width/BASE.height;
  let w=aw, h=w/ar;
  if(h>ah){ h=ah; w=h*ar; }
  return { w:w*ZOOM, h:h*ZOOM };
}

function layout(){
  if(!BASE) return;
  const {w,h}=fitBox();
  const box=$('#planBox'), cv=$('#planCanvas'), ov=$('#ovl');
  box.style.width=w+'px'; box.style.height=h+'px';
  const dpr=Math.min(2, window.devicePixelRatio||1);
  [cv,ov].forEach(c=>{ c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); c.style.width=w+'px'; c.style.height=h+'px'; });
  const c=cv.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  c.imageSmoothingEnabled=true; c.imageSmoothingQuality='high';
  c.drawImage(BASE,0,0,w,h);
  drawOverlay(); placeSymbols();
  $('#zlabel').textContent=Math.round(ZOOM*100)+'%';
  $('#tFit').classList.toggle('on', Math.abs(ZOOM-1)<0.01);
}

const CLR={f:'#E1504B',w:'#E38B00',i:'#0000FF',o:'#16A34A'};
const DIM_CLR='#D6009A', AREA_CLR='#0000FF';
let MARKERS=[];

function lvColor(lv){ return CLR[lv]||'#8A8A8A'; }

/* ---- polygon helpers (all in normalised 0..1 space) ---- */
function polyBounds(pts){
  let x0=1,y0=1,x1=0,y1=0;
  pts.forEach(p=>{ if(p.x<x0)x0=p.x; if(p.y<y0)y0=p.y; if(p.x>x1)x1=p.x; if(p.y>y1)y1=p.y; });
  return {x0,y0,x1,y1};
}
/* signed — the sign gives the winding, the magnitude feeds the m² maths */
function shoelace(pts){
  let s=0;
  for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; s+=a.x*b.y-b.x*a.y; }
  return s/2;
}
function polyCentroid(pts){
  const A=shoelace(pts);
  if(Math.abs(A)<1e-9){ const b=polyBounds(pts); return {x:(b.x0+b.x1)/2, y:(b.y0+b.y1)/2}; }
  let cx=0, cy=0;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length], f=a.x*b.y-b.x*a.y;
    cx+=(a.x+b.x)*f; cy+=(a.y+b.y)*f;
  }
  return { x:cx/(6*A), y:cy/(6*A) };
}
function wrapLines(c, text, maxW, maxLines){
  const words=String(text||'').split(/\s+/).filter(Boolean), out=[];
  let line='';
  words.forEach(wd=>{
    const t=line?line+' '+wd:wd;
    if(c.measureText(t).width>maxW && line){ out.push(line); line=wd; }
    else line=t;
  });
  if(line) out.push(line);
  if(out.length>maxLines){ const cut=out.slice(0,maxLines); cut[maxLines-1]+='…'; return cut; }
  return out;
}

/* =====================================================================
   ONE painter for both the live overlay and the flattened export image.
   Every size scales off k, so a 2400px print composite reads like the
   400px-wide screen version instead of collapsing to hairlines.
   ===================================================================== */
function paintMarkup(c, w, h, opt){
  const o = opt||{};
  const L = o.layers||LAYERS, sel = o.sel;
  const k = Math.max(0.7, w/900);
  const marks = [];
  if(L.areas) paintAreas(c,w,h,k);
  if(L.dims)  paintDims(c,w,h,k);
  if(L.notes){
    /* clouds first — the numbered pins must stay readable on top of them */
    STATE.notes.forEach(n=>{ if(n.shape==='cloud'){ const m=paintCloud(c,w,h,k,n,sel); if(m) marks.push(m); } });
    STATE.notes.forEach(n=>{ if(n.shape!=='cloud'){ const m=paintPin(c,w,h,k,n,sel); if(m) marks.push(m); } });
  }
  return marks;
}

function paintBadge(c,k,n,bx,by,S,col,sel){
  c.fillStyle='#fff'; c.fillRect(bx-1.5*k,by-1.5*k,S+3*k,S+3*k);
  c.fillStyle=col; c.fillRect(bx,by,S,S);
  c.fillStyle='#fff'; c.font='700 '+(S*0.52).toFixed(1)+'px Helvetica,Arial';
  c.textAlign='center'; c.textBaseline='middle'; c.direction='ltr';
  c.fillText(n.num, bx+S/2, by+S/2+0.5*k);
  if(sel===n.id){
    c.strokeStyle='#CFFF04'; c.lineWidth=2.5*k; c.strokeRect(bx-3*k,by-3*k,S+6*k,S+6*k);
    c.strokeStyle='#1B1B1B'; c.lineWidth=1*k;   c.strokeRect(bx-4.5*k,by-4.5*k,S+9*k,S+9*k);
  }
}

function paintPin(c,w,h,k,n,sel){
  if(n.nx==null) return null;
  const x=n.nx*w, y=n.ny*h, S=20*k, col=lvColor(n.lv);
  const bx=x+S*0.85, by=y-S*1.85;
  c.strokeStyle=col; c.lineWidth=1.6*k;
  c.beginPath(); c.moveTo(x,y); c.lineTo(bx,by+S); c.stroke();
  paintBadge(c,k,n,bx,by,S,col,sel);
  c.fillStyle=col; c.beginPath(); c.arc(x,y,3.2*k,0,6.284); c.fill();
  c.strokeStyle='#fff'; c.lineWidth=1*k; c.stroke();
  return {id:n.id,bx,by,S};
}

/* revision cloud — constant-radius arcs walked along the closed path,
   always bulging away from the interior. Text sits in a boxed caption
   under the cloud so it stays legible over dense drawings. */
function paintCloud(c,w,h,k,n,sel){
  const pn=n.pts||[];
  if(pn.length<2) return null;
  const col=lvColor(n.lv);
  const r=Math.max(4, 7*k);
  /* canvas angles grow toward +y (down), so a clockwise-on-screen path needs
     anticlockwise=false for the scallops to bulge away from the interior */
  const out=shoelace(pn)<0;
  const pts=pn.map(p=>({x:p.x*w, y:p.y*h}));

  const path=[]; let carry=0;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    const seg=Math.hypot(b.x-a.x, b.y-a.y);
    if(seg<0.01) continue;
    let d=carry;
    while(d<seg){ path.push({x:a.x+(b.x-a.x)*d/seg, y:a.y+(b.y-a.y)*d/seg}); d+=2*r; }
    carry=d-seg;
  }
  if(path.length<2) return null;

  c.save();
  c.strokeStyle=col; c.lineWidth=Math.max(1.3, 1.9*k); c.lineJoin='round';
  c.beginPath();
  for(let i=0;i<path.length;i++){
    const a=path[i], b=path[(i+1)%path.length];
    const rad=Math.hypot(b.x-a.x, b.y-a.y)/2;
    if(rad<0.4) continue;
    c.arc((a.x+b.x)/2, (a.y+b.y)/2, rad, Math.atan2(b.y-a.y,b.x-a.x)+Math.PI, Math.atan2(b.y-a.y,b.x-a.x), out);
  }
  c.stroke();
  if(sel===n.id){
    c.strokeStyle='#CFFF04'; c.lineWidth=Math.max(1,1.1*k); c.setLineDash([4*k,3*k]);
    c.beginPath();
    pts.forEach((p,i)=> i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));
    c.closePath(); c.stroke(); c.setLineDash([]);
  }
  c.restore();

  const bb=polyBounds(pn);
  const S=20*k, bx=Math.max(2*k, bb.x0*w-S*0.25), by=Math.max(2*k, bb.y0*h-S*1.2);
  paintBadge(c,k,n,bx,by,S,col,sel);

  if(n.body){
    c.save();
    c.font='500 '+(11*k).toFixed(1)+'px Helvetica,Arial';
    c.direction='rtl'; c.textAlign='right'; c.textBaseline='top';
    const maxW=Math.max(150*k, (bb.x1-bb.x0)*w);
    const lines=wrapLines(c, n.body, maxW, 3);
    const lh=14*k, pad=5*k;
    const tw=Math.max.apply(null, lines.map(l=>c.measureText(l).width))+pad*2;
    const th=lines.length*lh+pad*2;
    let tx=Math.min(w-2*k, bb.x1*w), ty=bb.y1*h+5*k;
    if(ty+th>h) ty=Math.max(2*k, bb.y0*h-th-5*k);
    if(tx-tw<0) tx=tw+2*k;
    c.fillStyle='rgba(255,255,255,.94)'; c.fillRect(tx-tw,ty,tw,th);
    c.strokeStyle=col; c.lineWidth=Math.max(1,1.2*k); c.strokeRect(tx-tw,ty,tw,th);
    c.fillStyle=col;
    lines.forEach((l,i)=> c.fillText(l, tx-pad, ty+pad+i*lh));
    c.restore();
  }
  return {id:n.id,bx,by,S};
}

function paintDims(c,w,h,k){
  STATE.dims.forEach(d=>{
    const x1=d.x1*w, y1=d.y1*h, x2=d.x2*w, y2=d.y2*h;
    const col=d.calib?'#0000FF':DIM_CLR;
    c.strokeStyle=col; c.lineWidth=1.6*k;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    const a=Math.atan2(y2-y1,x2-x1), t=7*k;
    [[x1,y1],[x2,y2]].forEach(([px,py])=>{
      c.beginPath();
      c.moveTo(px-Math.sin(a)*t, py+Math.cos(a)*t);
      c.lineTo(px+Math.sin(a)*t, py-Math.cos(a)*t);
      c.stroke();
    });
    const lbl=d.label||'—', mx=(x1+x2)/2, my=(y1+y2)/2;
    c.font='600 '+(11*k).toFixed(1)+'px Helvetica,Arial';
    c.textAlign='center'; c.textBaseline='middle'; c.direction='rtl';
    const tw=c.measureText(lbl).width+9*k, th=16*k;
    c.fillStyle='#fff'; c.fillRect(mx-tw/2,my-th/2,tw,th);
    c.strokeStyle=col; c.lineWidth=1.2*k; c.strokeRect(mx-tw/2,my-th/2,tw,th);
    c.fillStyle=col; c.fillText(lbl,mx,my+0.5*k);
  });
}

function paintAreas(c,w,h,k){
  STATE.areas.forEach(a=>{
    const pts=(a.pts||[]).map(p=>({x:p.x*w, y:p.y*h}));
    if(pts.length<3) return;
    c.save();
    c.beginPath();
    pts.forEach((p,i)=> i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));
    c.closePath();
    c.fillStyle='rgba(0,0,255,.07)'; c.fill();
    c.strokeStyle=AREA_CLR; c.lineWidth=Math.max(1.2,1.6*k);
    c.setLineDash([6*k,3*k]); c.stroke(); c.setLineDash([]);
    c.fillStyle=AREA_CLR;
    pts.forEach(p=>{ c.beginPath(); c.arc(p.x,p.y,2.4*k,0,6.284); c.fill(); });

    const ct=polyCentroid(a.pts);
    const lines=[a.label||'—'];
    if(a.name) lines.unshift(a.name);
    c.font='600 '+(11.5*k).toFixed(1)+'px Helvetica,Arial';
    c.textAlign='center'; c.textBaseline='middle'; c.direction='rtl';
    const tw=Math.max.apply(null, lines.map(l=>c.measureText(l).width))+11*k;
    const lh=14*k, th=lines.length*lh+6*k;
    const cx=ct.x*w, cy=ct.y*h;
    c.fillStyle='rgba(255,255,255,.94)'; c.fillRect(cx-tw/2, cy-th/2, tw, th);
    c.strokeStyle=AREA_CLR; c.lineWidth=Math.max(1,1.2*k); c.strokeRect(cx-tw/2, cy-th/2, tw, th);
    c.fillStyle=AREA_CLR;
    lines.forEach((l,i)=> c.fillText(l, cx, cy-th/2+3*k+lh/2+i*lh));
    if(SEL===a.id){
      c.strokeStyle='#CFFF04'; c.lineWidth=2*k;
      c.strokeRect(cx-tw/2-3*k, cy-th/2-3*k, tw+6*k, th+6*k);
    }
    c.restore();
  });
}

function drawOverlay(){
  const ov=$('#ovl'), {w,h}=fitBox();
  const dpr=Math.min(2, window.devicePixelRatio||1);
  const c=ov.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  MARKERS=paintMarkup(c,w,h,{layers:LAYERS, sel:SEL});
  drawPending(c,w,h);
}

/* rubber-band feedback for the in-progress dim / polygon / cloud */
function drawPending(c,w,h){
  if(!PENDING) return;
  c.save();
  if(PENDING.kind==='dim' && PENDING.x1!=null){
    c.strokeStyle=DIM_CLR; c.lineWidth=1.5; c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(PENDING.x1*w,PENDING.y1*h); c.lineTo(PENDING.mx*w,PENDING.my*h); c.stroke();
  }
  if(PENDING.kind==='area' && PENDING.pts.length){
    const p=PENDING.pts;
    c.strokeStyle=AREA_CLR; c.lineWidth=1.6; c.setLineDash([6,3]);
    c.beginPath();
    p.forEach((q,i)=> i?c.lineTo(q.x*w,q.y*h):c.moveTo(q.x*w,q.y*h));
    if(PENDING.mx!=null) c.lineTo(PENDING.mx*w, PENDING.my*h);
    c.stroke(); c.setLineDash([]);
    c.fillStyle=AREA_CLR;
    p.forEach(q=>{ c.beginPath(); c.arc(q.x*w,q.y*h,3,0,6.284); c.fill(); });
    /* the closing target — click it, or press Enter */
    c.strokeStyle='#CFFF04'; c.lineWidth=2;
    c.beginPath(); c.arc(p[0].x*w,p[0].y*h,6,0,6.284); c.stroke();
    if(p.length>=2 && STATE.calib){
      const closed=p.concat(PENDING.mx!=null?[{x:PENDING.mx,y:PENDING.my}]:[]);
      const m2=polyArea(closed);
      if(m2>0){
        c.font='600 11px Helvetica,Arial'; c.textAlign='center'; c.textBaseline='middle'; c.direction='rtl';
        const ct=polyCentroid(closed), t=m2.toFixed(2)+' מ״ר';
        const tw=c.measureText(t).width+10;
        c.fillStyle='rgba(255,255,255,.9)'; c.fillRect(ct.x*w-tw/2, ct.y*h-9, tw, 18);
        c.fillStyle=AREA_CLR; c.fillText(t, ct.x*w, ct.y*h);
      }
    }
  }
  if(PENDING.kind==='cloud' && PENDING.pts.length>1){
    c.strokeStyle=CLR.f; c.lineWidth=1.6; c.setLineDash([4,3]);
    c.beginPath();
    PENDING.pts.forEach((q,i)=> i?c.lineTo(q.x*w,q.y*h):c.moveTo(q.x*w,q.y*h));
    c.stroke();
  }
  c.restore();
  c.setLineDash([]);
}

/* px² → m², using the single calibration the user drew once */
function polyArea(pts){
  if(!STATE.calib || pts.length<3) return 0;
  const px=pts.map(p=>({x:p.x*BASE.width, y:p.y*BASE.height}));
  return Math.abs(shoelace(px))*STATE.calib.mPerPx*STATE.calib.mPerPx;
}
function polyPerimeter(pts){
  if(!STATE.calib || pts.length<2) return 0;
  let s=0;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    s+=Math.hypot((b.x-a.x)*BASE.width, (b.y-a.y)*BASE.height);
  }
  return s*STATE.calib.mPerPx;
}
function relabelMeasures(){
  STATE.dims.forEach(d=>{
    if(!d.manualLabel && STATE.calib) d.label=(dimPx(d)*STATE.calib.mPerPx).toFixed(2)+' מ׳';
  });
  STATE.areas.forEach(a=>{
    const m2=polyArea(a.pts);
    a.m2=m2||null;
    a.perim=polyPerimeter(a.pts)||null;
    a.label=m2?m2.toFixed(2)+' מ״ר':'כייל לקבלת מ״ר';
  });
}

function placeSymbols(){
  const L=$('#symLayer');
  L.style.display=LAYERS.syms?'block':'none';
  L.innerHTML='';
  STATE.symbols.forEach(s=>{
    const d=SYMMAP[s.k]; if(!d) return;
    const el=document.createElement('div');
    el.className='sym'+(SEL===s.id?' sel':'');
    el.style.left=(s.nx*100)+'%'; el.style.top=(s.ny*100)+'%'; el.style.color=d.c;
    el.innerHTML=`<div class="sbx" style="background:${d.c}">${esc(d.t)}</div>`+
                 (s.label?`<div class="stx" style="color:${d.c}">${esc(s.label)}</div>`:'')+
                 `<div class="del" title="מחק">×</div>`;
    el.querySelector('.del').onclick=e=>{
      e.stopPropagation();
      STATE.symbols=STATE.symbols.filter(x=>x.id!==s.id);
      refresh();
    };
    el.onpointerdown=e=>{
      if(e.target.classList.contains('del')) return;
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      SEL=s.id; drawOverlay();
      const box=$('#planBox').getBoundingClientRect();
      const mv=ev=>{
        s.nx=Math.min(1,Math.max(0,(ev.clientX-box.left)/box.width));
        s.ny=Math.min(1,Math.max(0,(ev.clientY-box.top)/box.height));
        el.style.left=(s.nx*100)+'%'; el.style.top=(s.ny*100)+'%';
      };
      const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); renderPanel(); };
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
    };
    L.appendChild(el);
  });
}

/* =====================================================================
   10. PLAN INTERACTION
   ===================================================================== */
function planPoint(e){
  const b=$('#planBox').getBoundingClientRect();
  return { nx:(e.clientX-b.left)/b.width, ny:(e.clientY-b.top)/b.height };
}

const TOOLBTN={dim:'tDim', area:'tArea', calib:'tCalib', pin:'tPin', cloud:'tCloud'};
const TOOLHINT={
  dim:'לחץ נקודת התחלה ואז נקודת סיום',
  area:'לחץ נקודה-נקודה על קונטור החדר · Enter או לחיצה על הנקודה הראשונה לסגירה',
  calib:'שרטט קו על מידה ידועה בתוכנית',
  pin:'לחץ על התכנית למיקום הערה ממוספרת',
  cloud:'גרור סביב האזור להקפה בענן — ואז הקלד את ההערה'
};
function clearArmed(){ Object.keys(TOOLBTN).forEach(k=>{ const b=$('#'+TOOLBTN[k]); if(b) b.classList.remove('armed'); }); }

function armTool(t){
  TOOL = TOOL===t ? null : t;
  PENDING=null;
  clearArmed();
  document.querySelectorAll('.symcard').forEach(c=>c.classList.remove('armed'));
  if(TOOL){
    if(TOOLBTN[TOOL]) $('#'+TOOLBTN[TOOL]).classList.add('armed');
    $('#toolHint').textContent=TOOLHINT[TOOL]||'לחץ על התכנית למיקום הסימבול';
    $('#planBox').style.cursor='crosshair';
    if(TOOL==='area'&&!STATE.calib) toast('לא כויל קנה מידה — השטח יחושב אחרי כיול');
  } else { $('#toolHint').textContent=''; $('#planBox').style.cursor='default'; }
  drawOverlay();
}
function armSymbol(k){
  TOOL='sym:'+k; PENDING=null;
  clearArmed();
  document.querySelectorAll('.symcard').forEach(c=>c.classList.toggle('armed', c.dataset.k===k));
  $('#toolHint').textContent='לחץ על התכנית למיקום '+(SYMMAP[k]?SYMMAP[k].n:'');
  $('#planBox').style.cursor='crosshair';
}

/* A freehand drag ends with pointerup and is normally followed by a click we
   must swallow. Time-boxing it instead of a sticky flag means a drag that ends
   off-canvas (or a pointercancel) cannot eat the user's next real click. */
let SKIPUNTIL=0;
function skipNextClick(){ SKIPUNTIL=Date.now()+300; }
$('#planBox').addEventListener('click', e=>{
  if(e.target.closest('.sym')) return;
  if(Date.now()<SKIPUNTIL){ SKIPUNTIL=0; return; }
  const p=planPoint(e);
  if(!TOOL){
    const {w,h}=fitBox(); const mx=p.nx*w, my=p.ny*h;
    const hit=MARKERS.find(m=>mx>=m.bx-5&&mx<=m.bx+m.S+5&&my>=m.by-5&&my<=m.by+m.S+5);
    if(hit){ selectNote(hit.id); return; }
    const ah=STATE.areas.find(a=>pointInPoly(p,a.pts));
    if(ah){ SEL=ah.id; setTab('sym'); drawOverlay(); return; }
    SEL=null; drawOverlay(); placeSymbols();
    return;
  }
  if(TOOL.startsWith('sym:')){
    const k=TOOL.slice(4);
    STATE.symbols.push({id:'s'+(STATE.seq++), k, nx:p.nx, ny:p.ny, label:''});
    armTool(null); refresh(); toast('סימבול נוסף — ניתן לגרור');
    return;
  }
  if(TOOL==='pin'){
    STATE.notes.push({ id:'c'+(STATE.seq++), lv:'i', src:'custom', title:'הערה', sub:'ידני',
      body:'לחץ לעריכה', edited:true, nx:p.nx, ny:p.ny });
    armTool(null); refresh(); toast('הערה נוספה');
    return;
  }
  if(TOOL==='area'){
    if(!PENDING) PENDING={kind:'area', pts:[], mx:p.nx, my:p.ny};
    const first=PENDING.pts[0];
    /* clicking back on the first vertex closes the loop */
    if(first && PENDING.pts.length>=3){
      const {w,h}=fitBox();
      if(Math.hypot((p.nx-first.x)*w,(p.ny-first.y)*h)<10){ finishArea(); return; }
    }
    PENDING.pts.push({x:p.nx,y:p.ny}); drawOverlay();
    return;
  }
  if(TOOL==='dim'||TOOL==='calib'){
    if(!PENDING){ PENDING={kind:'dim', x1:p.nx,y1:p.ny,mx:p.nx,my:p.ny}; drawOverlay(); return; }
    const d={ id:'d'+(STATE.seq++), x1:PENDING.x1, y1:PENDING.y1, x2:p.nx, y2:p.ny, calib:TOOL==='calib' };
    const px=dimPx(d);
    if(TOOL==='calib'){
      const v=prompt('אורך הקו במטרים:','');
      const m=parseFloat(String(v).replace(',','.'));
      if(!m||m<=0){ PENDING=null; armTool(null); drawOverlay(); return; }
      STATE.calib={ mPerPx:m/px };
      d.label=m.toFixed(2)+' מ׳';
      STATE.dims.push(d); PENDING=null; armTool(null);
      relabelMeasures(); refresh();
      toast('קנה מידה כויל — כל המידות והשטחים חושבו מחדש');
      return;
    }
    if(STATE.calib){
      d.label=(px*STATE.calib.mPerPx).toFixed(2)+' מ׳';
    } else {
      const v=prompt('אורך במטרים (או בטל וכייל תחילה):','');
      const m=parseFloat(String(v).replace(',','.'));
      if(m>0){ d.label=m.toFixed(2)+' מ׳'; d.manualLabel=true; } else d.label='?';
    }
    STATE.dims.push(d); PENDING=null; armTool(null); refresh();
  }
});
$('#planBox').addEventListener('dblclick', e=>{
  if(TOOL==='area'&&PENDING&&PENDING.pts.length>=3){ e.preventDefault(); skipNextClick(); finishArea(); }
});
$('#planBox').addEventListener('mousemove', e=>{
  if(PENDING&&PENDING.kind!=='cloud'){ const p=planPoint(e); PENDING.mx=p.nx; PENDING.my=p.ny; drawOverlay(); }
});

function finishArea(){
  if(!PENDING||PENDING.pts.length<3){ PENDING=null; armTool(null); drawOverlay(); return; }
  const pts=PENDING.pts.slice();
  const name=(prompt('שם החדר (אופציונלי):','')||'').trim();
  const a={ id:'a'+(STATE.seq++), pts, name };
  STATE.areas.push(a);
  PENDING=null; armTool(null);
  relabelMeasures(); refresh();
  toast(a.m2 ? 'שטח נמדד: '+a.m2.toFixed(2)+' מ״ר' : 'קונטור נשמר — כייל קנה מידה לקבלת מ״ר');
}
function pointInPoly(p, pts){
  if(!pts||pts.length<3) return false;
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const a=pts[i], b=pts[j];
    if((a.y>p.ny)!==(b.y>p.ny) && p.nx < (b.x-a.x)*(p.ny-a.y)/(b.y-a.y)+a.x) inside=!inside;
  }
  return inside;
}

/* ---- revision cloud: freehand drag, sampled so the arc walk stays even ---- */
$('#planBox').addEventListener('pointerdown', e=>{
  if(TOOL!=='cloud'||e.button!==0) return;
  e.preventDefault();
  const box=$('#planBox');
  box.setPointerCapture(e.pointerId);
  const p=planPoint(e);
  PENDING={kind:'cloud', pts:[{x:p.nx,y:p.ny}]};
  const mv=ev=>{
    const q=planPoint(ev), last=PENDING.pts[PENDING.pts.length-1];
    const {w,h}=fitBox();
    if(Math.hypot((q.nx-last.x)*w,(q.ny-last.y)*h)<8) return;
    PENDING.pts.push({x:q.nx,y:q.ny}); drawOverlay();
  };
  const up=()=>{
    box.removeEventListener('pointermove',mv); box.removeEventListener('pointerup',up);
    box.removeEventListener('pointercancel',up);
    skipNextClick();
    finishCloud();
  };
  box.addEventListener('pointermove',mv);
  box.addEventListener('pointerup',up);
  box.addEventListener('pointercancel',up);
});

function finishCloud(){
  const pts=(PENDING&&PENDING.pts)||[];
  PENDING=null;
  if(pts.length<3){ armTool(null); drawOverlay(); toast('הקפה קצרה מדי — גרור סביב האזור'); return; }
  const body=(prompt('ההערה שתופיע בענן:','')||'').trim();
  if(!body){ armTool(null); drawOverlay(); return; }
  STATE.notes.push({
    id:'cl'+(STATE.seq++), lv:'f', src:'cloud', shape:'cloud',
    title:body.length>34?body.slice(0,34)+'…':body, sub:'ענן על התכנית',
    body, edited:true, pts, nx:null, ny:null
  });
  armTool(null); refresh(); toast('ענן הערה נוסף');
}
$('#planBox').addEventListener('dragover', e=>e.preventDefault());
$('#planBox').addEventListener('drop', e=>{
  e.preventDefault();
  const k=e.dataTransfer.getData('sym'); if(!k) return;
  const p=planPoint(e);
  STATE.symbols.push({id:'s'+(STATE.seq++), k, nx:p.nx, ny:p.ny, label:''});
  refresh();
});
function dimPx(d){
  const dx=(d.x2-d.x1)*BASE.width, dy=(d.y2-d.y1)*BASE.height;
  return Math.hypot(dx,dy);
}
document.addEventListener('keydown', e=>{
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if(e.key==='Escape'){ armTool(null); PENDING=null; drawOverlay(); closeExportMenu(); }
  if(e.key==='Enter' && TOOL==='area' && PENDING && PENDING.pts.length>=3 && !typing){
    e.preventDefault(); finishArea();
  }
  if((e.key==='Delete'||e.key==='Backspace') && SEL && !typing){
    STATE.symbols=STATE.symbols.filter(s=>s.id!==SEL);
    STATE.areas=STATE.areas.filter(a=>a.id!==SEL);
    STATE.notes=STATE.notes.filter(n=>!(n.id===SEL&&(n.src==='custom'||n.src==='cloud')));
    SEL=null; refresh();
  }
});

function renderPanel(){
  const f=STATE.notes.filter(n=>n.lv==='f').length;
  const w=STATE.notes.filter(n=>n.lv==='w').length;
  const ironOk=STATE.ironR.filter(r=>r.level==='o').length;

  $('#tiles').innerHTML=`
    <div class="tile"><div class="n" style="color:${f?'var(--fail)':'inherit'}">${f}</div><div class="l">שגוי</div></div>

    <div class="tile"><div class="n" style="color:${ironOk===4?'var(--ok)':'var(--fail)'}">${ironOk}/4</div><div class="l">כללי ברזל</div></div>

    <div class="tile"><div class="n">${seats||'—'}</div><div class="l">מקומות</div></div>

    <div class="tile"><div class="n">${STATE.symbols.length}</div><div class="l">סימבולים</div></div>`;

  $('#tabs').innerHTML=TABS.map(t=>{
    let b='';
    if(t.k==='notes'&&(f||w)) b=`<span class="bdg ${f?'f':'w'}">${f+w}</span>`;
    if(t.k==='iron'&&ironOk<4) b=`<span class="bdg f">${4-ironOk}</span>`;
    return `<button class="tab ${TAB===t.k?'on':''}" onclick="setTab('${t.k}')">${t.n}${b}</button>`;

function bindNotes(){
  $('#tabBody').querySelectorAll('.cb').forEach(el=>{
    el.onblur=()=>{
      const n=STATE.notes.find(x=>x.id===el.dataset.id);
      if(n){ n.body=el.textContent.trim(); n.edited=true; }
    };
  });
  $('#tabBody').querySelectorAll('.xb[data-act]').forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      const n=STATE.notes.find(x=>x.id===b.dataset.id); if(!n) return;
      const a=b.dataset.act;
      if(a==='goto'){ SEL=n.id; drawOverlay(); }
      if(a==='place'){ SEL=n.id; TOOL='place:'+n.id; $('#toolHint').textContent='לחץ על התכנית למיקום ההערה'; $('#planBox').style.cursor='crosshair'; }
      if(a==='lv'){ const o=['f','w','i','o']; n.lv=o[(o.indexOf(n.lv)+1)%4]; buildOrder(); refresh(); }
      if(a==='del'){ STATE.notes=STATE.notes.filter(x=>x.id!==n.id); refresh(); }
    };
  });
  $('#tabBody').querySelectorAll('.card').forEach(c=>{
    c.onclick=e=>{ if(e.target.closest('.xb')||e.target.classList.contains('cb')) return; SEL=c.dataset.id; renderPanel(); drawOverlay(); };

}

/* image / flat-PDF workspace — no text layer, every marking is manual */
async function runManual(canvas, name){
  STATE.mode='manual';
  BASE=canvas;
  STATE.parse={ tags:[], allText:[], fileName:name };
  STATE.fileName=name;
  STATE.rooms=[]; STATE.floor=[];
  STATE.notes=STATE.notes.filter(n=>n.src==='custom');
  buildOrder();
  STATE.ironR=ironChecks(STATE.parse, []);
  STATE.openItems=openItems([]);
  stampHeader();
  $('#hbtns').style.display='flex';
  $('#uploadView').style.display='none';
  $('#workView').classList.add('on');
  layout(); renderPanel();
}

async function run(parse){
  STATE.mode='auto';
  STATE.parse=parse; STATE.fileName=parse.fileName;
  PDFPAGE=parse.page; VP1=parse.vp1;
  STATE.rooms=parse.tags.map((tag,i)=>({tag, i:i+1, check:checkRoom(tag)}));
  const fc=floorChecks(parse, STATE.rooms);
  STATE.floor=fc;
  buildNotes(STATE.rooms, fc);
  STATE.ironR=ironChecks(parse, STATE.rooms);
  STATE.openItems=openItems(STATE.rooms);

  stampHeader();
  $('#hbtns').style.display='flex';
  $('#uploadView').style.display='none';
  $('#workView').classList.add('on');

  await renderBase(parse.page);
  layout(); renderPanel();
}

/* =====================================================================
   14a. XLSX WRITER — store-only ZIP + SpreadsheetML, no dependencies.
   An HTML table renamed .xls trips Excel's format warning, so this
   builds the real thing: one part per sheet, RTL, styled.
   ===================================================================== */
const CRC_T=(()=>{
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(u8){
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[];
  let offset=0;
  files.forEach(f=>{
    const nb=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array(30+nb.length), v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0x0800,true);
    v.setUint16(8,0,true); v.setUint16(10,0,true); v.setUint16(12,0x2921,true);
    v.setUint32(14,crc,true); v.setUint32(18,data.length,true); v.setUint32(22,data.length,true);
    v.setUint16(26,nb.length,true); v.setUint16(28,0,true);
    lh.set(nb,30);
    parts.push(lh, data);

    const ch=new Uint8Array(46+nb.length), w=new DataView(ch.buffer);
    w.setUint32(0,0x02014b50,true); w.setUint16(4,20,true); w.setUint16(6,20,true);
    w.setUint16(8,0x0800,true); w.setUint16(10,0,true); w.setUint16(12,0,true);
    w.setUint16(14,0x2921,true); w.setUint32(16,crc,true);
    w.setUint32(20,data.length,true); w.setUint32(24,data.length,true);
    w.setUint16(28,nb.length,true); w.setUint16(30,0,true); w.setUint16(32,0,true);
    w.setUint16(34,0,true); w.setUint16(36,0,true); w.setUint32(38,0,true);
    w.setUint32(42,offset,true);
    ch.set(nb,46);
    central.push(ch);
    offset+=lh.length+data.length;
  });
  const cdSize=central.reduce((s,c)=>s+c.length,0);
  const eocd=new Uint8Array(22), e=new DataView(eocd.buffer);
  e.setUint32(0,0x06054b50,true); e.setUint16(4,0,true); e.setUint16(6,0,true);
  e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true); e.setUint32(16,offset,true); e.setUint16(20,0,true);
  return new Blob(parts.concat(central,[eocd]), {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const XS={ BODY:0, HEAD:1, TITLE:2, BOLD:3, FAIL:4, WARN:5, OK:6, NUM:7 };
const LVSTYLE={f:XS.FAIL, w:XS.WARN, o:XS.OK, i:XS.BODY, n:XS.BODY};
function xlEsc(s){
  return String(s==null?'':s)
    .replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
function colName(i){
  let s=''; i++;
  while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); }
  return s;
}
function sheetXml(sh){
  const cols=(sh.cols&&sh.cols.length)
    ? '<cols>'+sh.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>'
    : '';
  const rows=sh.rows.map((r,ri)=>{
    const cells=r.map((c,ci)=>{
      if(c==null||c==='') return '';
      const o=(typeof c==='object')?c:{v:c};
      if(o.v==null||o.v==='') return '';
      const ref=colName(ci)+(ri+1);
      if(typeof o.v==='number' && isFinite(o.v)){
        const s=(o.s!=null)?o.s:(Number.isInteger(o.v)?XS.BODY:XS.NUM);
        return `<c r="${ref}" s="${s}"><v>${o.v}</v></c>`;
      }
      return `<c r="${ref}" s="${o.s!=null?o.s:XS.BODY}" t="inlineStr"><is><t xml:space="preserve">${xlEsc(o.v)}</t></is></c>`;
    }).join('');
    return cells?`<row r="${ri+1}">${cells}</row>`:'';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/>'+cols+
    '<sheetData>'+rows+'</sheetData></worksheet>';
}

function buildXlsx(sheets){
  const enc=new TextEncoder(), U=s=>enc.encode(s);
  const n=sheets.length;
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+

    sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+
    `<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`+

  const files=[

function routeFile(f){
  const n=f.name.toLowerCase();
  if(/\.pdf$/.test(n))            return handlePdf(f);
  if(/\.(png|jpe?g|webp)$/.test(n)) return handleImage(f);
  if(/\.json$/.test(n))           return readJson(f);
  if(/\.(dwg|dxf)$/.test(n))      return needsExport(f,'DWG','AutoCAD','Plot → DWG To PDF');
  if(/\.(rvt|rfa)$/.test(n))      return rvtPending(f);
  showError('<b>סוג קובץ לא נתמך</b>' + esc(f.name) + ' — נתמכים: PDF, PNG, JPG, JSON.');
}

/* RVT is a closed binary format — a browser alone cannot open it. The plan is
   a server-side converter; until that exists, say so and give the PDF route. */
function rvtPending(f){
  showError(
    `<b>חיבור RVT — בהכנה.</b>`+
    `הקובץ <u>${esc(f.name)}</u> זוהה, אך פענוח Revit דורש שירות המרה בצד שרת — דפדפן לבדו לא קורא את הפורמט. `+
    `נחבר את המסלול הזה בשלב הבא.<br>`+
    `בינתיים: Revit → File → Export → PDF, והעלה את ה-PDF כאן. שכבת הטקסט של תגיות החדרים נשמרת בייצוא, והניתוח יהיה מלא ואוטומטי.`
  );
}

/* DWG is likewise a proprietary binary format.
   Say so plainly and give the 10-second workaround instead of failing silently. */
function needsExport(f, fmt, app, path){
  showError(
    `<b>${fmt} הוא פורמט בינארי סגור — לא ניתן לפענוח בדפדפן.</b>`+
    `ייצא PDF מתוך ${app} (<u>${esc(path)}</u>) והעלה אותו כאן. `+
    `שכבת הטקסט של תגיות החדרים נשמרת בייצוא — והניתוח יהיה מלא ואוטומטי.<br>`+
    `לחלופין, העלה תמונה (PNG/JPG) של התכנית ועבוד במצב סימון ידני עם כל הכלים.`
  );
}

function readJson(f){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      applyProgram(j);
      if(j.review && BASE) restoreReview(j.review);
    }catch(err){ showError('<b>JSON לא תקין</b>'+esc(err.message)); }
  };
  r.readAsText(f);
}
function restoreReview(rv){
  if(rv.symbols) STATE.symbols=rv.symbols;
  if(rv.dims)    STATE.dims=rv.dims;
  if(rv.areas)   STATE.areas=rv.areas;
  if(rv.manual)  STATE.manual=rv.manual;
  if(rv.iron)    STATE.iron=rv.iron;
  if(rv.calib)   STATE.calib=rv.calib;
  /* hand-made markup only — the rule-derived notes are rebuilt from the plan */
  (rv.notes||[]).filter(n=>n.src==='custom'||n.src==='cloud').forEach(n=>{
    if(!STATE.notes.some(x=>x.id===n.id)) STATE.notes.push(Object.assign({edited:true}, n));
  });
  STATE.seq=Math.max(STATE.seq, STATE.symbols.length+STATE.dims.length+STATE.areas.length+STATE.notes.length+1);
  refresh(); toast('סימונים שוחזרו');
}

async function handlePdf(file){
  if(!PDFJS_OK){ showError(PDFJS_MSG); return; }
  showLoading(true);
  try{
    const parse=await parsePdf(new Uint8Array(await file.arrayBuffer()), file.name);
    if(!parse.tags.length){
      /* flat / scanned PDF — still usable as a manual markup workspace */
      await renderBase(parse.page);
      await runManual(BASE, file.name);
      toast('לא זוהתה שכבת טקסט — מצב סימון ידני');
    } else await run(parse);
  }catch(err){ showError('<b>שגיאה בניתוח</b>'+esc(err.message)); }
  showLoading(false);
}

async function handleImage(file){
  showLoading(true);
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{
      const i=new Image();
      i.onload=()=>res(i); i.onerror=()=>rej(new Error('לא ניתן לקרוא את התמונה'));
      i.src=url;
    });
    const sc=Math.min(1, 2400/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    const x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    x.imageSmoothingQuality='high'; x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    await runManual(c, file.name);
    toast('תמונה נטענה — מצב סימון ידני');
  }catch(e){ showError('<b>שגיאה</b>'+esc(e.message)); }
  showLoading(false);
}

function showLoading(on){ $('#loading').classList.toggle('on',on); if(on) showError(null); }
function showError(m){ const e=$('#loadError'); e.style.display=m?'block':'none'; e.innerHTML=m||''; }

  '<b>מנוע קריאת ה-PDF לא נטען.</b>'+

   15. EXPORT — same tool, different interface. Live editable, offline.
   ===================================================================== */
const VARHEX={'--s-el':'#7C3AED','--s-it':'#0EA5E9','--s-mep':'#0891B2','--s-move':'#16A34A',
  '--s-fire':'#E1504B','--s-prog':'#D6009A','--black':'#1B1B1B'};
function hex(c){ const m=/var\((--[a-z-]+)\)/.exec(c); return m?(VARHEX[m[1]]||'#8A8A8A'):c; }

function progRows(){
  const P=STATE.program;
  const rows=(P&&P.program&&P.program.length)?P.program:PROGRAM_REF;
  return rows.map(p=>{
    const types=p.types||[p.key];
    const m=STATE.rooms.filter(r=>types.includes(r.check.type));
    let cls,found,delta;
    if(!m.length){
      cls=(p.required||p.count)?'f':'n'; found='לא נמצא'; delta=p.count?('−'+p.count):'—';
    } else {
      cls=m.some(r=>r.check.level==='fail')?'f':m.some(r=>r.check.level==='warn')?'w':'o';
      const a=m.map(r=>r.tag.area).filter(x=>x!=null);
      const bits=[m.length+' יח׳'];
      if(a.length) bits.push(Math.min(...a)===Math.max(...a)?a[0]+' מ״ר':Math.min(...a)+'–'+Math.max(...a)+' מ״ר');
      found=bits.join(' · ');
      if(p.count){
        const d=m.length-p.count;
        delta=(d>=0?'+':'−')+Math.abs(d);
        /* a shortfall against the project target outranks per-room status */
        if(d<0){
          const short=-d/p.count;
          const lack=(p.required||short>=0.34)?'f':'w';
          if(lack==='f'||cls==='o') cls=lack;
        }
      } else delta='✓';
    }
    const goal=p.norm||[p.count?p.count+' יח׳':null,p.minArea?'≥'+p.minArea+' מ״ר':null].filter(Boolean).join(' · ')||'—';
    return { fn:p.fn||p.label||p.key, goal, found, delta, cls };
  });
}

/* =====================================================================
   15a. FLATTENED PLAN — base render + every markup layer on one canvas.
   Shared by the PDF report and anything else that needs a still image.
   ===================================================================== */
function paintSymbolsOn(c,w,h){
  const k=Math.max(0.7, w/900), S=24*k;
  STATE.symbols.forEach(s=>{
    const d=SYMMAP[s.k]; if(!d) return;
    const col=hex(d.c), x=s.nx*w, y=s.ny*h;
    c.fillStyle='#fff'; c.fillRect(x-S/2-1.5*k, y-S/2-1.5*k, S+3*k, S+3*k);
    c.fillStyle=col;    c.fillRect(x-S/2, y-S/2, S, S);
    c.fillStyle='#fff'; c.font='700 '+(S*0.36).toFixed(1)+'px Helvetica,Arial';
    c.textAlign='center'; c.textBaseline='middle'; c.direction='ltr';
    c.fillText(d.t, x, y+0.5*k);
    if(s.label){
      c.font='500 '+(9*k).toFixed(1)+'px Helvetica,Arial';
      c.direction='rtl'; c.textAlign='right';
      const tw=c.measureText(s.label).width+6*k;
      c.fillStyle='#fff'; c.fillRect(x-S/2-tw-2*k, y-7*k, tw, 14*k);
      c.strokeStyle=col; c.lineWidth=1*k; c.strokeRect(x-S/2-tw-2*k, y-7*k, tw, 14*k);
      c.fillStyle=col; c.fillText(s.label, x-S/2-5*k, y);
    }
  });
}
function renderComposite(maxW){
  const W=Math.min(maxW||2000, BASE.width);
  const H=Math.round(BASE.height*W/BASE.width);
  const c=document.createElement('canvas');
  c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
  x.drawImage(BASE,0,0,W,H);
  paintMarkup(x,W,H,{layers:{notes:true,syms:true,dims:true,areas:true}, sel:null});
  paintSymbolsOn(x,W,H);
  return c;
}
