        <th style="width:70mm">חדר / אזור</th><th style="width:30mm">שטח מדוד</th>
        <th style="width:30mm">היקף</th><th>נקודות קונטור</th>
      </tr></thead><tbody>`+
      STATE.areas.map(a=>`<tr><td class="b">${esc(a.name||'חדר ללא שם')}</td>
        <td>${a.m2?a.m2.toFixed(2)+' מ״ר':'לא מכויל'}</td>
        <td>${a.perim?a.perim.toFixed(2)+' מ׳':'—'}</td>
        <td>${(a.pts||[]).length}</td></tr>`).join('')+
      (tot?`<tr class="o"><td class="b">סה״כ שטח מדוד</td><td class="b">${tot.toFixed(2)} מ״ר</td><td></td><td></td></tr>`:'')+
      '</tbody></table>';
  }
  if(STATE.dims.length){
    h+=`<table class="rt"><thead><tr>
        <th style="width:70mm">קו מידה</th><th style="width:40mm">אורך</th><th>מקור</th>
      </tr></thead><tbody>`+
      STATE.dims.map((d,i)=>`<tr><td class="b">קו ${i+1}${d.calib?' — קו הכיול':''}</td>
        <td>${esc(d.label||'—')}</td>
        <td>${d.calib?'הוזן ידנית — בסיס הכיול':(d.manualLabel?'הוזן ידנית':'חושב מקנה המידה')}</td></tr>`).join('')+
      '</tbody></table>';
  }
  return h||'<div class="rempty">לא בוצעו מדידות.</div>';
}

function buildReport(){
  const m=metaGet();
  const img=renderComposite(2000).toDataURL('image/png');
  const sheets=[];
  sheets.push({cover:true, html:coverSheet()});
  sheets.push({title:floorTitle(), kicker:'תכנית מסומנת', cls:'plan', html:planSheet(img)});

  const notes=STATE.notes.slice();
  if(notes.length) chunk(notes,11).forEach((c,i,all)=>sheets.push({
    title:'הערות הבדיקה', kicker:all.length>1?`${i+1} מתוך ${all.length}`:`${notes.length} הערות`,
    html:notesTable(c) }));
  else sheets.push({title:'הערות הבדיקה', kicker:'נקי', html:'<div class="rempty">אין הערות — התוכנית עברה את כל הבדיקות שבוצעו.</div>'});

  const prog=progRows();
  chunk(prog,16).forEach((c,i,all)=>sheets.push({
    title:(STATE.program&&STATE.program.program&&STATE.program.program.length)?'פרוגרמת הפרויקט':'סטנדרט המשרד',
    kicker:all.length>1?`${i+1} מתוך ${all.length}`:'השוואה מול היעד', html:progTable(c) }));

  if(STATE.areas.length||STATE.dims.length)
    sheets.push({title:'מדידות מהתכנית', kicker:'שטחים וקווי מידה', html:measureTable()});

  const iron=(STATE.ironR||[]);
  if(iron.length) sheets.push({ title:'כללי ברזל', kicker:'נקודת פתיחה לכל בדיקה', html:
    `<table class="rt"><thead><tr><th style="width:60mm">כלל</th><th style="width:24mm">סטטוס</th>
      <th style="width:30mm">מקור</th><th>פירוט</th></tr></thead><tbody>`+
    iron.map(r=>`<tr class="${r.level==='o'?'o':'f'}"><td class="b">${esc(r.n)}</td>
      <td><span class="rchip" style="background:${r.level==='o'?'#16A34A':'#E1504B'}">${r.level==='o'?'תקין':'חסר'}</span></td>
      <td>${esc(r.src)}</td><td>${esc(r.msg)}</td></tr>`).join('')+'</tbody></table>' });

  const open=MANUAL_CHECKS.concat((STATE.openItems||[]).map(i=>({id:i.id,n:i.n,note:i.scope})));
  chunk(open,14).forEach((c,i,all)=>sheets.push({
    title:'מה שהתכנית לא מגלה', kicker:all.length>1?`${i+1} מתוך ${all.length}`:'פריטים לאימות',
    html:openTable(c) }));

  const total=sheets.length;
  const projLine=esc([m.project, m.floor, m.client].filter(Boolean).join(' · '));
  const disc='הופק ע״י RDA Test Fit Checker מתוך תגיות התוכנית ובדיקה ידנית. '+
             'אינו מחליף בדיקת נגישות, בטיחות, מילוט או אישור יועצים.';
  $('#report').innerHTML = sheets.map((s,i)=>`
    <section class="sheet">
      <div class="sh-head">
        <div class="sh-brand">RD&amp;A<span>Test Fit Checker</span></div>
        <div class="sh-proj">${projLine}<br>${esc(m.date)}</div>
      </div>
      ${s.cover ? s.html : `
        <div class="sh-title">${esc(s.title)}${s.kicker?`<small>${esc(s.kicker)}</small>`:''}</div>
        <div class="sh-body ${s.cls||''}">${s.html}</div>`}
      <div class="sh-foot"><span>${disc}</span><span><b>עמוד ${i+1} / ${total}</b></span></div>
    </section>`).join('');
  return total;
}

async function exportPdf(){
  closeExportMenu();
  if(!BASE){ toast('אין תוכנית טעונה'); return; }
  toast('בונה דוח…');
  /* let the toast paint before the composite render blocks the thread */
  await new Promise(r=>setTimeout(r,40));
  const n=buildReport();
  document.body.classList.add('printing');

  /* the plan sheet holds a ~1MB data-URI PNG; printing before it decodes
     yields a blank or mis-scaled page, so wait for it explicitly */
  const img=$('#report .planwrap img');
  if(img && !img.complete){
    await new Promise(res=>{ img.onload=res; img.onerror=res; setTimeout(res,6000); });
  }
  if(img && img.decode){
    try{ await Promise.race([img.decode(), new Promise(r=>setTimeout(r,4000))]); }catch(e){}
  }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

  const done=()=>{
    document.body.classList.remove('printing');
    $('#report').innerHTML='';
    window.removeEventListener('afterprint',done);
    layout();
  };
  window.addEventListener('afterprint',done);
  toast(n+' עמודים — בחר "שמור כ-PDF" בתיבת ההדפסה');
  window.print();
}

<script type="text/plain" id="exportJS">
var S = JSON.parse(document.getElementById('stateJSON').textContent);
var SD = S.symdefs, ZOOM = 1, SEL = null, TAB = 'notes', TOOL = null;
var LAY = { notes:true, syms:true, dims:true, areas:true };
var CLR = { f:'#E1504B', w:'#E38B00', i:'#0000FF', o:'#16A34A' };
var AREA_CLR = '#0000FF';
function lvc(lv){ return CLR[lv]||'#8A8A8A'; }
function shoe(p){ var s=0,i; for(i=0;i<p.length;i++){ var a=p[i],b=p[(i+1)%p.length]; s+=a.x*b.y-b.x*a.y; } return s/2; }
function bnds(p){ var r={x0:1,y0:1,x1:0,y1:0}; p.forEach(function(q){
  if(q.x<r.x0)r.x0=q.x; if(q.y<r.y0)r.y0=q.y; if(q.x>r.x1)r.x1=q.x; if(q.y>r.y1)r.y1=q.y; }); return r; }
function cent(p){
  var A=shoe(p); if(Math.abs(A)<1e-9){ var b=bnds(p); return {x:(b.x0+b.x1)/2,y:(b.y0+b.y1)/2}; }
  var cx=0,cy=0,i;
  for(i=0;i<p.length;i++){ var a=p[i],b2=p[(i+1)%p.length],f=a.x*b2.y-b2.x*a.y; cx+=(a.x+b2.x)*f; cy+=(a.y+b2.y)*f; }
  return {x:cx/(6*A), y:cy/(6*A)};
}
function wrapL(c,t,mw,ml){
  var out=[], line='';
  String(t||'').split(/\s+/).filter(Boolean).forEach(function(w){
    var s=line?line+' '+w:w;
    if(c.measureText(s).width>mw&&line){ out.push(line); line=w; } else line=s;
  });
  if(line) out.push(line);
  if(out.length>ml){ var cut=out.slice(0,ml); cut[ml-1]+='…'; return cut; }
  return out;
}
var Q = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ var t=Q('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(function(){t.classList.remove('on');},2000); }

var IMG = Q('#planImg');
function fit(){
  var h=Q('#host'), aw=Math.max(60,h.clientWidth-24), ah=Math.max(60,h.clientHeight-24);
  var ar=S.imgW/S.imgH, w=aw, hh=w/ar;
  if(hh>ah){ hh=ah; w=hh*ar; }
  return { w:w*ZOOM, h:hh*ZOOM };
}
function layout(){
  var f=fit(), box=Q('#box'), ov=Q('#ov');
  box.style.width=f.w+'px'; box.style.height=f.h+'px';
  var dpr=Math.min(2, window.devicePixelRatio||1);
  ov.width=Math.round(f.w*dpr); ov.height=Math.round(f.h*dpr);
  ov.style.width=f.w+'px'; ov.style.height=f.h+'px';
  Q('#zl').textContent=Math.round(ZOOM*100)+'%';
  draw(); syms();
}
function badge(c,k,n,bx,by,Sz,col){
  c.fillStyle='#fff'; c.fillRect(bx-1.5*k,by-1.5*k,Sz+3*k,Sz+3*k);
  c.fillStyle=col; c.fillRect(bx,by,Sz,Sz);
  c.fillStyle='#fff'; c.font='700 '+(Sz*0.52).toFixed(1)+'px Helvetica,Arial';
  c.textAlign='center'; c.textBaseline='middle'; c.direction='ltr';
  c.fillText(n.num, bx+Sz/2, by+Sz/2+0.5*k);
  if(SEL===n.id){ c.strokeStyle='#CFFF04'; c.lineWidth=2.5*k; c.strokeRect(bx-3*k,by-3*k,Sz+6*k,Sz+6*k); }
}
function cloud(c,f,k,n){
  var pn=n.pts||[]; if(pn.length<2) return null;
  var col=lvc(n.lv), r=Math.max(4,7*k), out=shoe(pn)<0;
  var pts=pn.map(function(p){ return {x:p.x*f.w, y:p.y*f.h}; });
  var path=[], carry=0, i;
  for(i=0;i<pts.length;i++){
    var a=pts[i], b=pts[(i+1)%pts.length];
    var seg=Math.hypot(b.x-a.x,b.y-a.y);
    if(seg<0.01) continue;
    var d=carry;
    while(d<seg){ path.push({x:a.x+(b.x-a.x)*d/seg, y:a.y+(b.y-a.y)*d/seg}); d+=2*r; }
    carry=d-seg;
  }
  if(path.length<2) return null;
  c.save();
  c.strokeStyle=col; c.lineWidth=Math.max(1.3,1.9*k); c.lineJoin='round';
  c.beginPath();
  for(i=0;i<path.length;i++){
    var p1=path[i], p2=path[(i+1)%path.length];
    var rad=Math.hypot(p2.x-p1.x,p2.y-p1.y)/2;
    if(rad<0.4) continue;
    var ang=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    c.arc((p1.x+p2.x)/2,(p1.y+p2.y)/2,rad,ang+Math.PI,ang,out);
  }
  c.stroke(); c.restore();
  var bb=bnds(pn), Sz=20*k;
  var bx=Math.max(2*k, bb.x0*f.w-Sz*0.25), by=Math.max(2*k, bb.y0*f.h-Sz*1.2);
  badge(c,k,n,bx,by,Sz,col);
  if(n.body){
    c.save();
    c.font='500 '+(11*k).toFixed(1)+'px Helvetica,Arial';
    c.direction='rtl'; c.textAlign='right'; c.textBaseline='top';
    var lines=wrapL(c,n.body,Math.max(150*k,(bb.x1-bb.x0)*f.w),3);
    var lh=14*k, pad=5*k;
    var tw=Math.max.apply(null,lines.map(function(l){return c.measureText(l).width;}))+pad*2;
    var th=lines.length*lh+pad*2;
    var tx=Math.min(f.w-2*k, bb.x1*f.w), ty=bb.y1*f.h+5*k;
    if(ty+th>f.h) ty=Math.max(2*k, bb.y0*f.h-th-5*k);
    if(tx-tw<0) tx=tw+2*k;
    c.fillStyle='rgba(255,255,255,.94)'; c.fillRect(tx-tw,ty,tw,th);
    c.strokeStyle=col; c.lineWidth=Math.max(1,1.2*k); c.strokeRect(tx-tw,ty,tw,th);
    c.fillStyle=col;
    lines.forEach(function(l,j){ c.fillText(l, tx-pad, ty+pad+j*lh); });
    c.restore();
  }
  return {id:n.id,bx:bx,by:by,S:Sz};
}
function draw(){
  var f=fit(), ov=Q('#ov'), c=ov.getContext('2d');
  var dpr=Math.min(2, window.devicePixelRatio||1);
  var k=Math.max(0.7, f.w/900);
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,f.w,f.h);
  MK=[];
  if(LAY.areas) (S.areas||[]).forEach(function(a){
    var pts=(a.pts||[]).map(function(p){ return {x:p.x*f.w, y:p.y*f.h}; });
    if(pts.length<3) return;
    c.save();
    c.beginPath();
    pts.forEach(function(p,i){ i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y); });
    c.closePath();
    c.fillStyle='rgba(0,0,255,.07)'; c.fill();
    c.strokeStyle=AREA_CLR; c.lineWidth=Math.max(1.2,1.6*k);
    c.setLineDash([6*k,3*k]); c.stroke(); c.setLineDash([]);
    c.fillStyle=AREA_CLR;
    pts.forEach(function(p){ c.beginPath(); c.arc(p.x,p.y,2.4*k,0,6.284); c.fill(); });
    var ct=cent(a.pts), lines=[a.label||'—'];
    if(a.name) lines.unshift(a.name);
    c.font='600 '+(11.5*k).toFixed(1)+'px Helvetica,Arial';
    c.textAlign='center'; c.textBaseline='middle'; c.direction='rtl';
    var tw=Math.max.apply(null,lines.map(function(l){return c.measureText(l).width;}))+11*k;
    var lh=14*k, th=lines.length*lh+6*k, cx=ct.x*f.w, cy=ct.y*f.h;
    c.fillStyle='rgba(255,255,255,.94)'; c.fillRect(cx-tw/2,cy-th/2,tw,th);
    c.strokeStyle=AREA_CLR; c.lineWidth=Math.max(1,1.2*k); c.strokeRect(cx-tw/2,cy-th/2,tw,th);
    c.fillStyle=AREA_CLR;
    lines.forEach(function(l,i){ c.fillText(l, cx, cy-th/2+3*k+lh/2+i*lh); });
    c.restore();
  });
  if(LAY.dims) (S.dims||[]).forEach(function(d){
    var x1=d.x1*f.w, y1=d.y1*f.h, x2=d.x2*f.w, y2=d.y2*f.h;
    var col=d.calib?'#0000FF':'#D6009A';
    c.strokeStyle=col; c.lineWidth=1.6*k;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    var a=Math.atan2(y2-y1,x2-x1), t=7*k;
    [[x1,y1],[x2,y2]].forEach(function(p){
      c.beginPath();
      c.moveTo(p[0]-Math.sin(a)*t, p[1]+Math.cos(a)*t);
      c.lineTo(p[0]+Math.sin(a)*t, p[1]-Math.cos(a)*t); c.stroke();
    });
    var lb=d.label||'—', mx=(x1+x2)/2, my=(y1+y2)/2;
    c.font='600 '+(11*k).toFixed(1)+'px Helvetica,Arial';
    c.textAlign='center'; c.textBaseline='middle'; c.direction='rtl';
    var tw=c.measureText(lb).width+9*k, th=16*k;
    c.fillStyle='#fff'; c.fillRect(mx-tw/2,my-th/2,tw,th);
    c.strokeStyle=col; c.lineWidth=1.2*k; c.strokeRect(mx-tw/2,my-th/2,tw,th);
    c.fillStyle=col; c.fillText(lb,mx,my+0.5*k);
  });
  if(LAY.notes){
    S.notes.forEach(function(n){
      if(n.shape!=='cloud') return;
      var m=cloud(c,f,k,n); if(m) MK.push(m);
    });
    S.notes.forEach(function(n){
      if(n.shape==='cloud'||n.nx==null) return;
      var x=n.nx*f.w, y=n.ny*f.h, Sz=20*k;
      var col=lvc(n.lv), bx=x+Sz*0.85, by=y-Sz*1.85;
      c.strokeStyle=col; c.lineWidth=1.6*k;
      c.beginPath(); c.moveTo(x,y); c.lineTo(bx,by+Sz); c.stroke();
      badge(c,k,n,bx,by,Sz,col);
      c.fillStyle=col; c.beginPath(); c.arc(x,y,3.2*k,0,6.284); c.fill();
      c.strokeStyle='#fff'; c.lineWidth=1*k; c.stroke();
      MK.push({id:n.id,bx:bx,by:by,S:Sz});
    });
  }
}
var MK=[];
function syms(){
  var L=Q('#sl'); L.style.display=LAY.syms?'block':'none'; L.innerHTML='';
  (S.symbols||[]).forEach(function(s){
    var d=SD[s.k]; if(!d) return;
    var el=document.createElement('div');
    el.className='sym'; el.style.left=(s.nx*100)+'%'; el.style.top=(s.ny*100)+'%';
    el.innerHTML='<div class="sbx" style="background:'+d.c+'">'+esc(d.t)+'</div><div class="del">×</div>';
    el.querySelector('.del').onclick=function(e){
      e.stopPropagation();
      S.symbols=S.symbols.filter(function(x){return x.id!==s.id;}); render();
    };
    el.onpointerdown=function(e){
      if(e.target.className==='del') return;
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      var b=Q('#box').getBoundingClientRect();
      function mv(ev){
        s.nx=Math.min(1,Math.max(0,(ev.clientX-b.left)/b.width));
        s.ny=Math.min(1,Math.max(0,(ev.clientY-b.top)/b.height));
        el.style.left=(s.nx*100)+'%'; el.style.top=(s.ny*100)+'%';
      }
      function up(){ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); }
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
    };
    L.appendChild(el);
  });
}
Q('#box').addEventListener('click', function(e){
  if(e.target.closest('.sym')) return;
  var b=Q('#box').getBoundingClientRect();
  var nx=(e.clientX-b.left)/b.width, ny=(e.clientY-b.top)/b.height;
  if(TOOL && TOOL.indexOf('sym:')===0){
    S.symbols.push({id:'s'+Date.now(), k:TOOL.slice(4), nx:nx, ny:ny});
    TOOL=null; Q('#box').style.cursor='default'; render(); return;
  }
  var f=fit(), mx=nx*f.w, my=ny*f.h;
  var hit=MK.filter(function(m){
    return mx>=m.bx-5&&mx<=m.bx+m.S+5&&my>=m.by-5&&my<=m.by+m.S+5; })[0];
  SEL=hit?hit.id:null;
  if(hit){ TAB='notes'; render();
    var el=document.getElementById('c-'+hit.id);
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  } else draw();
});
function zoom(z){ ZOOM=Math.min(6,Math.max(0.3,z)); layout(); }
function lay(k,btn){ LAY[k]=!LAY[k]; document.getElementById(btn).classList.toggle('on',LAY[k]); layout(); }

/* ---------- panel ---------- */
var TABS=[['iron','ברזל'],['notes','הערות'],['prog','פרוגרמה'],['open','לא נראה'],['sym','סימונים']];
function render(){
  var f=S.notes.filter(function(n){return n.lv==='f';}).length;
  var w=S.notes.filter(function(n){return n.lv==='w';}).length;
  var io=(S.iron||[]).filter(function(r){return r.level==='o';}).length;
  Q('#tiles').innerHTML=
    tile(f,'שגוי',f?'#E1504B':'')+tile(w,'תיקון קל',w?'#E38B00':'')+
    tile(io+'/4','כללי ברזל',io===4?'#16A34A':'#E1504B')+tile(S.stats.tags,'תגיות','')+
    tile(S.stats.ws||'—','עמדות','')+tile(S.stats.seats||'—','מקומות','')+
    tile(S.stats.area||'—','מ״ר','')+tile((S.symbols||[]).length,'סימבולים','');
  Q('#tabs').innerHTML=TABS.map(function(t){
    return '<button class="tab '+(TAB===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
  var B=Q('#body');
  if(TAB==='notes'){ B.innerHTML=vNotes(); bind(); }
  else if(TAB==='iron') B.innerHTML=vIron();
  else if(TAB==='prog') B.innerHTML=vProg();
  else if(TAB==='open') B.innerHTML=vOpen();
  else B.innerHTML=vSym();
  buildPrint(); draw(); syms();
}
function tile(n,l,c){
  return '<div class="tile"><div class="n"'+(c?' style="color:'+c+'"':'')+'>'+n+'</div><div class="l">'+l+'</div></div>';
}
function setTab(k){ TAB=k; render(); }
function vNotes(){
  if(!S.notes.length) return '<div class="empty">אין הערות.</div>';
  var g=[['f','שגוי — לתיקון'],['w','תיקון קל'],['i','מידע / ידני'],['o','תקין']], h='';
  g.forEach(function(x){
    var L=S.notes.filter(function(n){return n.lv===x[0];});
    if(!L.length) return;
    h+='<div class="gt">'+x[1]+' · '+L.length+'</div>';
    h+=L.map(function(n){
      return '<div class="card '+n.lv+(SEL===n.id?' sel':'')+'" id="c-'+n.id+'" data-id="'+n.id+'">'+
        '<div class="ch"><span class="num '+n.lv+'">'+n.num+'</span>'+
        '<span class="ct">'+esc(n.title)+'</span><span class="cs">'+esc(n.sub)+'</span></div>'+
        '<div class="cb" contenteditable="true" data-id="'+n.id+'">'+esc(n.body)+'</div>'+
        '<div class="cact"><button class="xb" data-a="lv" data-id="'+n.id+'">שנה דרגה</button>'+
        ((n.nx!=null||n.shape==='cloud')?'<button class="xb" data-a="go" data-id="'+n.id+'">הצג</button>':'')+
        '<button class="xb" data-a="del" data-id="'+n.id+'">מחק</button></div></div>';
    }).join('');
  });
  return h;
}
function bind(){
  Q('#body').querySelectorAll('.cb').forEach(function(el){
    el.onblur=function(){
      var n=S.notes.filter(function(x){return x.id===el.dataset.id;})[0];
      if(n) n.body=el.textContent.trim();
    };
  });
  Q('#body').querySelectorAll('.xb[data-a]').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var n=S.notes.filter(function(x){return x.id===b.dataset.id;})[0]; if(!n) return;
      if(b.dataset.a==='lv'){ var o=['f','w','i','o']; n.lv=o[(o.indexOf(n.lv)+1)%4]; renum(); }
      if(b.dataset.a==='go'){ SEL=n.id; }
      if(b.dataset.a==='del'){ S.notes=S.notes.filter(function(x){return x.id!==n.id;}); renum(); }
      render();
    };
  });
}
function renum(){
  var o={f:0,w:1,i:2,o:3};
  S.notes.sort(function(a,b){return o[a.lv]-o[b.lv];});
  S.notes.forEach(function(n,i){ n.num=i+1; });
}
function vIron(){
  return '<div class="gt">כללי ברזל</div>'+(S.iron||[]).map(function(r){
    return '<div class="iron '+r.level+'"><div class="ih"><span class="chip '+
      (r.level==='o'?'o':'f')+'">'+(r.level==='o'?'✓':'חסר')+'</span><span class="it">'+
      esc(r.n)+'</span><span class="cs">'+esc(r.src)+'</span></div><div class="ib">'+esc(r.msg)+'</div></div>';
  }).join('');
}
function vProg(){
  var h='<div class="gt">'+(S.progTitle||'פרוגרמה')+'</div>';
  h+='<table class="pg"><thead><tr><th>פונקציה</th><th>יעד</th><th>בתכנית</th><th>Δ</th></tr></thead><tbody>';
  (S.prog||[]).forEach(function(r){
    h+='<tr class="'+r.cls+'"><td class="fn">'+esc(r.fn)+'</td><td>'+esc(r.goal)+
       '</td><td>'+esc(r.found)+'</td><td>'+esc(r.delta)+'</td></tr>';
  });
  return h+'</tbody></table>';
}
function vOpen(){
  return '<div class="gt">מה שהתכנית לא מגלה</div>'+(S.openList||[]).map(function(c){
    var cur=S.manual[c.id]||'na';
    return '<div class="iron '+(cur==='ok'?'o':cur==='fail'?'f':'w')+'"><div class="ih">'+
      '<span class="it">'+esc(c.n)+'</span><span class="tri">'+
      '<button class="'+(cur==='ok'?'a-ok':'')+'" onclick="mset(\''+c.id+'\',\'ok\')">תקין</button>'+
      '<button class="'+(cur==='fail'?'a-fail':'')+'" onclick="mset(\''+c.id+'\',\'fail\')">לא תקין</button>'+
      '<button class="'+(cur==='na'?'a-na':'')+'" onclick="mset(\''+c.id+'\',\'na\')">פתוח</button>'+
      '</span></div><div class="ib">'+esc(c.note||'')+'</div></div>';
  }).join('');
}
function mset(id,v){ S.manual[id]=v; render(); }
function vSym(){
  var h='<div class="gt">הוסף סימבול — לחץ ואז לחץ על התכנית</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:5px">';
  Object.keys(SD).forEach(function(k){
    var d=SD[k];
    h+='<div class="card" style="border-inline-start-color:'+d.c+'" onclick="arm(\''+k+'\')">'+
       '<div class="ch"><span class="num" style="background:'+d.c+'">'+esc(d.t)+
       '</span><span class="ct" style="font-size:10px">'+esc(d.n)+'</span></div></div>';
  });
  h+='</div><div class="gt">על התכנית · '+(S.symbols||[]).length+'</div>';
  h+=(S.symbols||[]).length ? S.symbols.map(function(s){
    var d=SD[s.k];
    return '<div class="card"><div class="ch"><span class="num" style="background:'+d.c+'">'+
      esc(d.t)+'</span><span class="ct">'+esc(d.n)+'</span></div></div>';
  }).join('') : '<div class="empty">אין סימבולים.</div>';

  var tot=(S.areas||[]).reduce(function(s,a){ return s+(a.m2||0); },0);
  h+='<div class="gt">מדידות שטח · '+(S.areas||[]).length+(tot?' · סה״כ '+tot.toFixed(2)+' מ״ר':'')+'</div>';
  h+=(S.areas||[]).length ? S.areas.map(function(a){
    return '<div class="card" style="border-inline-start-color:'+AREA_CLR+'"><div class="ch">'+
      '<span class="num" style="background:'+AREA_CLR+'">⬚</span>'+
      '<span class="ct">'+esc(a.name||'חדר ללא שם')+'</span>'+
      '<span class="cs">'+esc(a.label||'—')+'</span></div></div>';
  }).join('') : '<div class="empty">אין מדידות שטח.</div>';

  h+='<div class="gt">קווי מידה · '+(S.dims||[]).length+'</div>';
  h+=(S.dims||[]).length ? S.dims.map(function(d,i){
    var col=d.calib?'#0000FF':'#D6009A';
    return '<div class="card" style="border-inline-start-color:'+col+'"><div class="ch">'+
      '<span class="num" style="background:'+col+'">↔</span>'+
      '<span class="ct">קו '+(i+1)+'</span><span class="cs">'+esc(d.label||'—')+'</span></div></div>';
  }).join('') : '<div class="empty">אין קווי מידה.</div>';
  return h;
}
function arm(k){ TOOL='sym:'+k; Q('#box').style.cursor='crosshair'; toast('לחץ על התכנית'); }

  var mm=S.meta||{};

  h+='<div style="font-size:11px;opacity:.6;margin:-4px 0 10px">'+esc(S.floorTitle||'')+'</div>';

  Q('#print').innerHTML=h;

function saveCopy(){
  document.getElementById('stateJSON').textContent=JSON.stringify(S);
  Q('#tiles').innerHTML=''; Q('#tabs').innerHTML=''; Q('#body').innerHTML='';
  Q('#sl').innerHTML=''; Q('#print').innerHTML='';
  var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  var b=new Blob([html],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=(S.title||'testfit')+'-review.html';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
  render();
  toast('עותק מעודכן נשמר');
}
function saveData(){
  var out={ meta:{title:S.title,date:S.date}, notes:S.notes, symbols:S.symbols,
    dims:S.dims, manual:S.manual, program:S.prog };
  var b=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=(S.title||'testfit')+'-data.json'; a.click();
}
window.addEventListener('resize', function(){ clearTimeout(window._rt); window._rt=setTimeout(layout,120); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ TOOL=null; Q('#box').style.cursor='default'; } });
if(IMG.complete) { layout(); render(); }
else IMG.onload=function(){ layout(); render(); };
